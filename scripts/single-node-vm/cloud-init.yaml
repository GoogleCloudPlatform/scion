# Minimal cloud-init for single-node VM: Docker + scion user only.
# IMPORTANT: #cloud-config MUST be the first line of this file.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl

runcmd:
  # Install Docker
  - mkdir -p /etc/apt/keyrings
  - |
    if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    fi
  - |
    if [ ! -f /etc/apt/sources.list.d/docker.list ]; then
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
    fi
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # Create scion user and add to docker group
  - id scion >/dev/null 2>&1 || useradd -m -U -s /bin/bash scion
  - |
    if getent group docker >/dev/null 2>&1; then
      usermod -aG docker scion
    else
      echo "Warning: docker group does not exist yet; skipping usermod"
    fi

  # Create scion directories
  - mkdir -p /home/scion/.scion/plugins/broker
  - mkdir -p /home/scion/.scion/workspace-storage
  - chown -R scion:scion /home/scion/.scion

final_message: "Scion VM provisioning complete"
