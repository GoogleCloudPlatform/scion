schema_version: "1"
active_profile: default
server:
  database:
    driver: sqlite
    url: /tmp/scion.db
  auth:
    session_secret: "__SESSION_SECRET__"
  runtimeBroker:
    port: 9810
profiles:
  default:
    runtime: kubernetes
runtimes:
  kubernetes:
    type: kubernetes
    gke: true
    context: scion-demo-cluster
    namespace: scion-agents
    list_all_namespaces: false
