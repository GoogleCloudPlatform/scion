# Scion data-driven dialect spec for GitHub Copilot CLI hook events.
# Staged to $HOME/.scion/harness/dialect.yaml at agent start.
dialect: copilot

event_name_field: hook_event_name

# Copilot sends the hook payload on stdin. Event names registered in
# camelCase (as provision.py does) select Copilot's camelCase payload format,
# so the fields below use camelCase keys (sessionId, toolName, toolArgs,
# toolResult). See docs.github.com/en/copilot/reference/hooks-configuration.
mappings:
  # Session lifecycle.
  sessionStart:
    event: session-start
    fields:
      session_id: sessionId
      source: source
  sessionEnd:
    event: session-end
    fields:
      session_id: sessionId
      reason: reason

  # Prompt lifecycle.
  userPromptSubmitted:
    event: prompt-submit
    fields:
      prompt: prompt
      session_id: sessionId

  # Tool lifecycle.
  preToolUse:
    event: tool-start
    fields:
      session_id: sessionId
      tool_name: toolName
      tool_input: toolArgs
  postToolUse:
    event: tool-end
    fields:
      session_id: sessionId
      tool_name: toolName
      tool_input: toolArgs
      tool_output: toolResult.textResultForLlm
      # resultType is a string; only "success" counts as a successful tool.
      success: toolResult.resultType

  # Error events. Copilot 1.0.112 sends errorOccurred (errorContext
  # "model_call", recoverable true) both for a model call it retries to
  # success and for one that ends the turn (no agentStop follows), so it is
  # a failed model call, not a failed turn and not a question for the user
  # (fixtures: pkg/sciontool/hooks/dialects/testdata/copilot). Copilot
  # sends no hook for a successful model call, so the event is uncounted:
  # max_model_calls, the API-call metric and usage records do not count
  # it. Only errorContext "model_call" was captured; other contexts are
  # ignored.
  errorOccurred:
    event: model-end
    uncounted: true
    skip_when:
      - field: errorContext
        not_equals: model_call
    fields:
      session_id: sessionId
      error: error.message

  # Agent completion.
  agentStop:
    event: agent-end
    fields:
      session_id: sessionId
  subagentStop:
    event: subagent-end
    fields:
      session_id: sessionId
