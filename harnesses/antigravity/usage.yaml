# Live Track 1 usage metering capability for antigravity.
# PostInvocation hooks report calls without error/failed-attempt status (dialect.yaml
# maps no PostInvocation error field); sciontool's read-only SQLite protobuf tailer
# decodes ~/.gemini/antigravity-cli/conversations/*.db for tokens (input, output
# inclusive of reasoning, cache_read, cache_write, reasoning).
# Verified against agy 1.5.18; unknown versions or malformed rows degrade to calls-only
# with schema_drift_detected=true.
schema_version: 1
usage:
  live:
    source: sqlite_native
    token_types:
      - input
      - output
      - cache_read
      - cache_write
      - reasoning
    not_applicable_token_types: []
    counts_failed_calls: false
