dialect: antigravity
event_name_field: hook_event_name
mappings:
  # modelName is agy's display alias for the configured model (e.g.
  # gemini-3.1-pro-low; the API may be called as a different concrete
  # model). It is still the payload's own model value, so it takes
  # precedence over SCION_MODEL for the model label (design §3.2).
  PreInvocation:
    event: model-start
    fields:
      session_id: .conversationId
      model: .modelName
  PostInvocation:
    event: model-end
    fields:
      session_id: .conversationId
      model: .modelName
  PreToolUse:
    event: tool-start
    fields:
      tool_name: .toolCall.name
      tool_input: .toolCall.args
      session_id: .conversationId
  PostToolUse:
    event: tool-end
    fields:
      # agy 1.2.12's PostToolUse payload repeats the PreToolUse toolCall
      # ({name, args}) alongside stepIdx and error (see
      # pkg/sciontool/hooks/dialects/testdata/antigravity), so the tool-end
      # metric carries the same tool_name label as its tool-start.
      tool_name: .toolCall.name
      error: .error
      session_id: .conversationId
  Stop:
    event: agent-end
    fields:
      reason: .terminationReason
      error: .error
      session_id: .conversationId
responses:
  PreToolUse:
    decision: allow
  PostToolUse: {}
  PreInvocation: {}
  PostInvocation: {}
  Stop: {}
