# Scion data-driven dialect spec for pi hook events.
# Staged to $HOME/.scion/harness/dialect.yaml at agent start.
#
# Every raw event name below is emitted by
# home/.pi/agent/extensions/scion-bridge.js from pi's extension events.
#
#   session-start    <- session_start
#   prompt-submit    <- input                 (human/RPC input only)
#   tool-start       <- tool_execution_start
#   tool-end         <- tool_execution_end
#   agent-end        <- agent_end             (carries a failed run's error)
#
# Unmapped scion events (no pi extension event is forwarded):
#   agent-start, subagent-end, session-end, response-complete,
#   model-start, model-end, notification
#
# task_completed is not a dialect event: the bridge runs
# `sciontool status task_completed` when pi reports agent_settled for a run
# that neither aborted nor ended in a provider error. ask_user and blocked
# are signalled by the agent through `sciontool status` per its instructions.
dialect: pi

event_name_field: hook_event_name

mappings:
  session_start:
    event: session-start

  input:
    event: prompt-submit

  tool_execution_start:
    event: tool-start
    fields:
      tool_name: tool_name
      tool_input: tool_input

  tool_execution_end:
    event: tool-end
    fields:
      tool_name: tool_name
      success: success

  agent_end:
    event: agent-end
    fields:
      error: error
