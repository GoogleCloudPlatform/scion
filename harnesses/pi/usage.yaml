# Live Track 1 usage metering capability for pi.
# Hook bridge (scion-bridge.js assistant message_end); compaction and branch-summary
# calls are not visible to Track 1.
schema_version: 1
usage:
  live:
    source: hooks
    token_types:
      - input
      - output
      - cache_read
      - cache_write
      - reasoning
    not_applicable_token_types: []
    counts_failed_calls: true
