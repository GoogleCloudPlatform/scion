check_for_update_on_startup = false
approval_policy = "never"

notify = ["sh", "/home/scion/.codex/scion_notify.sh"]

# model is intentionally not set here. provision.py's _reconcile_codex_toml
# writes the resolved model (from SCION_MODEL, itself resolved from this
# harness's model_aliases/default model in config.yaml) at agent start, so a
# static value here would silently win whenever it drifted from the current
# aliases (ptone/scion#2365).

[features]
hooks = true

# Hook wiring. Every registered event runs scion_notify.sh, which forwards it
# to `sciontool hook --dialect=codex` (mapped by ../../dialect.yaml).
# Verified against @openai/codex 0.162.1 (rust-v0.162.1, commit 092d3acd6bec,
# codex-rs/config/src/hook_config.rs HookEventsToml). The Dockerfile installs
# @openai/codex@latest, so re-check when codex changes its hook events.
#
# Registered: SessionStart, SessionEnd, UserPromptSubmit, PreToolUse,
# PostToolUse, Stop, SubagentStop. An empty matcher matches everything. Codex
# matches SessionStart on `source` (startup|resume|clear|compact|fork),
# SessionEnd on `reason`, SubagentStop on `agent_type`, and the tool events on
# the tool name. It ignores the matcher for UserPromptSubmit and Stop.
#
# Not registered: SubagentStart, PermissionRequest, PreCompact, PostCompact
# and Interrupt. Codex 0.162.1 supports them, but Scion's codex dialect has no
# mapping for them, so they would carry no status. SubagentStop fires instead
# of Stop when a spawned sub-agent finishes. SessionEnd fires only for the
# root session, when codex shuts down.

[[hooks.SessionStart]]
matcher = ""

[[hooks.SessionStart.hooks]]
type = "command"
command = "sh /home/scion/.codex/scion_notify.sh"
timeout = 5
statusMessage = "Updating Scion status"

[[hooks.SessionEnd]]
matcher = ""

[[hooks.SessionEnd.hooks]]
type = "command"
command = "sh /home/scion/.codex/scion_notify.sh"
timeout = 5
statusMessage = "Updating Scion status"

[[hooks.UserPromptSubmit]]
matcher = ""

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "sh /home/scion/.codex/scion_notify.sh"
timeout = 5
statusMessage = "Updating Scion status"

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "sh /home/scion/.codex/scion_notify.sh"
timeout = 5
statusMessage = "Updating Scion status"

[[hooks.PostToolUse]]
matcher = ".*"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "sh /home/scion/.codex/scion_notify.sh"
timeout = 5
statusMessage = "Updating Scion status"

[[hooks.Stop]]
matcher = ""

[[hooks.Stop.hooks]]
type = "command"
command = "sh /home/scion/.codex/scion_notify.sh"
timeout = 5
statusMessage = "Updating Scion status"

[[hooks.SubagentStop]]
matcher = ""

[[hooks.SubagentStop.hooks]]
type = "command"
command = "sh /home/scion/.codex/scion_notify.sh"
timeout = 5
statusMessage = "Updating Scion status"

[notice.model_migrations]
"gpt-5.1-codex-mini" = "gpt-5.2-codex"
"gpt-5.2" = "gpt-5.5"
"gpt-5.2-codex" = "gpt-5.3-codex"
"gpt-5.3-codex" = "gpt-5.4"
"gpt-5.4" = "gpt-5.5"

[projects."/workspace"]
trust_level = "trusted"

[otel]
# Scion reconciles these values at agent start time when telemetry is enabled.
enabled = false
environment = "production"
log_user_prompt = false   # redact user prompts unless explicitly enabled
metrics_exporter = "statsig"
exporter."otlp-grpc".endpoint = "localhost:4317"
exporter."otlp-grpc".headers = { "x-otlp-meta" = "abc123" }
trace_exporter."otlp-grpc".endpoint = "localhost:4317"
trace_exporter."otlp-grpc".headers = { "x-otlp-meta" = "abc123" }
