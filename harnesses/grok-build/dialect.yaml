# Scion data-driven dialect spec for xAI Grok Build CLI hook events.
# Staged to $HOME/.scion/harness/dialect.yaml at agent start.
dialect: grok-build

event_name_fields: [hookEventName, hook_event_name, type]

mappings:
  # Session lifecycle.
  SessionStart:
    event: session-start
  SessionEnd:
    event: session-end

  # Prompt lifecycle.
  UserPromptSubmit:
    event: prompt-submit
    fields:
      prompt: prompt

  # Agent completion.
  Stop:
    event: agent-end
  StopFailure:
    event: agent-end
    fields:
      error: error
  StopCancelled:
    event: agent-end

  # Tool lifecycle.
  PreToolUse:
    event: tool-start
    fields:
      tool_name: toolName
      tool_input: toolInput
  PostToolUse:
    event: tool-end
    fields:
      tool_name: toolName
      tool_output: toolResult
  PostToolUseFailure:
    event: tool-end
    fields:
      tool_name: toolName
      error: error

  # Subagent lifecycle.
  SubagentStop:
    event: subagent-end

  # Notifications.
  Notification:
    event: notification
    fields:
      message: message
