harness: grok-build
image: scion-grok-build:latest
user: scion

provisioner:
  type: container-script
  interface_version: 1
  lib: vendored
  command: ["python3", "/home/scion/.scion/harness/provision.py"]
  timeout: 30s
  lifecycle_events:
    - pre-start
  required_image_tools:
    - python3

config_dir: .grok
skills_dir: .grok/skills
interrupt_key: C-c
instructions_file: AGENTS.md
system_prompt_mode: prepend_to_instructions

model_aliases:
  small: grok-3-mini
  medium: grok-3
  large: grok-4
  extra-large: grok-4

command:
  base: ["grok", "-p", "--yolo", "--sandbox", "off"]
  resume_flag: "-c"
  task_position: after_base_args

env_template:
  SCION_AGENT_NAME: "{{ .AgentName }}"
  GROK_HOME: "{{ .AgentHome }}/.grok"
  NO_COLOR: "1"

capabilities:
  limits:
    max_turns: { support: "yes" }
    max_model_calls: { support: "no", reason: "Grok hooks do not expose model-call start/end events" }
    max_duration: { support: "yes" }
  telemetry:
    enabled: { support: "yes" }
    native_emitter: { support: "yes" }
  prompts:
    system_prompt: { support: "partial", reason: "System prompt is prepended to AGENTS.md" }
    agent_instructions: { support: "yes" }
  auth:
    api_key: { support: "yes" }
    auth_file: { support: "yes" }
    oauth_token: { support: "no" }
    vertex_ai: { support: "yes" }
  mcp:
    stdio: { support: "yes" }
    sse: { support: "yes" }
    streamable_http: { support: "yes" }
    project_scope: { support: "no", reason: "Project-scoped MCP not implemented; entries demoted to global" }

no_auth:
  behavior: drop-to-shell
  command: grok login --device-auth
  message: |
    This agent started without credentials.
    Run: grok login --device-auth
    Then run: python3 /home/scion/.scion/harness/capture_auth.py

auth:
  default_type: api-key
  types:
    api-key:
      required_env:
        - any_of: ["XAI_API_KEY"]
    auth-file:
      required_files:
        - name: GROK_AUTH
          type: file
          target_suffix: "/.grok/auth.json"
          field: GrokAuthFile
    vertex-ai:
      required_env:
        - any_of: ["GOOGLE_CLOUD_PROJECT"]
        - any_of: ["GOOGLE_CLOUD_REGION", "CLOUD_ML_REGION", "GOOGLE_CLOUD_LOCATION"]
      required_files:
        - name: gcloud-adc
          type: file
          description: "Google Cloud Application Default Credentials (ADC) file for vertex-ai authentication"
          field: GoogleAppCredentials
          alternative_env_keys: ["GOOGLE_APPLICATION_CREDENTIALS"]
          skipped_when_gcp_service_account_assigned: true
          required: true
  autodetect:
    env:
      XAI_API_KEY: api-key
      GOOGLE_APPLICATION_CREDENTIALS: vertex-ai
      GOOGLE_CLOUD_PROJECT: vertex-ai
    files:
      GROK_AUTH: auth-file
      gcloud-adc: vertex-ai
