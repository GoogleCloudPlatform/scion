harness: muse-code
image: scion-muse-code:latest
user: scion

provisioner:
  type: container-script
  interface_version: 1
  lib: vendored
  command: ["python3", "/home/scion/.scion/harness/provision.py"]
  timeout: 30s
  lifecycle_events:
    - pre-start
  required_image_tools:
    - python3

config_dir: .config/muse
skills_dir: .muse/skills
interrupt_key: Escape
instructions_file: AGENTS.md
system_prompt_mode: prepend_to_instructions

model_aliases:
  small: muse-spark-1.2
  medium: muse-spark-1.2
  large: muse-spark-1.2
  extra-large: muse-spark-1.2

command:
  base: ["muse", "--yolo"]
  # Resume is an interactive slash command (/resume --last) only; no CLI flag.
  task_position: after_base_args

capabilities:
  limits:
    max_turns: { support: "yes" }
    max_model_calls: { support: "yes" }
    max_duration: { support: "yes" }
  telemetry:
    enabled: { support: "yes" }
    native_emitter: { support: "no", reason: "Telemetry format not documented" }
  prompts:
    system_prompt: { support: "partial", reason: "System prompt is prepended to AGENTS.md" }
    agent_instructions: { support: "yes" }
  auth:
    api_key: { support: "yes" }
    auth_file: { support: "no", reason: "No documented file-based auth for Muse Code" }
    oauth_token: { support: "no" }
    vertex_ai: { support: "no", reason: "Meta model, not available on Vertex AI" }
  mcp:
    stdio: { support: "yes" }
    sse: { support: "partial", reason: "SSE mapped to streamable_http" }
    streamable_http: { support: "yes" }
    project_scope: { support: "no", reason: "Project-scoped MCP not implemented; entries demoted to global" }
  resume: { support: "partial", reason: "Interactive slash command only, no CLI flag" }

no_auth:
  behavior: drop-to-shell
  command: muse auth set
  message: |
    This agent started without credentials.
    Run: muse auth set
    Then run: python3 /home/scion/.scion/harness/capture_auth.py

auth:
  default_type: api-key
  types:
    api-key:
      required_env:
        - any_of: ["META_API_KEY"]
  autodetect:
    env:
      META_API_KEY: api-key

mcp:
  global_config_file: .config/muse/settings.json
  global_config_path: mcp_servers
  transport_field: transport
  transport_map:
    stdio: stdio
    sse: streamable_http
    streamable-http: streamable_http
