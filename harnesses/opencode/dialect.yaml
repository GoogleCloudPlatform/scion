# Scion data-driven dialect spec for OpenCode hook events.
# Staged to $HOME/.scion/harness/dialect.yaml at agent start.
#
# Event coverage analysis against the full scion event grammar:
#   session-start    <- session.created       (direct match)
#   session-end      <- session.error         (error-path only; no clean-exit hook)
#   agent-end        <- session.idle          (agent turn completed)
#   tool-start       <- tool.execute.before   (direct match)
#   tool-end         <- tool.execute.after    (direct match)
#   prompt-submit    <- permission.replied    (user responded to permission prompt)
#   notification     <- permission.asked      (waiting for user input)
#   model-end        <- message.updated       (proxy; no explicit model-start/model-end)
#
# Unmapped scion events (no OpenCode hook available):
#   agent-start      - no hook fires when an agent turn begins
#   subagent-end     - OpenCode has no subagent lifecycle concept
#   response-complete - no direct equivalent; session.idle covers turn end
#   model-start      - no hook fires at model invocation start
dialect: opencode

event_name_field: hook_event_name

mappings:
  # Session lifecycle.
  session.created:
    event: session-start
    fields:
      session_id: session_id

  session.error:
    event: session-end
    fields:
      error: error
      reason: reason

  # Agent turn completion.
  session.idle:
    event: agent-end

  # Tool lifecycle.
  tool.execute.before:
    event: tool-start
    fields:
      tool_name: tool_name
      tool_input: tool_input

  tool.execute.after:
    event: tool-end
    fields:
      tool_name: tool_name
      success: success
      error: error

  # Model response (proxy for model-end; no explicit model-start available).
  message.updated:
    event: model-end
    fields:
      assistant_text: assistant_text

  # User interaction.
  permission.asked:
    event: notification
    fields:
      message: message

  permission.replied:
    event: prompt-submit
