# Scion data-driven dialect spec for LHH (Long-Horizon Harness) hook events.
# Staged to $HOME/.scion/harness/dialect.yaml at agent start.
dialect: lhh

# Backward-compatible single field for current MappingDialect loaders.
event_name_field: hook_event_name

# ADK callback names as event identifiers, tried in order.
event_name_fields:
  - hook_event_name
  - type
  - event

mappings:
  BeforeAgent:
    event: prompt-submit
    fields:
      session_id: session_id

  AfterAgent:
    event: response-complete
    fields:
      assistant_text: response_text

  BeforeTool:
    event: tool-start
    fields:
      tool_name: tool_name
      tool_input: tool_input

  AfterTool:
    event: tool-end
    fields:
      tool_name: tool_name
      tool_output: tool_output

  BeforeModel:
    event: model-start

  AfterModel:
    event: model-end
