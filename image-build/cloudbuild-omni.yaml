# Omni image chain for Cloud Run Instances single-node deployment.
# Architecture: amd64 only.
#
# Chain: thick-prep -> scion-base -> claude -> codex -> opencode ->
#        antigravity -> grok-build -> omni
#
# Each step builds in the local daemon so the next step can use it as
# BASE_IMAGE. Only scion-omni is pushed (via the images: section).
#
# INVOCATION (exact working command):
#
#   CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT=<sa-email> \
#   CLOUDSDK_BILLING_QUOTA_PROJECT=ptone-experiments \
#     gcloud builds submit \
#       --project=ptone-experiments \
#       --config=image-build/cloudbuild-omni.yaml \
#       --substitutions="_TAG=dev-$(git rev-parse --short HEAD),_REGISTRY=us-central1-docker.pkg.dev/ptone-experiments/scion" \
#       --ignore-file=image-build/gcloudignore-omni \
#       --gcs-source-staging-dir=gs://ptone-experiments_cloudbuild/source \
#       --async .
#
# WHY CLOUDSDK_BILLING_QUOTA_PROJECT: When impersonating a SA from a
#   different project, gcloud checks API enablement on the caller's
#   project (quota project). If Cloud Build API is not enabled there,
#   the call fails with SERVICE_DISABLED even though the target project
#   has it enabled. Setting the quota project to the target works around
#   this.
#
# WHY --ignore-file: The default .gcloudignore excludes web source
#   files (web/*.json, web/src/, etc.) because existing configs compile
#   Go with -tags no_embed_web. The omni Dockerfile rebuilds scion
#   WITHOUT that tag, running npm install && npm run build. Without
#   the custom ignore file, step 8 (build-scion-omni) fails with
#   ENOENT on web/package.json.
steps:
  # Stage 1: Build thick-prep
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-thick-prep'
    dir: 'image-build/thick-prep'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '$_REGISTRY/thick-prep:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 2: Build scion-base on thick-prep
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-base'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/thick-prep:$_TAG'
      - '--build-arg'
      - 'GIT_COMMIT=$COMMIT_SHA'
      - '-t'
      - '$_REGISTRY/scion-base:$_TAG'
      - '-f'
      - 'image-build/scion-base/Dockerfile'
      - '.'

  # Stage 3: scion-claude (from scion-base)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-claude'
    dir: 'harnesses/claude'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-base:$_TAG'
      - '-t'
      - '$_REGISTRY/scion-claude:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 4: scion-codex (from scion-claude)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-codex'
    dir: 'harnesses/codex'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-claude:$_TAG'
      - '-t'
      - '$_REGISTRY/scion-codex:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 5: scion-opencode (from scion-codex)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-opencode'
    dir: 'harnesses/opencode'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-codex:$_TAG'
      - '-t'
      - '$_REGISTRY/scion-opencode:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 6: scion-antigravity (from scion-opencode)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-antigravity'
    dir: 'harnesses/antigravity'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-opencode:$_TAG'
      - '-t'
      - '$_REGISTRY/scion-antigravity:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 7: scion-grok-build (from scion-antigravity)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-grok-build'
    dir: 'harnesses/grok-build'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-antigravity:$_TAG'
      - '-t'
      - '$_REGISTRY/scion-grok-build:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Stage 8: scion-omni (from scion-grok-build) — the final image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-omni'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-grok-build:$_TAG'
      - '--build-arg'
      - 'GIT_COMMIT=$COMMIT_SHA'
      - '-t'
      - '$_REGISTRY/scion-omni:$_TAG'
      - '-f'
      - 'image-build/omni/Dockerfile'
      - '.'

# Push only scion-omni (the final deliverable).
images:
  - '$_REGISTRY/scion-omni:$_TAG'

substitutions:
  _REGISTRY: 'us-central1-docker.pkg.dev/${PROJECT_ID}/scion'
  _TAG: 'latest'
options:
  dynamicSubstitutions: true
  machineType: 'E2_HIGHCPU_8'
timeout: 7200s
