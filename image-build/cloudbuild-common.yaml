# Common rebuild: scion-base, scion-hub, and catalog harness images.
# Skips core-base and uses existing core-base:<_TAG>.
#
# Step graph:
#   setup -> build-scion-base -> build-scion-hub -> harness chain (allowFailure) -> verify-harness-builds
#
# build-scion-hub runs immediately after build-scion-base so a failing harness
# image can never block scion-hub from building and pushing. Each harness step
# runs sequentially after the previous one (to avoid concurrent multi-arch QEMU
# buildx contention on E2_HIGHCPU_8) with allowFailure: true so a single broken
# harness does not prevent subsequent harnesses from building and pushing.
# Each harness records its pushed digest under /builder/home/.build-step-status
# via buildx-record-digest.sh, and verify-harness-builds fails the overall
# Cloud Build visibly if any harness did not succeed.
steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'verify-registry'
    waitFor: ['-']
    entrypoint: 'bash'
    args: ['image-build/scripts/verify-registry.sh', '$_REGISTRY']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'setup-buildx'
    waitFor: ['verify-registry']
    args: ['buildx', 'create', '--name', 'mybuilder', '--use']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'bootstrap-buildx'
    waitFor: ['setup-buildx']
    args: ['buildx', 'inspect', '--bootstrap']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'

  # A push 61 minutes into ptone/scion image build a979045d failed registry
  # token auth (401). Install a credential helper so every push gets a fresh
  # access token at push time instead of a credential obtained earlier in the
  # build. Push steps put /builder/home/bin on PATH so the docker CLI finds it.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'install-registry-cred-helper'
    waitFor: ['bootstrap-buildx']
    entrypoint: 'bash'
    args: ['image-build/scripts/install-registry-cred-helper.sh', '$_REGISTRY']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'verify-registry-cred-helper'
    waitFor: ['install-registry-cred-helper']
    entrypoint: 'bash'
    args: ['image-build/scripts/install-registry-cred-helper.sh', '--verify', '$_REGISTRY']
    env:
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-base'
    waitFor: ['verify-registry-cred-helper']
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-base:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/core-base:$_TAG', '--build-arg', 'GIT_COMMIT=$_COMMIT_SHA', '--build-arg', 'VERSION=$_VERSION', '--build-arg', 'BUILD_TIME=$_BUILD_TIME', '--build-arg', 'SCION_BINARIES=$_SCION_BINARIES', '--build-arg', 'SCION_RELEASE_TAG=$_SCION_RELEASE_TAG', '-t', '$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-base:$_TAG', '-f', 'image-build/scion-base/Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-hub'
    waitFor: ['build-scion-base']
    dir: 'image-build/hub'
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-hub:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-hub:$_SHORT_SHA', '-t', '$_REGISTRY/scion-hub:$_TAG', '-f', 'Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-antigravity'
    waitFor: ['build-scion-hub']
    allowFailure: true
    dir: 'harnesses/antigravity'
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-antigravity:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-antigravity:$_SHORT_SHA', '-t', '$_REGISTRY/scion-antigravity:$_TAG', '-f', 'Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - 'BUILD_STEP_STATUS_DIR=/builder/home/.build-step-status'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-claude'
    waitFor: ['build-scion-antigravity']
    allowFailure: true
    dir: 'harnesses/claude'
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-claude:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-claude:$_SHORT_SHA', '-t', '$_REGISTRY/scion-claude:$_TAG', '-f', 'Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - 'BUILD_STEP_STATUS_DIR=/builder/home/.build-step-status'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-codex'
    waitFor: ['build-scion-claude']
    allowFailure: true
    dir: 'harnesses/codex'
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-codex:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-codex:$_SHORT_SHA', '-t', '$_REGISTRY/scion-codex:$_TAG', '-f', 'Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - 'BUILD_STEP_STATUS_DIR=/builder/home/.build-step-status'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-copilot'
    waitFor: ['build-scion-codex']
    allowFailure: true
    dir: 'harnesses/copilot'
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-copilot:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-copilot:$_SHORT_SHA', '-t', '$_REGISTRY/scion-copilot:$_TAG', '-f', 'Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - 'BUILD_STEP_STATUS_DIR=/builder/home/.build-step-status'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-gemini-cli'
    waitFor: ['build-scion-copilot']
    allowFailure: true
    dir: 'harnesses/gemini-cli'
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-gemini-cli:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-gemini-cli:$_SHORT_SHA', '-t', '$_REGISTRY/scion-gemini-cli:$_TAG', '-f', 'Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - 'BUILD_STEP_STATUS_DIR=/builder/home/.build-step-status'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-grok-build'
    waitFor: ['build-scion-gemini-cli']
    allowFailure: true
    dir: 'harnesses/grok-build'
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-grok-build:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-grok-build:$_SHORT_SHA', '-t', '$_REGISTRY/scion-grok-build:$_TAG', '-f', 'Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - 'BUILD_STEP_STATUS_DIR=/builder/home/.build-step-status'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-hermes'
    waitFor: ['build-scion-grok-build']
    allowFailure: true
    dir: 'harnesses/hermes'
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-hermes:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-hermes:$_SHORT_SHA', '-t', '$_REGISTRY/scion-hermes:$_TAG', '-f', 'Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - 'BUILD_STEP_STATUS_DIR=/builder/home/.build-step-status'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-muse-code'
    waitFor: ['build-scion-hermes']
    allowFailure: true
    dir: 'harnesses/muse-code'
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-muse-code:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-muse-code:$_SHORT_SHA', '-t', '$_REGISTRY/scion-muse-code:$_TAG', '-f', 'Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - 'BUILD_STEP_STATUS_DIR=/builder/home/.build-step-status'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-opencode'
    waitFor: ['build-scion-muse-code']
    allowFailure: true
    dir: 'harnesses/opencode'
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-opencode:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-opencode:$_SHORT_SHA', '-t', '$_REGISTRY/scion-opencode:$_TAG', '-f', 'Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - 'BUILD_STEP_STATUS_DIR=/builder/home/.build-step-status'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-pi'
    waitFor: ['build-scion-opencode']
    allowFailure: true
    dir: 'harnesses/pi'
    entrypoint: 'bash'
    args: ['/workspace/image-build/scripts/buildx-record-digest.sh', '$_REGISTRY/scion-pi:$_TAG', 'buildx', 'build', '--platform', 'linux/amd64,linux/arm64', '--build-arg', 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA', '-t', '$_REGISTRY/scion-pi:$_SHORT_SHA', '-t', '$_REGISTRY/scion-pi:$_TAG', '-f', 'Dockerfile', '--pull', '--push', '.']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - 'BUILD_STEP_STATUS_DIR=/builder/home/.build-step-status'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'verify-harness-builds'
    waitFor:
      - 'build-scion-antigravity'
      - 'build-scion-claude'
      - 'build-scion-codex'
      - 'build-scion-copilot'
      - 'build-scion-gemini-cli'
      - 'build-scion-grok-build'
      - 'build-scion-hermes'
      - 'build-scion-muse-code'
      - 'build-scion-opencode'
      - 'build-scion-pi'
    entrypoint: 'bash'
    args: ['image-build/scripts/verify-harness-builds.sh', '/builder/home/.build-step-status']

substitutions:
  _REGISTRY: 'us-central1-docker.pkg.dev/${PROJECT_ID}/public-docker'
  _TAG: 'latest'
  _VERSION: ''
  _BUILD_TIME: ''
  _SCION_BINARIES: 'source'
  _SCION_RELEASE_TAG: ''
options:
  dynamicSubstitutions: true
  machineType: 'E2_HIGHCPU_8'
timeout: 7200s # 2 hours - scion-base step alone took ~40m (build 14e5e1c1)
