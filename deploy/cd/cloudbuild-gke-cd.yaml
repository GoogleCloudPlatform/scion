# Production Continuous Delivery pipeline for one Scion hub on GKE Autopilot
# (deploy/terraform/configurations/hub-gke).
#
# Designed to run from a Cloud Build Trigger invoked daily by Cloud Scheduler
# (e.g. 05:00 UTC) or manually via `gcloud builds triggers run`. See
# deploy/cd/README.md and deploy/cd/scripts/setup-cd.sh for setup, least-privilege
# CD service account IAM, two-pass IAP bootstrap, DNS, and rollback guidance.
#
# Execution summary:
#   1. resolve-and-check-noop:
#        Resolves target version from _VERSION_TAG or LATEST.json (.channels[$_CHANNEL].version),
#        short-circuits in ~10s via /workspace/SKIP_DEPLOY when deployed.json and live
#        default.tfstate outputs are already converged, and guards against downgrades.
#   2. checkout-release-tag:
#        Shallow-clones _REPO_URL at the resolved release tag into /workspace/release-src,
#        verifies exact tag match, and writes COMMIT_SHA, SHORT_SHA, BUILD_TIME to build.env.
#   3. prepare-build-images + build-images:
#        Installs a GCE metadata Docker credential helper (preventing 60-minute OAuth token
#        expiry), skips already-built images on retry, caches core-base by content+platform
#        hash, builds version-stamped scion-hub-gke + core-base + scion-base + catalog
#        harnesses from /workspace/release-src, and captures scion-hub-gke's sha256 digest.
#   4. fetch-hub-tfvars + terraform-apply-hub-gke + record-deployed:
#        Downloads hub.tfvars from GCS, runs Terraform 1.9.8 (acquiring a fresh OAuth token
#        for the kubernetes and helm providers) through init -> plan -> apply -> post-apply
#        convergence check (-detailed-exitcode), and writes updated deployed.json to GCS.

steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'resolve-and-check-noop'
    entrypoint: 'bash'
    args: ['deploy/cd/scripts/resolve-and-check-noop.sh']
    env:
      - '_CHANNEL=$_CHANNEL'
      - '_VERSION_TAG=$_VERSION_TAG'
      - '_STATE_BUCKET=$_STATE_BUCKET'
      - '_SHARED_PREFIX=$_SHARED_PREFIX'
      - '_HUB_NAME=$_HUB_NAME'
      - '_REGISTRY=$_REGISTRY'
      - '_AGENT_PLATFORMS=$_AGENT_PLATFORMS'
      - '_FORCE_REDEPLOY=$_FORCE_REDEPLOY'
      - '_ALLOW_DOWNGRADE=$_ALLOW_DOWNGRADE'
      - '_REPO_URL=$_REPO_URL'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'checkout-release-tag'
    entrypoint: 'bash'
    args: ['deploy/cd/scripts/checkout-release-tag.sh']
    env:
      - '_REPO_URL=$_REPO_URL'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'prepare-build-images'
    entrypoint: 'bash'
    args: ['deploy/cd/scripts/build-images.sh', '--phase', 'prepare']
    env:
      - '_REGISTRY=$_REGISTRY'
      - '_AGENT_PLATFORMS=$_AGENT_PLATFORMS'
      - '_FORCE_REDEPLOY=$_FORCE_REDEPLOY'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-images'
    entrypoint: 'bash'
    args: ['deploy/cd/scripts/build-images.sh', '--phase', 'build']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'
      - 'PATH=/builder/home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      - '_REGISTRY=$_REGISTRY'
      - '_AGENT_PLATFORMS=$_AGENT_PLATFORMS'
      - '_FORCE_REDEPLOY=$_FORCE_REDEPLOY'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'fetch-hub-tfvars'
    entrypoint: 'bash'
    args: ['deploy/cd/scripts/gcs-hub-state.sh', 'fetch-tfvars']
    env:
      - '_STATE_BUCKET=$_STATE_BUCKET'
      - '_SHARED_PREFIX=$_SHARED_PREFIX'
      - '_HUB_NAME=$_HUB_NAME'

  - name: 'hashicorp/terraform:1.9.8'
    id: 'terraform-apply-hub-gke'
    entrypoint: 'sh'
    args: ['deploy/cd/scripts/terraform-apply-hub-gke.sh']
    env:
      - 'SKIP_WRITE_DEPLOYED=true'
      - '_STATE_BUCKET=$_STATE_BUCKET'
      - '_SHARED_PREFIX=$_SHARED_PREFIX'
      - '_HUB_NAME=$_HUB_NAME'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'record-deployed'
    entrypoint: 'bash'
    args: ['deploy/cd/scripts/gcs-hub-state.sh', 'write-deployed']
    env:
      - 'BUILD_ID=$BUILD_ID'
      - '_STATE_BUCKET=$_STATE_BUCKET'
      - '_SHARED_PREFIX=$_SHARED_PREFIX'
      - '_HUB_NAME=$_HUB_NAME'

substitutions:
  _CHANNEL: 'nightly'
  _VERSION_TAG: ''
  _STATE_BUCKET: ''
  _SHARED_PREFIX: ''
  _HUB_NAME: ''
  _REGISTRY: ''
  _AGENT_PLATFORMS: 'linux/amd64'
  _FORCE_REDEPLOY: 'false'
  _ALLOW_DOWNGRADE: 'false'
  _REPO_URL: 'https://github.com/GoogleCloudPlatform/scion.git'

options:
  dynamicSubstitutions: true
  machineType: 'E2_HIGHCPU_8'
  logging: 'CLOUD_LOGGING_ONLY'

timeout: 14400s
