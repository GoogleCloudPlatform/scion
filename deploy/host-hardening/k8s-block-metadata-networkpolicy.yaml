#
# Example Kubernetes NetworkPolicy restricting egress from `block`-mode Scion
# agent pods so they cannot reach the cloud metadata server (169.254.169.254/32)
# or the GKE metadata server (169.254.169.252/32).
#
# IMPORTANT PREREQUISITES & CAVEATS:
# - Requires an enforcing CNI (for example GKE Dataplane V2 or Calico). On a
#   cluster without NetworkPolicy enforcement, `kubectl apply` succeeds
#   silently without enforcing the rule.
# - Must NOT be applied to `assign` or `passthrough` pods, which legitimately
#   reach the GKE metadata server for Workload Identity tokens. The selector
#   below targets only pods carrying `scion.metadata-mode: block`.
# - Replace `scion-agents` with your agent namespace before applying.
# - On dual-stack clusters, add an IPv6 egress rule (for example `::/0` except
#   `fd20:ce::254/128` and `fd00:ec2::254/128`) if pods require IPv6 egress.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scion-block-agent-metadata-egress
  namespace: scion-agents
spec:
  podSelector:
    matchLabels:
      scion.metadata-mode: block
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
              - 169.254.169.252/32
