{{- include "scion-hub.assertNoCredentialsInValues" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scion-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion-hub.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "scion-hub.selectorLabels" . | nindent 4 }}
