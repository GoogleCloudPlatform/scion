{{- $hubId := include "scion-hub.hubId" . }}
{{- if hasKey .Values.hub.podAnnotations "scion.io/hub-id" }}
{{- fail "hub.podAnnotations may not set scion.io/hub-id: it is rendered from hub.hubId and a second source for the hub's identity is exactly the divergence the explicit hub ID exists to prevent." }}
{{- end }}
{{- $strategy := include "scion-hub.updateStrategyType" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scion-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion-hub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ $strategy }}
    {{- if eq $strategy "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "scion-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scion-hub.labels" . | nindent 8 }}
      annotations:
        {{- /*
        The hub ID the operator supplied, verbatim, from the same helper every
        other rendering of it uses, so the positions cannot drift. It is an
        annotation and not a label because a hub ID is not constrained to the
        label character set. Changing it rolls the pods, which is correct: the
        hub's identity, and with it its storage prefixes and secret scopes, has
        changed.
        */}}
        scion.io/hub-id: {{ $hubId | quote }}
        {{- with .Values.hub.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "scion-hub.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "scion-hub.nonRootSecurityContext" . | nindent 8 }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: {{ include "scion-hub.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "scion-hub.hubArgs" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.hub.webPort }}
              protocol: TCP
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          {{- end }}
          securityContext:
            {{- /*
            Repeated at the container level on purpose. A container-level
            securityContext shadows the pod-level one field by field, so
            restating runAsNonRoot here means the hub container cannot be
            returned to root by anything that only reaches the pod-level block.
            */}}
            {{- include "scion-hub.nonRootSecurityContext" . | nindent 12 }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- with .Values.hub.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.hub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
