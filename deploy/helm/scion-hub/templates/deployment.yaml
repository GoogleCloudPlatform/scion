{{- $hubId := include "scion-hub.hubId" . }}
{{- $podAnnotations := .Values.hub.podAnnotations | default dict }}
{{- $podLabels := .Values.hub.podLabels | default dict }}
{{- if hasKey $podAnnotations "scion.io/hub-id" }}
{{- fail "hub.podAnnotations may not set scion.io/hub-id: it is rendered from hub.hubId and a second source for the hub's identity is exactly the divergence the explicit hub ID exists to prevent." }}
{{- end }}
{{- range $k := keys (include "scion-hub.selectorLabels" . | fromYaml) }}
{{- if hasKey $podLabels $k }}
{{- fail (printf "hub.podLabels may not set %s: it is a selector label, and a Deployment's selector is immutable after creation, so overriding it here produces a Deployment that either fails to update or adopts no pods." $k) }}
{{- end }}
{{- end }}
{{- /*
   Pod metadata and pod spec are readable by anyone with pod read access, which
   is a WIDER audience than the RBAC on the Secret a credential should have come
   from. The check covers the whole of .Values rather than the subtrees this
   template happens to render - see its definition for why it is not a list.
*/}}
{{- include "scion-hub.assertNoCredentialsInValues" . }}
{{- $strategy := include "scion-hub.updateStrategyType" . }}
{{- include "scion-hub.assertExtraEnv" . }}
{{- include "scion-hub.assertHAUnlanded" . }}
{{- /*
Called here for the same reason assertConfigSource is: the Deployment is the one
template that always renders, so this is where a guard becomes unconditional.
*/}}
{{- include "scion-hub.assertCloudsqlPorts" . }}
{{- /*
Called from here, and not only from the settings template, because the settings
template is skipped entirely when config.existingSecret is set - which is the
only case this assertion has anything to say about. The Deployment always
renders, so the check always runs.
*/}}
{{- include "scion-hub.assertConfigSource" . }}
{{- /*
Same reason, different guard. scion-hub.agentNamespace refuses a disagreeing
rbac.agentNamespace / runtime.namespace pair, and every one of its other callers
is conditional: the Role and RoleBinding are skipped when
runtime.listAllNamespaces is set, and the settings template is skipped when
config.existingSecret is set. Set both and the only remaining caller is
NOTES.txt, which is not a manifest and is not rendered by every client. The
Deployment always renders, so calling it here is what makes the guard
unconditional. The output is discarded; this is the call, not a use.
*/}}
{{- $_ := include "scion-hub.agentNamespace" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scion-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion-hub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ $strategy }}
    {{- if eq $strategy "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "scion-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scion-hub.labels" . | nindent 8 }}
        {{- with $podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- /*
        The hub ID the operator supplied, verbatim, from the same helper every
        other rendering of it uses, so the positions cannot drift. It is an
        annotation and not a label because a hub ID is not constrained to the
        label character set. Changing it rolls the pods, which is correct: the
        hub's identity, and with it its storage prefixes and secret scopes, has
        changed.

        Two things about this annotation that are easy to get wrong later.

        It records the operator's INTENT, not an observation of the hub, and the
        two halves of that sentence now behave differently. This chart does feed
        hub.hubId into the running process: server.hub.hub_id in the mounted
        settings.yaml comes from the same helper this annotation does, so within
        one render they cannot disagree, and hack/verify.sh asserts that pairing
        per permutation. Treat a disagreement as a defect rather than as the
        expected state - which is the reverse of what this paragraph said while
        the chart rendered no settings file, and it changed without this file
        being edited.

        The exception is config.existingSecret, where the settings file is the
        operator's and this annotation is still rendered from hub.hubId. There
        the two are genuinely independent and can differ, which is one more
        reason that path validates nothing.

        It is still not an observation either way. Nothing reads the running hub
        back into it, so a pod whose settings file failed to load reports the
        intended ID here regardless. Do not read it as a control or as a status
        field.

        The prefix is deliberate. This repository has two pod-annotation
        conventions: agent pods use a bare "scion.<name>" form (see
        pkg/runtime/k8s_runtime.go), and this is the domain-qualified
        "scion.io/<name>" form that the rest of the project's Kubernetes
        metadata uses. Domain-qualified is the correct one and is what later
        additions here should follow; the bare form on agent pods is not a
        precedent to copy.
        */}}
        scion.io/hub-id: {{ $hubId | quote }}
        {{- /*
        envFrom is resolved once, when the container starts. Unlike a mounted
        ConfigMap the kubelet never refreshes it, so without this a helm upgrade
        that changes the hub's environment would report success and change
        nothing until something else happened to restart the pods.
        */}}
        checksum/env-config: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        {{- /*
        Required, not decorative. settings.yaml is delivered as a subPath mount,
        and a subPath mount is bound when the container starts and frozen for
        its lifetime - the kubelet's periodic refresh of Secret volumes does not
        reach through one. Without this annotation a helm upgrade that changes
        the hub's configuration reports success and changes nothing at all,
        until some unrelated event happens to restart the pods and the new
        configuration takes effect at a time nobody chose.

        Rendered from the template output rather than from the values, so it
        covers what actually lands in the file, config.extra included. Omitted
        entirely under config.existingSecret: the chart renders no file there,
        the checksum would be of nothing, and a constant that never changes is
        worse than an absent one because it looks like coverage.

        🔴 NOT A DIGEST OF THE FILE. It is a digest of a CREDENTIAL-REDACTED
        PROJECTION of the file, and the difference is the whole point of
        scion-hub.settingsChecksum - read that helper before changing this line
        back to the obvious `include ... | sha256sum`.

        The reason: this annotation is on the pod template, which anyone with
        get on deployments or pods can read, and that is a WIDER audience than
        the settings Secret's own RBAC. Before phase 2 the digest input carried
        no credential and hashing the file was correct. Phase 2 puts a password
        inside server.database.url in that same file, and the rest of a DSN -
        scheme, user, host, port, database name - is chart-rendered or public.
        A digest over a mostly-known preimage is a verification oracle for the
        one unknown part of it: you can confirm a guessed password offline,
        against a value you are allowed to read, without ever touching the
        Secret. Redacting the credential component removes the unknown from the
        preimage and the oracle with it.

        WHAT THIS COSTS, because it is not free and the cost must not be
        rediscovered by an operator at 3am: with the password out of the digest
        input, rotating ONLY the password does not move this annotation, so no
        pod rolls and helm upgrade reports success while the old credential
        stays live. MEASURED, not predicted - see hack/verify.sh, which asserts
        that collapse in both directions rather than describing it. Everything
        that is not a credential still rolls the pods automatically, host, port
        and database name included. The remedy for the credential-only case is
        an explicit `kubectl rollout restart`, documented beside the password in
        values.yaml and PRINTED by NOTES.txt on every install and upgrade that
        sets one. Delete either of those and you have deleted the behaviour, not
        the annotation.
        */}}
        {{- if not .Values.config.existingSecret }}
        checksum/settings: {{ include "scion-hub.settingsChecksum" . }}
        {{- end }}
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "scion-hub.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "scion-hub.nonRootSecurityContext" . | nindent 8 }}
        seccompProfile:
          type: RuntimeDefault
      {{- /*
      THE NATIVE SIDECAR. An initContainers entry with restartPolicy: Always is
      a sidecar, not an init container: the kubelet starts it before the main
      containers, does NOT wait for it to exit, and tears it down after they
      finish. That ordering is the entire reason for it here - the hub opens the
      database and runs AutoMigrate immediately, so as an ordinary sidecar it
      races the tunnel and CrashLoopBackOffs until it wins.

      Requires GKE 1.29+. Below that the field is ignored and the entry becomes
      a genuine init container that never exits, which hangs the pod at startup
      forever - so cloudsql.nativeSidecar: false exists, and NOTES.txt prints
      what to expect on that path.

      assertNativeSidecarSupported refuses that combination at render time. It
      is invoked HERE, immediately above the thing it is about, rather than from
      Chart.yaml's kubeVersion, because the requirement belongs to this branch
      and not to the chart: a kubeVersion floor is evaluated before values are
      read, so it also rejected the sub-1.29 clusters the false branch exists to
      serve. See the note in Chart.yaml.
      */}}
      {{- include "scion-hub.assertNativeSidecarSupported" . }}
      {{- if and .Values.cloudsql.enabled .Values.cloudsql.nativeSidecar }}
      initContainers:
        {{- include "scion-hub.cloudsqlProxyContainer" . | nindent 8 }}
          restartPolicy: Always
      {{- end }}
      containers:
        - name: hub
          image: {{ include "scion-hub.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "scion-hub.hubArgs" . | nindent 12 }}
          {{- /*
          The hub's whole environment. Configuration lives in settings.yaml, not
          here - see configmap-env.yaml for why.
          */}}
          envFrom:
            - configMapRef:
                name: {{ include "scion-hub.envConfigMapName" . }}
          env:
            {{- /*
            The namespace the hub is running in, which it reads to decide where
            to create agent pods when no namespace is configured. There is no
            way to derive this at template time that survives being installed
            into a different namespace than the one rendered against.
            */}}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.hub.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.hub.webPort }}
              protocol: TCP
          {{- /*
          Called OUTSIDE the if, and unconditionally, because the disabled case is
          one of the two things it checks. Inside the if, probes.startup.enabled=false
          would delete the probe and the assertion guarding it in the same stroke.

          THE SAME HAZARD ONE LEVEL UP, FOR WHOEVER WRAPS THIS FILE: this is the
          only call site, so anything that stops rendering the Deployment also
          stops running the assertion - silently, with a manifest that reads as
          correct. bootstrap.deferHub is exactly that change. If you gate this
          file, the assertion has to be hoisted somewhere that still evaluates.
          */}}
          {{- include "scion-hub.assertStartupBudget" . }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          {{- end }}
          securityContext:
            {{- /*
            Repeated at the container level on purpose. A container-level
            securityContext shadows the pod-level one field by field, so
            restating runAsNonRoot here means the hub container cannot be
            returned to root by anything that only reaches the pod-level block.
            */}}
            {{- include "scion-hub.nonRootSecurityContext" . | nindent 12 }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- with .Values.hub.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- /*
            The hub's state directory, writable. It is not a config directory:
            storage/, templates/ and scion-token are all created in it at
            runtime, so mounting the config over the whole directory - the
            shortcut this shape exists to avoid - breaks the hub for reasons
            that have nothing to do with configuration.

            emptyDir and not a PVC because none of it is data worth keeping. In
            the hosted deployment the blob store is GCS, the database is Cloud
            SQL and the workspace share is Filestore; what is left here is
            scratch that is correct to lose with the pod.
            */}}
            - name: scion-home
              mountPath: {{ include "scion-hub.scionDir" . | quote }}
            {{- /*
            The one file in that directory that the hub may not write.

            subPath, so a single file lands inside the writable directory rather
            than replacing it. Read-only on purpose: the hub rewrites
            settings.yaml at runtime, and on a multi-replica deployment those
            writes are pod-local while syncHubSettings re-seeds shared database
            state from whatever the local file says - so a pod that successfully
            writes here can push its own divergence into truth the other pods
            then read. Every write path to this file is soft (a warning, or a
            500 to one caller, with the server continuing), so refusing the
            write costs a log line and prevents the divergence. Tracked as
            ptone/scion#1091; see NOTES.txt before making this writable.
            */}}
            - name: settings
              mountPath: {{ printf "%s/settings.yaml" (include "scion-hub.scionDir" .) | quote }}
              subPath: settings.yaml
              readOnly: true
        {{- /*
        THE FALLBACK PLACEMENT, for clusters below 1.29 where restartPolicy on
        an initContainers entry is ignored. Here the proxy is an ordinary
        container and there is NO ordering guarantee, so the hub will lose the
        race to the tunnel some number of times before it wins. That is the
        crash-loop NOTES.txt warns about, and it is self-healing rather than
        broken.

        Appended AFTER the hub container, deliberately. Container order does not
        affect startup on this path - nothing here is ordered - but the hub is
        this pod's subject and a reader running kubectl describe should meet it
        first.
        */}}
        {{- if and .Values.cloudsql.enabled (not .Values.cloudsql.nativeSidecar) }}
        {{- include "scion-hub.cloudsqlProxyContainer" . | nindent 8 }}
        {{- end }}
      volumes:
        - name: scion-home
          emptyDir: {}
        - name: settings
          secret:
            secretName: {{ include "scion-hub.settingsSecretName" . }}
            {{- /*
            0444, and specifically not 0600.

            A Secret volume is projected root:root regardless of the pod's
            securityContext, and this pod runs as a non-root uid. 0600 would
            therefore produce a file the hub cannot read - and the hub does not
            report that as a permissions problem: it starts with defaults, then
            fails the hosted preflight naming a configuration key, which sends
            the reader to the settings file that is in fact correct.

            The alternative, 0440 with a pod-level fsGroup, was considered and
            rejected. fsGroup is pod-wide, so every sidecar gets the group and
            can read the file anyway - it is the appearance of a boundary rather
            than a boundary - and it makes the kubelet apply recursive ownership
            changes to volumes, which is a real hazard once an NFS workspace
            share is mounted here. Do not add fsGroup to fix a permissions
            problem on this file.

            The leading zero is part of the value. Kubernetes reads manifests as
            YAML 1.1, where 0444 is octal 292; strip the zero and it becomes
            decimal 444, which is octal 0674 - group-writable, still a valid
            mode, and accepted without complaint. Do not "simplify" it.
            */}}
            defaultMode: 0444
            items:
              - key: settings.yaml
                path: settings.yaml
      {{- with .Values.hub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
