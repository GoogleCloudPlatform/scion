{{- /*
   Deliberately OUTSIDE the create guard. Checking only when the object renders
   would switch the check off for serviceAccount.create=false, and a guard that
   another value can silence is the defect class this chart exists to avoid.
*/}}
{{- include "scion-hub.assertNoCredentialsInValues" . }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scion-hub.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion-hub.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.gcpServiceAccount .Values.serviceAccount.annotations }}
  annotations:
    {{- if .Values.serviceAccount.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
