{{- if .Values.serviceAccount.create }}
{{- /*
   Checked inside the create guard, not above it: when create is false this
   object is not rendered at all, so the annotations reach no manifest and there
   is nothing to expose. Refusing the render then would be a false positive
   against a value the chart ignores.
*/}}
{{- include "scion-hub.assertNoCredentialTree" (dict "value" .Values.serviceAccount.annotations "source" "serviceAccount.annotations") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scion-hub.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion-hub.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.gcpServiceAccount .Values.serviceAccount.annotations }}
  annotations:
    {{- if .Values.serviceAccount.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
