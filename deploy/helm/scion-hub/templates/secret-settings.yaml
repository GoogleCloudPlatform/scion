{{/*
The hub's configuration, as a rendered settings.yaml.

Mounted read-only, as a subPath, over an emptyDir-backed $HOME/.scion, so the
directory stays writable for storage/, templates/ and scion-token while this one
file does not. The hub rewrites settings.yaml at runtime and those writes are
pod-local, while syncHubSettings re-seeds shared database state from the local
file - so a pod that can write here can push its own divergence into truth the
others read. Refusing the write costs a log line. See NOTES.txt and
ptone/scion#1091 before making it writable.

A Secret rather than a ConfigMap because the file necessarily holds secrets:
OIDC and OAuth credentials are configurable only through settings.yaml, and
under password database auth the connection URL carries the password too.

stringData rather than data because base64 is not encryption and never was. It
buys nothing here and costs the reviewability of the one file in this chart most
worth reviewing - and the golden files that lock its content.
*/}}
{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scion-hub.settingsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  settings.yaml: |
    # Rendered by the scion-hub Helm chart. Every runtime write to this file is
    # pod-local; see ptone/scion#1091 before making it writable.
    #
    # Positions deliberately left unrendered, each owned by a later change:
    #   server.database.url        Cloud SQL. Note the key is url, not dsn.
    #   server.secrets             the secret backend (gcpsm).
    #   server.auth.proxy,
    #   server.auth.transport,
    #   server.oauth               the subtree selected by server.auth.mode.
    #   server.workspace_storage   Filestore NFS - a different subsystem from
    #                              server.storage, which is the hub's GCS blob
    #                              store and is rendered below.
    #
    # The session secret is not here and does not belong here: it arrives as an
    # environment variable from its own Secret.
    {{- include "scion-hub.settings" . | nindent 4 }}
{{- end }}
