# The smallest install the chart supports: the hub workload on its own, with the
# hub's own defaults for storage and database (SQLite, local workspace storage),
# and no ingress. Exercised by helm lint and by helm template | kubeconform.
#
# Everything else in this file is deliberately absent. Keys for Cloud SQL,
# Filestore and Ingress do not exist yet, and the schema rejects keys the chart
# does not understand. The configuration-intake keys do now exist, and this file
# still omits them on purpose: it is the permutation that proves the chart
# renders a usable settings.yaml from the hub's own defaults.
#
# CI: EVERY helm lint AND helm template INVOCATION MUST PASS -f ON THIS FILE.
#
# Bare `helm lint --strict .` fails, with:
#
#     scion-hub:
#     - image: repository is required
#     - hub: hubId is required
#
# That is the chart working correctly, not a defect. Both values are required
# with no default on purpose - there is no correct default hub image and no
# safe generated hub ID - and `helm lint` does not read this directory on its
# own (only `ct lint` does, via its own configuration).
#
# So: if a lint or template step fails with either of those two messages, the
# fix is to add `-f ci/values-minimal.yaml` to the command. THE FIX IS NOT TO
# GIVE image.repository OR hub.hubId A DEFAULT IN values.yaml. Doing that would
# silently undo the two decisions this chart most depends on: a default image
# reference cannot be correct and would turn an install-time error into a
# runtime mystery, and a defaulted hub ID re-scopes blob storage prefixes and
# secrets on upgrade.

hub:
  # Explicit, stable, operator-supplied. The chart has no default for this and
  # never generates one.
  hubId: ci-minimal
  # Also has no default, and also cannot be omitted: the hub's own fallback is
  # a localhost URL that agents cannot reach and that disables the session
  # cookie's Secure attribute.
  baseUrl: https://ci-minimal.example.com

# No default exists for this, and no hub-gke image is published, so CI names an
# obviously non-real path. Nothing here is ever pulled.
image:
  repository: us-docker.pkg.dev/example-project/example-repo/scion-hub-gke
  tag: ci

auth:
  sessionSecret: ci-minimal-session-secret-not-real-do-not-use
