# The smallest install the chart supports: the hub workload on its own, with the
# hub's own defaults for storage and database (SQLite, local workspace storage),
# and no ingress. Exercised by helm lint and by helm template | kubeconform.
#
# Everything else in this file is deliberately absent. Keys for configuration
# intake, Cloud SQL, Filestore and Ingress do not exist yet, and the schema
# rejects keys the chart does not understand.

# Explicit, stable, operator-supplied. The chart has no default for this and
# never generates one.
hub:
  hubId: ci-minimal

# No default exists for this, and no hub-gke image is published, so CI names an
# obviously non-real path. Nothing here is ever pulled.
image:
  repository: us-docker.pkg.dev/example-project/example-repo/scion-hub-gke
  tag: ci
