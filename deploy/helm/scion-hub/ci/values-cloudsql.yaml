# THE CLOUD SQL PERMUTATION: Postgres behind the Auth Proxy, IAM database
# authentication, proxy as a native sidecar. This is the shape the Cloud SQL
# phase exists to produce, and it is the only permutation in this directory
# whose golden file contains an initContainers entry.
#
# WHAT THIS FILE IS THE ONLY WITNESS TO, so that a "simplification" has to
# argue with a list rather than with a shrug:
#
#   - database.user is ABSENT ON PURPOSE. Under IAM auth the chart derives the
#     database role from serviceAccount.gcpServiceAccount by stripping the
#     .gserviceaccount.com suffix, because that is the name Cloud SQL gives the
#     IAM principal. No other permutation exercises the derivation; the two
#     settings permutations set database.user explicitly so that a bug in the
#     derivation surfaces HERE and not as a mystery in a file about something
#     else. If you add database.user below, that derivation becomes untested.
#   - The password branch is not exercised here and is not missing: it is
#     covered by hack/verify.sh, which asserts in both directions that the
#     credential reaches the settings Secret and reaches no args list. A ci
#     permutation cannot make that assertion, because it renders one shape and
#     the claim is about two.
#   - cloudsql.nativeSidecar is left at its default true. The false branch
#     renders a plain sidecar and is covered by the same script, for the same
#     reason.
#
# UNVERIFIED AGAINST A RUNNING CLUSTER, and this is the file most likely to be
# read as evidence that it was. Nothing here has been applied to a cluster,
# because the phase had no cluster to apply it to: the deploying principal is
# refused by both container.googleapis.com and sqladmin.googleapis.com with 403.
# See VALIDATION.md section 7.2. What this file proves is that the chart RENDERS
# this shape and that the render satisfies the schema and kubeconform. That the
# proxy then connects, that the IAM role name is the one Cloud SQL expects, and
# that the hub completes AutoMigrate through it are three separate claims and
# all three are unrun.

hub:
  hubId: ci-cloudsql
  name: CI Cloud SQL Hub
  baseUrl: https://ci-cloudsql.example.com

image:
  repository: us-docker.pkg.dev/scion-ci/scion/scion-hub
  tag: ci

serviceAccount:
  create: true
  # The Workload Identity binding target, and - with the .gserviceaccount.com
  # suffix stripped - the Cloud SQL IAM database role the proxy authenticates
  # as. One value, two consumers: NOTES.txt prints the gcloud commands that
  # bind both, substituted from this key.
  gcpServiceAccount: scion-hub@example-project.iam.gserviceaccount.com

database:
  driver: postgres
  # No default exists for this key. Not "iam by default because IAM is better",
  # not "password by default because it always works" - the chart refuses to
  # choose. The two branches differ in what has to exist outside the chart
  # before the pod can start, and neither answer is safe to assume on an
  # operator's behalf. See the header of database.auth in values.yaml.
  auth: iam
  name: scion

cloudsql:
  enabled: true
  # PROJECT:REGION:INSTANCE. Obviously non-real; nothing here is ever dialled.
  instanceConnectionName: example-project:us-central1:ci-cloudsql

storage:
  provider: gcs
  bucket: ci-cloudsql-hub-blobs

# Required: the hub refuses to start its in-process broker without a
# registry, so the chart refuses the render.
agents:
  imageRegistry: us-docker.pkg.dev/example-project/example-repo

auth:
  mode: proxy
  sessionSecret: ci-cloudsql-session-secret-not-real
  # PROBE VALUES, not real resources. An HA shape under auth.mode proxy, so the
  # preflight requires all of these. The Cloud Run audience form, so both shapes
  # the hub accepts are covered by an HA fixture.
  proxy:
    iap:
      audience: /projects/123456789012/locations/us-central1/services/probe-ci-cloudsql
  transport:
    mode: iap
    oidcAudience: probe-ci-cloudsql-oauth-client.apps.googleusercontent.com
    platformAuthSa: probe-ci-cloudsql@probe-project.iam.gserviceaccount.com
