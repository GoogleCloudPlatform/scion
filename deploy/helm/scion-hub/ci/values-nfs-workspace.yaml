# THE NFS WORKSPACE PERMUTATION: the minimal install plus workspaceStorage.nfs,
# so CI renders server.workspace_storage and the hub pod's inline nfs volume.
# Every address and path is a placeholder: a documentation-range IP
# (RFC 5737), an example export and an example claim name. Nothing here is
# ever mounted.
#
# NOT IN THE GOLDEN / HA-CONTRACT SET (golden/, hack/verify.sh,
# hack/ha-gates.txt). That set binds the HA preflight walk, which needs a Go
# run to extend. This file is linted by chart-ci.yml, and
# tests/render-guards.sh asserts its render: the settings block, the volume,
# and the mount at mountRoot/shareId.

hub:
  hubId: ci-nfs
  baseUrl: https://ci-nfs.example.com

image:
  repository: us-docker.pkg.dev/example-project/example-repo/scion-hub-gke
  tag: ci

agents:
  imageRegistry: us-docker.pkg.dev/example-project/example-repo

auth:
  sessionSecret: ci-nfs-session-secret-not-real-do-not-use
  proxy:
    iap:
      audience: /projects/123456789012/locations/us-central1/services/probe-ci-nfs

workspaceStorage:
  nfs:
    enabled: true
    server: 192.0.2.10
    export: /example_share
    mountRoot: /mnt/scion-nfs
    shareId: ci-nfs
    pvName: ci-nfs-workspace
    uid: 1000
    gid: 1000
    subpathRoot: projects
