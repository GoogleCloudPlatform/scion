# values-settings.yaml with the authentication mode changed, and nothing that
# is not entailed by that change. Keep it that way: the point of this file is
# that a diff of the two renders shows the authentication subtree and nothing
# more. Anything else that drifts between them makes that check stop meaning
# what it claims to mean.
#
# "AND NOTHING ELSE CHANGED" IS WHAT THIS USED TO SAY, AND IT STOPPED BEING
# TRUE when the OAuth client credentials landed. The values now differ by the
# mode AND by auth.oauth.web.google, and the renders differ by server.auth.mode
# AND server.oauth. That is not drift: oauth mode without credentials is a
# deployment nobody can log in to, and the chart refuses to render it - so the
# credentials are part of what selecting the mode means, not an extra. The
# narrower claim is the one that survives and the one the diff should be read
# against.
#
# THE FIVE BLOCK-1 KEYS RENDER IN EITHER AUTHENTICATION MODE, and that is what
# the paired diff is for: the hub ID, the Postgres driver, the database URL, GCS
# storage with a bucket and a durable session secret are required whichever mode
# is selected. A chart that rendered those under proxy and dropped one under
# oauth would install fine and fail at hub startup, naming the missing key but
# not the reason it went missing.
#
# THE PREFLIGHT AS A WHOLE IS NOT MODE-BLIND, THOUGH, AND THIS FILE USED TO SAY
# IT WAS. Measured by walking validateHostedHAPreflight gate by gate on the
# settings.yaml each fixture renders (hack/ha-gates.txt records both arms): this
# file is refused by a STRICT SUBSET of what values-settings.yaml is refused by.
# The preflight's IAP gates sit inside `if cfg.Auth.Mode == "proxy"`, so an
# oauth shape never reaches any of them and stops at the two gates that are
# mode-independent: server.database.url and the durable session/signing secret.
#
# [HISTORY 2026-08-17] THIS SAID THE OPPOSITE: "this file is refused by one gate
# more than values-settings.yaml. The extra one is server.auth.mode=proxy
# (cmd/server_foreground.go:980)". It was true when written and 1b3c9418 "fix: do
# not require IAP for hosted HA preflight" deleted that gate, so oauth went from
# superset-by-one to subset. TWO THINGS ABOUT THAT CITE ARE WORTH KEEPING. The
# line number did not rot in the way that announces itself - :980 still resolves,
# and it is now the storage.provider gate, so a reader who checked it landed on a
# real line about something else and came away reassured. And "one gate fewer" is
# the plausible hand-fix and would be a SECOND false sentence: the difference is
# the whole IAP family, not one gate.

# SET BECAUSE THIS FIXTURE IS EXACTLY THE SHAPE THE FLAG EXISTS FOR. Postgres
# alone makes the hub's isHADeployment test true, so without this the chart
# refuses to render this file at all. The fixture's job is to exercise the
# rendered settings.yaml, not to install, and the acknowledgement is how it says
# so. Deleted with the flag when Cloud SQL and ingress/IAP land.
acknowledgeHAUnlanded: true

hub:
  hubId: ci-settings
  name: CI Settings Hub
  baseUrl: https://ci-settings.example.com

image:
  repository: us-docker.pkg.dev/scion-ci/scion/scion-hub
  tag: ci

database:
  driver: postgres
  # THE CLOUD SQL PHASE MADE THESE REQUIRED. driver: postgres alone no longer
  # renders: auth has no default by design, name has no safe one, and this
  # chart reaches Postgres only through the Auth Proxy. user is stated
  # explicitly rather than derived from serviceAccount.gcpServiceAccount so
  # that a bug in the derivation surfaces in ci/values-cloudsql.yaml, which
  # exists to exercise it, and not here in a fixture about something else.
  auth: iam
  name: scion
  user: scion-hub@my-project.iam

cloudsql:
  enabled: true
  instanceConnectionName: my-project:us-central1:scion-hub

storage:
  provider: gcs
  bucket: ci-settings-hub-blobs

auth:
  mode: oauth
  sessionSecret: ci-oauth-session-secret-not-a-real-secret

  # THIS FIXTURE USED TO CARRY acknowledgeOAuthUnlanded: true INSTEAD OF THESE.
  # The key existed because the chart rendered oauth mode with no channel for
  # the credentials that mode needs; the fixture set it to say "yes, I know this
  # would not be usable". The credentials are rendered now, so the fixture
  # supplies them and the acknowledgement is gone. A fixture that still opted
  # out of a guard nothing needs would be the reason nobody noticed the guard
  # had stopped guarding anything.
  #
  # google rather than github for no reason beyond needing one of them. The
  # github pair is exercised by the render-guards suite, so both are covered
  # without doubling this fixture.
  #
  # WEB, and the client type matters. Credentials under server.oauth.cli or
  # server.oauth.device would render fine and satisfy nothing: the hub keys its
  # login check by client type (pkg/hub/oauth.go:194) and a browser login reads
  # the web client only. render-guards asserts that specific non-substitution.
  oauth:
    web:
      google:
        clientId: ci-oauth-web-google-client-id.apps.googleusercontent.invalid
        clientSecret: ci-oauth-web-google-client-secret-not-a-real-secret

agents:
  imageRegistry: us-docker.pkg.dev/scion-ci/scion

config:
  extra:
    server:
      log_level: debug
      scheduler:
        interval_seconds: 30
