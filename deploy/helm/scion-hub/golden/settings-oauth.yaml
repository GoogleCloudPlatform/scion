# Source: scion-hub/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scion-scion-hub
  namespace: scion-system
  labels:
    helm.sh/chart: scion-hub-0.1.0
    app.kubernetes.io/name: scion-hub
    app.kubernetes.io/instance: scion
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: scion
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scion-hub
      app.kubernetes.io/instance: scion
  template:
    metadata:
      labels:
        helm.sh/chart: scion-hub-0.1.0
        app.kubernetes.io/name: scion-hub
        app.kubernetes.io/instance: scion
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: scion
      annotations:
        scion.io/hub-id: "ci-settings"
        checksum/env-config: 35ce0e61c3b792d5ab1812cb3bf646e4c87442a4b7b50ce9cf53db01f312459a
        checksum/settings: b3ed5504520795c764c80407ba70c987d7d72705764300a16db0aa2a77edfdf2
    spec:
      serviceAccountName: scion-scion-hub
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: cloud-sql-proxy
          image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy@sha256:825d5e4ce70d38bd0006c9eea15a6a2e2983e87b31ac6924d33e2dba56eafc9f"
          imagePullPolicy: IfNotPresent
          args:
            - "--structured-logs"
            - "--port=5432"
            - "--health-check"
            - "--http-address=0.0.0.0"
            - "--http-port=9801"
            - "--auto-iam-authn"
            - "my-project:us-central1:scion-hub"
          startupProbe:
            httpGet:
              path: /startup
              port: 9801
            periodSeconds: 1
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readiness
              port: 9801
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          restartPolicy: Always
      containers:
        - name: hub
          image: "us-docker.pkg.dev/scion-ci/scion/scion-hub:ci"
          imagePullPolicy: IfNotPresent
          args:
            - server
            - start
            - --foreground
            - --hosted
            - --enable-hub
            - --enable-runtime-broker
            - --enable-web
            - --web-port
            - "8080"
            - --host
            - 0.0.0.0
            - --auto-provide
            - --global
          envFrom:
            - configMapRef:
                name: scion-scion-hub-env
            - secretRef:
                name: scion-scion-hub-session
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: scion-home
              mountPath: "/home/scion/.scion"
            - name: settings
              mountPath: "/home/scion/.scion/settings.yaml"
              subPath: settings.yaml
              readOnly: true
      volumes:
        - name: scion-home
          emptyDir: {}
        - name: settings
          secret:
            secretName: scion-scion-hub-settings
            defaultMode: 0444
            items:
              - key: settings.yaml
                path: settings.yaml
