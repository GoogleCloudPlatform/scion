# Source: scion-hub/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scion-scion-hub
  namespace: scion-system
  labels:
    helm.sh/chart: scion-hub-0.1.0
    app.kubernetes.io/name: scion-hub
    app.kubernetes.io/instance: scion
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: scion
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scion-hub
      app.kubernetes.io/instance: scion
  template:
    metadata:
      labels:
        helm.sh/chart: scion-hub-0.1.0
        app.kubernetes.io/name: scion-hub
        app.kubernetes.io/instance: scion
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: scion
      annotations:
        scion.io/hub-id: "ci-existing"
        checksum/env-config: c1ad1de50513e6d84543180fa40940d518d358e0546f4cf908b0f39ce1a75b3e
    spec:
      serviceAccountName: scion-scion-hub
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: "us-docker.pkg.dev/example-project/example-repo/scion-hub-gke:ci"
          imagePullPolicy: IfNotPresent
          args:
            - server
            - start
            - --foreground
            - --hosted
            - --enable-hub
            - --enable-runtime-broker
            - --enable-web
            - --web-port
            - "8080"
            - --host
            - 0.0.0.0
            - --auto-provide
            - --global
          envFrom:
            - configMapRef:
                name: scion-scion-hub-env
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: scion-home
              mountPath: "/home/scion/.scion"
            - name: settings
              mountPath: "/home/scion/.scion/settings.yaml"
              subPath: settings.yaml
              readOnly: true
      volumes:
        - name: scion-home
          emptyDir: {}
        - name: settings
          secret:
            secretName: my-own-hub-settings
            defaultMode: 0444
            items:
              - key: settings.yaml
                path: settings.yaml
