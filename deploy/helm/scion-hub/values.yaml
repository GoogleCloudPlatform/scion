# Default values for scion-hub.
#
# This chart is being built incrementally. Only the values below are understood
# today; values.schema.json rejects anything else, so an unknown key is an error
# rather than a silent no-op. Configuration intake (settings.yaml), Cloud SQL,
# Filestore and Ingress are added by later changes and bring their own values.

nameOverride: ""
fullnameOverride: ""

# Single replica by default. More than one replica breaks the web terminal,
# exec, log tailing and port forwarding for roughly (N-1)/N of requests: the
# agent control channel, presence and port tunnels are pod-local state, and
# load balancer session affinity does not repair it (it pins a client to a pod,
# not to the pod holding the agent's control channel).
replicaCount: 1

updateStrategy:
  # "" resolves to Recreate at one replica and RollingUpdate (maxUnavailable 0)
  # above one. At one replica a rolling update briefly runs two hubs that both
  # write the same workspace share, which is the hazard Recreate avoids.
  type: ""

image:
  # REQUIRED, and deliberately not given a value here.
  #
  # The hub image this chart needs is the one built from the root Dockerfile
  # with --target hub-gke: non-root, uid 1000, web UI embedded, no baked
  # KUBECONFIG. No such image is published anywhere, so every possible default
  # would point either at an empty registry path or at somebody else's
  # artifact - and a default that cannot be correct turns an install-time error
  # into a runtime mystery.
  #
  # In particular the published artifact named "scion-hub"
  # (us-central1-docker.pkg.dev/PROJECT_ID/public-docker/scion-hub, built from
  # image-build/hub/Dockerfile) is NOT this image: it runs as root and it is
  # built without the embedded web UI. Matching the name is a coincidence, not
  # an endorsement.
  #
  #   repository: us-docker.pkg.dev/my-project/my-repo/scion-hub-gke
  #

  # Defaults to .Chart.AppVersion when empty. Prefer digest.
  tag: ""
  # Preferred over tag, and mutually exclusive with it. A tag can be repointed
  # underneath a running cluster; a digest cannot.
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

hub:
  # REQUIRED, and deliberately not given a value here: the hub's stable
  # identity has no default and the chart never generates one. With no explicit
  # value the hub derives its ID from its hostname, which on a Deployment is
  # random per pod, so replicas would diverge onto different blob-storage
  # prefixes and secret scopes - silently, and worse on every rollout. Supply
  # the same value on every upgrade; changing it re-scopes storage and secrets
  # and is not a safe upgrade.
  #
  #   hubId: my-hub
  #

  # Port the web frontend and the hub API listen on, and the port every probe
  # targets.
  webPort: 8080

  # Extra arguments appended to the hub command. The chart always renders
  # --hosted and --host 0.0.0.0 and no value can remove them: without hosted
  # mode the server applies workstation defaults, takes auth-enabled from a
  # development flag and forces its bind address to 127.0.0.1.
  #
  # Never put secret material here. Anything on argv is readable by anyone with
  # pod read access; the render fails on an argument that looks like a secret.
  args: []

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

  securityContext:
    # runAsNonRoot is NOT a value. The chart sets it to true on both the pod and
    # the hub container and there is no knob, no override and no escape hatch.
    #
    # The reason is a specific, likely mistake: the artifact named "scion-hub"
    # that this project publishes today runs as root, and an operator who
    # reasons from the name rather than from the docs will point the chart at
    # it. The dangerous outcome is not that such an image is rejected - it is
    # that with a loose securityContext it appears to work, as root, writing
    # root-owned files into a share that agents running as uid 1000 then cannot
    # write. runAsNonRoot turns that silent outcome into a pod that fails
    # admission and says why.
    #
    # runAsUser and runAsGroup remain configurable because a later part of this
    # chart requires them to match the workspace share's uid and gid. Zero is
    # rejected: it contradicts runAsNonRoot rather than overriding it.
    runAsUser: 1000
    runAsGroup: 1000

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

probes:
  # The readiness endpoint is /readyz, at the root, and the chart hardcodes it.
  # It is not configurable, and deliberately so. The hub's other health
  # endpoints answer 200 unconditionally and are intercepted by the Google front
  # end, so a probe pointed at one of those reports healthy whatever state the
  # hub is in - it disables the only guard there is. And both the route table
  # and the authentication exemption match the path by exact string, so a
  # prefixed variant such as an /api/v1-scoped one is simultaneously unrouted
  # and not exempt from authentication: it answers 404 or 401 and no pod ever
  # becomes ready.
  startup:
    enabled: true
    periodSeconds: 5
    # First boot blocks on an unbounded schema-migration advisory lock before
    # the listener binds. 60 x 5s = 5 minutes.
    failureThreshold: 60
    timeoutSeconds: 3
  readiness:
    periodSeconds: 10
    # Must exceed 2s: the readiness handler's workspace mount check has its own
    # 2s internal timeout, and the kubelet default of 1s would cut it off before
    # the hub could report the failure. Schema minimum is 3.
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    # Off by default. /readyz folds in external dependencies, so a liveness
    # probe on it would kill healthy pods during a database failover. When
    # enabled it is a TCP check on the web port and nothing more.
    enabled: false
    periodSeconds: 20
    failureThreshold: 6
    timeoutSeconds: 3

service:
  # Always ClusterIP. The ingress path this chart targets is container-native
  # load balancing through a network endpoint group, which requires it, so the
  # type is not a knob.
  port: 80
  annotations: {}

serviceAccount:
  create: true
  name: ""
  # Workload Identity target, e.g. scion-hub@PROJECT.iam.gserviceaccount.com.
  gcpServiceAccount: ""
  annotations: {}

rbac:
  create: true
  # Optional. The namespace agent pods run in. Leave empty and set
  # runtime.namespace instead; if both are set they must agree.
  agentNamespace: ""

runtime:
  # Namespace agent pods are created in. Defaults to the release namespace.
  namespace: ""
  # true renders a ClusterRole/ClusterRoleBinding instead of the namespaced
  # Role/RoleBinding pair.
  listAllNamespaces: false
