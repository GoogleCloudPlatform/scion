name: Build Scion Images

on:
  workflow_dispatch:
    inputs:
      registry:
        description: 'Container registry (e.g., ghcr.io/myorg)'
        required: true
      target:
        description: 'Build target'
        type: choice
        options:
          - common
          - all
          - core-base
          - scion-base
          - harnesses
          - hub
        default: 'common'
      tag:
        description: 'Image tag'
        default: 'latest'
      platform:
        description: 'Target platform(s)'
        type: choice
        options:
          - all
          - linux/amd64
          - linux/arm64
        default: 'all'

  workflow_call:
    inputs:
      registry:
        description: 'Container registry (e.g., ghcr.io/myorg)'
        required: true
        type: string
      target:
        description: 'Build target (common, all, core-base, scion-base, harnesses, hub)'
        type: string
        default: 'common'
      tag:
        description: 'Image tag'
        type: string
        default: 'latest'
      platform:
        description: 'Target platform(s) (all, linux/amd64, linux/arm64)'
        type: string
        default: 'all'

permissions: {}

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read     # Check out the build scripts
      packages: write    # Push images to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: startsWith(inputs.registry, 'ghcr.io')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          REGISTRY: ${{ inputs.registry }}
          TARGET: ${{ inputs.target }}
          TAG: ${{ inputs.tag }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          image-build/scripts/build-images.sh \
            --registry "$REGISTRY" \
            --target "$TARGET" \
            --tag "$TAG" \
            --platform "$PLATFORM" \
            --push
