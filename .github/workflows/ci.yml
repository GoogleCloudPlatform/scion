name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# One run per PR: a new push to the same PR cancels the superseded run
# (ptone/scion#2845). Runs on main are never cancelled. Outside pull_request
# the group is the unique run_id, not github.ref: GitHub keeps at most one
# *pending* run per group and cancels an older pending run even when
# cancel-in-progress is false, so a shared refs/heads/main group would drop
# queued main runs whenever pushes land in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Path detection for jobs that only matter when specific files change
  # (ptone/scion#2845). Gating uses this job plus a job-level `if:` (or a
  # step-level `if:` inside an always-run job, see Build & Test), never
  # `on.paths`: a skipped job still reports its check, whereas a workflow
  # filtered out by on.paths reports nothing at all.
  #
  # On pull_request it diffs the PR head against the PR base (three-dot,
  # i.e. against the merge base). On any other event (push to main) every
  # output is 'true': post-merge runs always exercise everything, and a
  # push's `before` SHA is not always usable (new branch, force push).
  # If the diff itself fails, the outputs fall back to 'true' (fail open).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      single_node_vm: ${{ steps.diff.outputs.single_node_vm }}
      starter_hub: ${{ steps.diff.outputs.starter_hub }}
      web: ${{ steps.diff.outputs.web }}
      web_checks: ${{ steps.diff.outputs.web_checks }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          # Blobless partial clone: the diff below needs only commits and
          # trees (--no-renames means no blob content comparison).
          filter: blob:none

      - name: Diff against PR base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is ${EVENT_NAME}, not pull_request: running every gated job."
            {
              echo "single_node_vm=true"
              echo "starter_hub=true"
              echo "web=true"
              echo "web_checks=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: list both sides of a rename, so a file moved out of
          # a gated directory still counts as a change to that directory.
          if ! changed=$(git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}"); then
            echo "::warning title=Path detection failed::git diff ${BASE_SHA}...${HEAD_SHA} failed; running every gated job."
            {
              echo "single_node_vm=true"
              echo "starter_hub=true"
              echo "web=true"
              echo "web_checks=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$changed"
          # Here-string, not `echo | grep -q`: under pipefail, grep -q exiting
          # on the first match SIGPIPEs echo on large PRs and fails the test.
          if grep -qE '^(scripts/single-node-vm/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "single_node_vm=true" >> "$GITHUB_OUTPUT"
          else
            echo "single_node_vm=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(scripts/starter-hub/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "starter_hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "starter_hub=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(web/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          # web_checks gates the web checks inside Build & Test (typecheck,
          # e2e-perf lint/test, Vitest; ptone/scion#4256). It is wider than
          # `web` because those checks read inputs from outside web/:
          #   - Vitest parity tests read fixtures from pkg/**/testdata
          #     (pkg/wsprotocol/testdata/pty_close_codes.json,
          #     pkg/artifacts/testdata/remote_image_urls.json,
          #     pkg/artifacts/critic/testdata/corpus.json,
          #     pkg/hub/testdata/*-body.json); tsc type-checks the JSON
          #     imports among them.
          #   - web/src/shared/harness-utils.test.ts compares against the
          #     harnesses/ directory (harnesses/*/config.yaml).
          #   - web/src/components/pages/admin-server-config-env-keys.test.ts
          #     reads pkg/config/schemas/settings-v1.schema.json.
          # Keep this regex in sync when web/ starts reading anything else
          # outside web/.
          if grep -qE '^(web/|harnesses/|pkg/(.+/)?testdata/|pkg/config/schemas/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "web_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_checks=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Sized from data (ptone/scion#3183): over the 267 successful upstream
    # runs of this job on 2026-10-04/05, the job took p50 13.4m / p95 14.4m /
    # max 14.5m (Run Tests: p50 4.7m / max 5.1m). 30m is ~2x the slowest
    # success; worst case under the Run Tests watchdog below is ~26m (9.8m
    # max pre-test steps + 15m deadline + 1m grace + Build Binary). Without a
    # limit the job inherits GitHub's 360m default: two stalled Run Tests on
    # 2026-10-05 ran 41m and 83m (78m silent) until cancelled by hand.
    # Budget: the watchdog's diagnostics end ~16.1m into Run Tests, so this
    # timeout cuts them off if the steps before Run Tests take more than
    # ~13.9m (max 9.8m today). Keep timeout > pre-test max + ~17m: raise it
    # if steps are added before Run Tests or they grow.
    timeout-minutes: 30
    # needs: changes gates the web checks below (typecheck, e2e-perf
    # lint/test, Vitest) on changes.outputs.web_checks (ptone/scion#4256):
    # true when a PR touches web/, harnesses/, any pkg/**/testdata/ or this
    # workflow (the out-of-tree inputs those checks read; see the regex in
    # the changes job). The job itself always runs, so the "Build & Test"
    # check is always reported: !cancelled() keeps it running even when the
    # changes job fails.
    #
    # Each gated step uses
    #   needs.changes.result != 'success' ||
    #   needs.changes.outputs.web_checks != 'false'
    # which fails open: the step is skipped only when path detection
    # succeeded AND reported exactly 'false'. A failed or skipped changes
    # job, a missing/empty output, or any non-pull_request event (push to
    # main, where changes emits web_checks=true) runs the steps. A custom
    # step `if:` without a status function is implicitly ANDed with
    # success(), so the steps still skip after an earlier step fails, as
    # before.
    #
    # Build Web UI is NOT gated: web/embed.go embeds web/dist/client into
    # the Go build, and the Go tests and Build Binary below need it.
    needs: changes
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: build-test

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24' # Node.js 24 (LTS)
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web UI
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Verify Web Build
        run: ls -la web/dist

      # Guards against stale chunks shipping in the hub binary (#3842).
      # The build must not write output into public/ (Vite's publicDir copies
      # it into the next build), and every .js in dist/client/assets must be
      # referenced by the Vite manifest. Also runs the node:test suites of the
      # build helper scripts; REQUIRE_BUILD=1 makes the precompress suite's
      # real-build checks (sibling decoding, byte budgets) fail instead of
      # skip if the build output is missing.
      - name: Check Web Build Orphans
        working-directory: ./web
        run: |
          REQUIRE_BUILD=1 npm run test:build-scripts
          test ! -e public/assets || { echo "public/assets must not exist after the build (#3842)"; exit 1; }
          npm run check:orphans

      # Bundle budget (ptone/scion#5306): main.js and entry-closure size
      # limits, the lazy terminal-workspace chunk exists, and no terminal-*
      # module is in the static closure of the entry (client/main.ts) or of
      # the login and home routes. Limits live in web/bundle-budget.json.
      # Not gated: it only reads the build above.
      - name: Check web bundle budget
        working-directory: ./web
        run: node scripts/check-bundle-budget.mjs

      - name: Test web bundle budget script
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_checks != 'false' }}
        working-directory: ./web
        run: node --test scripts/check-bundle-budget.test.mjs

      # npm run build moves the source maps out of web/dist/client (the tree
      # web/embed.go embeds and the release images copy) into
      # web/dist/sourcemaps (scripts/move-sourcemaps.mjs). Not gated on
      # changes: this re-checks the dist/client that the Go tests and Build
      # Binary below embed, on every run.
      - name: Check Web Source Maps
        working-directory: ./web
        run: |
          npm run test:move-sourcemaps
          if find dist/client \( -name '*.map' -o -name '*.map.br' -o -name '*.map.gz' \) | grep .; then
            echo "::error::source maps left in web/dist/client"; exit 1
          fi
          if grep -rlE --include='*.js' --include='*.mjs' --include='*.css' '[#@][[:space:]]*sourceMappingURL=' dist/client; then
            echo "::error::sourceMappingURL comment left in web/dist/client"; exit 1
          fi
          test -f dist/sourcemaps/assets/main.js.map

      # The maps hold only the TypeScript sources already in this repository.
      # Kept for debugging and bundle attribution: uploaded only for pushes to
      # main, with short retention. The release workflow never uploads or
      # attaches them.
      - name: Upload web source maps
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-sourcemaps
          path: web/dist/sourcemaps/
          retention-days: 7
          if-no-files-found: error

      - name: Verify Web Types
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_checks != 'false' }}
        working-directory: ./web
        run: npm run typecheck

      - name: Lint Web Sources
        working-directory: ./web
        run: npm run lint

      - name: Lint Web E2E Specs
        working-directory: ./web
        run: npm run lint:e2e

      # The eslint override and lint:e2e-perf script cover the e2e-perf
      # harness sources; wired into CI so they run on every PR that touches
      # web/, harnesses/, pkg/**/testdata/ or this workflow, and on every
      # push to main (gated on changes.outputs.web_checks, see the job
      # comment).
      - name: Lint browser perf benchmark (e2e-perf)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_checks != 'false' }}
        working-directory: ./web
        run: npm run lint:e2e-perf

      # lib.mjs's pure functions (network-outcome classification, stats,
      # burst-target selection) have node:test coverage; wire it in so it
      # runs on every PR that touches web/, harnesses/, pkg/**/testdata/ or
      # this workflow, and on every push to main (gated as above).
      - name: Test browser perf benchmark (e2e-perf)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_checks != 'false' }}
        working-directory: ./web
        run: npm run test:e2e-perf

      # Self-tests of the e2e harness (startHub options against a stand-in
      # hub binary) and of the async create journey's pure helpers. Plain
      # Playwright test runner: no browser, no Go, a few seconds.
      - name: Test e2e support code (harness-selftest)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_checks != 'false' }}
        working-directory: ./web
        run: npm run test:e2e-support

      - name: Run Web Tests
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_checks != 'false' }}
        working-directory: ./web
        run: npm test

      - name: Format Check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Go formatting issues found. Run 'gofmt -w .' or 'make fmt' to fix."
            echo "$UNFORMATTED"
            exit 1
          fi

      # The pkg/hub package itself is vetted per shard, in the pkg/hub
      # shard jobs (make vet-hub-shard); these two leave it out.
      - name: Vet Code
        run: make lint-ci

      - name: Vet Integration-Tagged Code
        run: make vet-integration-ci

      - name: Vet Integration-Tagged Code (extras)
        run: make vet-integration-extras

      - name: Install ripgrep
        run: |
          if ! command -v rg &> /dev/null; then
            sudo apt-get install -y ripgrep
          fi

      - name: Check Compatibility Literals
        run: make compat-literals

      # Parse only: every pkg/hub test runs in exactly one shard, every
      # shard build compiles, and no hubshard tag is committed (the shard
      # jobs generate the tags as a go build overlay).
      - name: Check pkg/hub shard parity
        run: |
          if ! make hubshard-parity; then
            echo "::error title=pkg/hub shard parity::the pkg/hub test shards would drop, duplicate or break tests, or a hubshard tag is committed; the problems are listed in the step log above. See hack/hubshard/README.md."
            exit 1
          fi

      - name: Check Annotation Prefix
        run: make check-annotation-prefix

      - name: Check Setenv Guard
        run: make check-setenv-guard

      - name: Check Authorization Guards
        run: |
          # Invoked directly rather than via `make check-authz-guards`: GNU make
          # reports its own failure code (always 2), which would collapse the
          # script's exit 1 (violations found) and exit 3/4 (nothing was
          # analysed; see hack/LINT-CONVENTIONS.md) into one indistinguishable
          # result. Those mean opposite things.
          set +e
          ./hack/check-authz-guards.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Authorization guards::Authorization-bypass guard patterns found (see ptone/scion#591). The file:line: function list is in the step log above." ;;
            *) echo "::error title=Authorization guards NOT checked::check-authz-guards could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a guard failure." ;;
          esac
          exit "$rc"

      - name: Check Conversation Upsert Guard
        run: ./hack/check-conversation-upsert-guard.sh

      - name: Check Hub Store Reassignment Guard
        run: |
          set +e
          ./hack/check-hub-store-reassign.sh --self-test
          rc=$?
          if [ "$rc" -ne 0 ]; then
            set -e
            echo "::error title=Hub store reassignment NOT checked::check-hub-store-reassign --self-test failed (exit $rc) — the guard itself is broken or could not run, so nothing was analysed."
            exit "$rc"
          fi
          ./hack/check-hub-store-reassign.sh
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::error title=Hub store reassignment::pkg/hub test srv.store reassignments do not match hack/hub-store-reassign-baseline.txt (ptone/scion#3435). For a new reassignment, use installStoreFault / testServerWithStoreFault from pkg/hub/store_fault_helpers_test.go; if call sites were removed, lower the baseline. Details are in the step log."
          elif [ "$rc" -ne 0 ]; then
            echo "::error title=Hub store reassignment NOT checked::check-hub-store-reassign could not run (exit $rc) — nothing was analysed."
          fi
          exit "$rc"

      - name: Check Store Delete Callers
        run: |
          set +e
          ./hack/check-store-delete-callers.sh --self-test
          rc=$?
          if [ "$rc" -ne 0 ]; then
            set -e
            echo "::error title=Store delete callers NOT checked::check-store-delete-callers --self-test failed (exit $rc) — the guard itself is broken or could not run, so nothing was analysed."
            exit "$rc"
          fi
          ./hack/check-store-delete-callers.sh
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::error title=Store delete callers::A direct store DeleteAgent or DeleteProject reference does not match hack/store-delete-callers-allowlist.txt. The store methods do not deactivate delegation edges or service-account assignments; remove agents and projects through the delete engine or ProjectDeletionService, or deactivate first and add an allowlist entry. If calls were removed, lower the allowlist count. Details are in the step log."
          elif [ "$rc" -ne 0 ]; then
            echo "::error title=Store delete callers NOT checked::check-store-delete-callers could not run (exit $rc) — nothing was analysed."
          fi
          exit "$rc"

      - name: Check Harness Coverage in Cloud Build Configs
        run: |
          # Invoked directly rather than via a Makefile target, for the same
          # reason as Check Authorization Guards above: make would collapse
          # the script's exit 1 (a harness is out of sync, ptone/scion#2357)
          # and exit 2 (could not run, e.g. no PyYAML) into one code.
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update && sudo apt-get install -y python3-yaml; } || true
          set +e
          ./image-build/scripts/check-harness-coverage.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Harness coverage::A harnesses/<name>/Dockerfile is out of sync with one or more cloudbuild-*.yaml configs (see ptone/scion#2357). Details are in the step log above." ;;
            *) echo "::error title=Harness coverage NOT checked::check-harness-coverage.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a coverage failure." ;;
          esac
          exit "$rc"

      - name: Check Image Go Directories
        run: |
          # Invoked directly rather than via `make check-image-go-dirs`, for the
          # same reason as Check Authorization Guards above: make would collapse
          # the script's exit 1 (violations) and exit 2 (nothing was analysed).
          set +e
          ./hack/check-image-go-dirs.sh --self-test
          rc=$?
          if [ "$rc" -ne 0 ]; then
            set -e
            echo "::error title=Image Go directories NOT checked::check-image-go-dirs --self-test failed (exit $rc) — the check itself is broken or could not run, so nothing was analysed."
            exit "$rc"
          fi
          ./hack/check-image-go-dirs.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Image Go directories::A Dockerfile that builds the root Go module does not copy one of its top-level Go directories, or an ignore file drops one from the build context. Add the COPY line, or a justified EXCLUDED_DIRS entry in hack/check-image-go-dirs.sh; details are in the step log above." ;;
            *) echo "::error title=Image Go directories NOT checked::check-image-go-dirs.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

      - name: Check Security Marker Gates
        run: |
          # Invoked directly rather than via `make check-security-marker-gates`:
          # GNU make reports its own failure code (always 2), which would collapse
          # exit 1 (guard violation) and exit 2 (nothing was analysed) into one
          # indistinguishable result. Those mean opposite things.
          set +e
          ./hack/check-security-marker-gates.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Security marker gates::Security marker gate violations found — a guarded symbol was removed or moved out of its enclosing function. See the step log above." ;;
            *) echo "::error title=Security marker gates NOT checked::check-security-marker-gates could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a guard failure." ;;
          esac
          exit "$rc"

      - name: Check Route Authorization Manifest
        run: |
          # Invoked directly rather than via `make check-route-authz-manifest`:
          # GNU make reports its own failure code (always 2), which would collapse
          # the script's exit 1 (violations) and exit 4 (nothing was analysed)
          # into one indistinguishable result. Those mean opposite things.
          set +e
          ./hack/check-route-authz-manifest.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Route authorization manifest::Routes found without declared authorization posture (see ptone/scion#598). The route list is in the step log above." ;;
            *) echo "::error title=Route authorization manifest NOT checked::check-route-authz-manifest could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a manifest failure." ;;
          esac
          exit "$rc"

      - name: Check CLI Time Zones
        run: |
          # Invoked directly rather than via `make cli-time-zones`, for the same
          # reason as Check Authorization Guards above: make would collapse the
          # script's exit 1 (violations) and exit 3/4 (nothing was analysed).
          set +e
          ./hack/check-cli-time-zones.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=CLI time zones::A time layout in CLI code has no zone token. Format CLI times with pkg/clitime (clitime.Format); details are in the step log above." ;;
            *) echo "::error title=CLI time zones NOT checked::check-cli-time-zones.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

      - name: Check Time Literals
        run: |
          # Invoked directly rather than via `make time-literals`, for the same
          # reason as Check Authorization Guards above: make would collapse the
          # script's exit 1 (violations) and exit 3/4 (nothing was analysed).
          set +e
          ./hack/check-time-literals.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Time literals::A server-side time is formatted without .UTC() or bound in the wrong form for its column. Fix the site or add a justified entry to hack/time-literals-allowlist.txt; details are in the step log above." ;;
            *) echo "::error title=Time literals NOT checked::check-time-literals.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

      - name: Check Debug Defaults
        run: |
          # Invoked directly rather than via `make check-debug-defaults`, for the
          # same reason as Check Authorization Guards above: make would collapse
          # the script's exit 1 (violations) and exit 4 (nothing was analysed).
          set +e
          ./hack/check-debug-defaults.sh --self-test
          rc=$?
          if [ "$rc" -ne 0 ]; then
            set -e
            echo "::error title=Debug defaults NOT checked::check-debug-defaults --self-test failed (exit $rc) — the check itself is broken or could not run, so nothing was analysed."
            exit "$rc"
          fi
          ./hack/check-debug-defaults.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Debug defaults::A setup script, deploy template or hosted setup doc turns on debug logging by default. Remove it, or add a commented ALLOWLIST entry in hack/check-debug-defaults.sh for an intentional mention; details are in the step log above." ;;
            *) echo "::error title=Debug defaults NOT checked::check-debug-defaults.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

      # Every package with a `//go:build !no_sqlite` test file must be in
      # SQLITE_CI_PKGS (Makefile), i.e. tested untagged by a blocking job;
      # Run Tests below uses -tags no_sqlite and never compiles those files
      # (ptone/scion#1088). Invoked directly for the same reason as Check
      # Debug Defaults above.
      - name: Check SQLite Test Coverage
        run: |
          set +e
          ./hack/check-sqlite-coverage.sh --self-test
          rc=$?
          if [ "$rc" -ne 0 ]; then
            set -e
            echo "::error title=SQLite test coverage NOT checked::check-sqlite-coverage --self-test failed (exit $rc) — the check itself is broken or could not run, so nothing was analysed."
            exit "$rc"
          fi
          ./hack/check-sqlite-coverage.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=SQLite test coverage::A package has //go:build !no_sqlite test files that no blocking CI job runs with SQLite. Add it to SQLITE_NONHUB_PKGS in the Makefile; the package list is in the step log above." ;;
            *) echo "::error title=SQLite test coverage NOT checked::check-sqlite-coverage.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

      # Run Tests with a diagnostic hang watchdog (ptone/scion#3183). It is
      # diagnostic only: no retries, and on a normal pass or fail the step
      # exits with make test-fast-ci's own exit code. If the tests are still
      # running at the deadline (15m, ~3x the slowest successful Run Tests
      # of 5.1m), it logs the test process tree, the full process tree and
      # every pipe fd with its owning PID, sends SIGQUIT to the Go test
      # binaries (goroutine dumps), then to the whole tree, SIGKILLs what is
      # left, and fails with exit 124.
      # The step timeout is only a backstop in case the watchdog itself fails.
      - name: Run Tests
        timeout-minutes: 18
        run: |
          deadline_secs=900   # 15m
          grace_secs=30       # per escalation stage (QUIT binaries, QUIT tree)
          test_cmd=(make test-fast-ci)

          # bash starts background jobs with SIGINT/SIGQUIT ignored, and that
          # survives exec. Go test binaries get goroutine dumps on SIGQUIT
          # regardless (the Go runtime reinstalls its SIGQUIT handler), but
          # make/go keep an ignored SIGINT, so cancellation (INT) would not
          # reach them, and non-Go children would ignore the stage-2 QUIT.
          # env --default-signal (GNU coreutils >= 8.31) restores the defaults
          # a foreground make had. Probe for it so that a coreutils without
          # the flag (e.g. an older uutils) degrades instead of failing.
          sigreset=(env "--default-signal=INT,QUIT")
          if ! "${sigreset[@]}" true >/dev/null 2>&1; then
            echo "hangwatch: note: env --default-signal is unavailable; running make test-fast-ci without it (cancel will forward TERM as well as INT)"
            sigreset=()
          fi

          # PIDs (other than this shell) that hold the write end of this
          # step's output pipe on their stdout or stderr. This catches
          # orphans that left the test session (setsid, daemonised) and would
          # keep the step's output open after make exits. Only write ends
          # count (fdinfo access mode O_WRONLY or O_RDWR), so a process that
          # reads the pipe on fd 1 or 2 is never matched.
          step_out=$(readlink "/proc/$$/fd/1" 2>/dev/null || true)
          step_err=$(readlink "/proc/$$/fd/2" 2>/dev/null || true)
          # No pipeline inside: its own subshells would hold stderr too.
          pipe_holders() {
            local fd pid target key val flags self=$BASHPID
            for fd in /proc/[0-9]*/fd/1 /proc/[0-9]*/fd/2; do
              pid=${fd#/proc/}; pid=${pid%%/*}
              if [ "$pid" = "$$" ] || [ "$pid" = "$self" ]; then continue; fi
              target=$(readlink "$fd" 2>/dev/null) || continue
              case "$target" in pipe:*) ;; *) continue ;; esac
              if [ "$target" != "$step_out" ] && [ "$target" != "$step_err" ]; then continue; fi
              flags=
              while read -r key val; do
                if [ "$key" = "flags:" ]; then flags=$val; break; fi
              done 2>/dev/null <"/proc/$pid/fdinfo/${fd##*/}" || true
              case "$flags" in ''|*[!0-7]*) continue ;; esac
              if [ $(( 8#$flags & 3 )) -ne 0 ]; then echo "$pid"; fi
            done
          }

          # Kill processes outside the test session that still hold this
          # step's output pipe; they would keep the step open after it exits.
          # $1 completes the warning. Run on every exit path.
          kill_escaped() {
            local leftovers holders escaped="" p
            leftovers=$(pgrep -s "$test_pid" 2>/dev/null || true)
            holders=$(pipe_holders || true)
            for p in $holders; do
              case " $escaped " in *" $p "*) continue ;; esac
              grep -qx "$p" <<<"$leftovers" || escaped+="$p "
            done
            if [ -n "$escaped" ]; then
              echo "::warning title=Run Tests left orphans holding the step output::Processes outside the test session still held this step's stdout/stderr $1: $escaped"
              # shellcheck disable=SC2086 # word-splitting the PID list is intended
              ps -o pid,ppid,pgid,sid,etime,args -p "$(echo $escaped | tr ' ' ',')" || true
              # shellcheck disable=SC2086
              kill -KILL $escaped 2>/dev/null || true
            fi
          }

          # Own session, so the whole test tree can be signalled as one unit.
          # A background child of a non-interactive shell is not a process-
          # group leader, so setsid execs in place: the PID is also the SID.
          # As a background job its stdin is /dev/null (bash does this without
          # job control); before the watchdog make inherited the runner's
          # stdin. No test reads stdin, so this is deliberate and harmless.
          setsid "${sigreset[@]}" "${test_cmd[@]}" &
          test_pid=$!
          # The deadline timer must never hold the step's output pipe open,
          # which is the very failure it exists to diagnose, so it gets no
          # stdout/stderr. It is killed as soon as the tests exit.
          sleep "$deadline_secs" >/dev/null 2>&1 &
          timer_pid=$!

          # Signal everything in the test session (pgrep/pkill -s), matching
          # how leftovers are found below.
          forward() { pkill -"$1" -s "$test_pid" 2>/dev/null || true; }
          trap 'forward TERM; kill "$timer_pid" 2>/dev/null || true; kill_escaped "when the step was cancelled (SIGTERM), and were killed"; exit 143' TERM
          # Without env --default-signal, make and go ignore INT: send TERM too.
          trap 'forward INT; [ "${#sigreset[@]}" -gt 0 ] || forward TERM; kill "$timer_pid" 2>/dev/null || true; kill_escaped "when the step was cancelled (SIGINT), and were killed"; exit 130' INT
          trap 'kill "$timer_pid" 2>/dev/null || true' EXIT

          # The tests have exited with rc. Anything still in their session, or
          # anything still holding this step's output pipe, is an orphan;
          # report it, kill it, and exit with rc unchanged.
          finish() {
            local rc=$1 leftovers
            kill "$timer_pid" 2>/dev/null || true
            wait "$timer_pid" 2>/dev/null || true
            leftovers=$(pgrep -s "$test_pid" || true)
            if [ -n "$leftovers" ]; then
              echo "::warning title=Run Tests left orphans::Processes left behind by make test-fast-ci were killed after it exited (exit code $rc is unchanged): $(echo "$leftovers" | tr '\n' ' ')"
              # shellcheck disable=SC2086 # word-splitting the PID list is intended
              ps -o pid,ppid,pgid,sid,etime,args -p "$(echo $leftovers | tr ' ' ',')" || true
              forward KILL
            fi
            kill_escaped "after make test-fast-ci exited, and were killed (exit code $rc is unchanged)"
            exit "$rc"
          }

          # make exited on its own after the deadline, before the watchdog
          # signalled it: not a hang, so its exit code stands.
          finished_late() {
            local trc
            set +e; wait "$test_pid" 2>/dev/null; trc=$?; set -e
            echo "::warning title=Run Tests finished after the deadline::make test-fast-ci ran past ${deadline_secs}s but exited on its own (exit $trc) before the watchdog signalled it; diagnostics are in the step log above (ptone/scion#3183)."
            finish "$trc"
          }

          # Send signal $1 to the test session (extra pkill args follow). A
          # timeout is only recorded if make itself was still alive, so
          # signalling orphans after make exited never turns its exit code
          # into 124.
          signalled=0
          signal_tree() {
            local sig=$1 alive=0; shift
            if kill -0 "$test_pid" 2>/dev/null; then alive=1; fi
            if pkill -"$sig" -s "$test_pid" "$@" && [ "$alive" -eq 1 ]; then signalled=1; fi
          }

          set +e
          wait -n -p done_pid "$test_pid" "$timer_pid"
          rc=$?
          set -e

          if [ "$done_pid" = "$test_pid" ]; then
            finish "$rc"
          fi
          # The timer fired. If make exited at the same instant, it was not
          # a hang: report its own exit code.
          if ! kill -0 "$test_pid" 2>/dev/null; then
            set +e; wait "$test_pid"; rc=$?; set -e
            echo "hangwatch: make test-fast-ci exited at the deadline on its own (exit $rc); not treated as a timeout"
            finish "$rc"
          fi

          echo "===== hangwatch: make test-fast-ci still running after ${deadline_secs}s; collecting diagnostics ====="
          echo "----- hangwatch: test process tree (session $test_pid) -----"
          ps -s "$test_pid" --forest -o pid,ppid,pgid,sid,etime,stat,args || true
          echo "----- hangwatch: full process tree (ps -ef --forest) -----"
          ps -ef --forest || true
          echo "----- hangwatch: pipe fds, grouped by pipe (pipe pid fd comm); this step's stdout is $step_out, stderr is $step_err -----"
          pipes=$(
            self=$BASHPID
            for fd in /proc/[0-9]*/fd/*; do
              pid=${fd#/proc/}; pid=${pid%%/*}
              [ "$pid" = "$self" ] && continue
              target=$(readlink "$fd" 2>/dev/null) || continue
              case "$target" in pipe:*) ;; *) continue ;; esac
              printf '%s pid=%s fd=%s %s\n' "$target" "$pid" "${fd##*/}" "$(cat "/proc/$pid/comm" 2>/dev/null)"
            done
          ) || true
          printf '%s\n' "$pipes" | sort -V || true
          echo "----- hangwatch: SIGQUIT to Go test binaries (goroutine dumps follow) -----"
          pgrep -a -s "$test_pid" -f '\.test( |$)' || echo "(no Go test binaries running)"
          signal_tree QUIT -f '\.test( |$)'
          for _ in $(seq "$grace_secs"); do kill -0 "$test_pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$test_pid" 2>/dev/null; then
            echo "----- hangwatch: SIGQUIT to the whole test process tree -----"
            signal_tree QUIT
            for _ in $(seq "$grace_secs"); do pgrep -s "$test_pid" >/dev/null || break; sleep 1; done
          fi
          # make exited on its own during the grace period without being
          # signalled: report its code, and finish() kills any orphans.
          if [ "$signalled" -eq 0 ] && ! kill -0 "$test_pid" 2>/dev/null; then
            finished_late
          fi
          if pgrep -s "$test_pid" >/dev/null; then
            echo "----- hangwatch: SIGKILL to what is left -----"
            pgrep -a -s "$test_pid" || true
            signal_tree KILL
          fi
          if [ "$signalled" -eq 0 ]; then
            finished_late
          fi
          set +e; wait "$test_pid" 2>/dev/null; set -e
          kill_escaped "after the watchdog killed make test-fast-ci, and were killed"
          echo "::error title=Run Tests timed out::make test-fast-ci was still running after ${deadline_secs}s (the deadline is ~3x the slowest successful Run Tests when it was sized) and was killed by the hang watchdog. Process tree, pipe holders and goroutine dumps are in the step log above. Not retried (ptone/scion#3183)."
          exit 124

      - name: Build Binary
        run: make build

      - name: Save Go cache
        uses: ./.github/actions/save-go-cache
        with:
          key: ${{ steps.go.outputs.cache-key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}

  sqlite-nonhub-tests:
    name: SQLite Tests (non-hub)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: sqlite-nonhub

      # pkg/hub/attache2e attaches to a real tmux server; with
      # SCION_TEST_REQUIRE_TMUX=1 it fails instead of skipping when tmux
      # is missing (ptone/scion#3312).
      - name: Install tmux
        run: |
          if ! command -v tmux &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          tmux -V

      # `make test-fast-ci` (Build & Test, above) uses -tags no_sqlite, which
      # leaves out every test file that carries `//go:build !no_sqlite`
      # because it needs a real SQLite-backed store (ptone/scion#1118). This
      # job runs those packages untagged, so they are compiled and run
      # somewhere that can fail a PR: the pkg/hub subpackages,
      # perf/bench/seed (ptone/scion#2393), pkg/store/entadapter
      # (ptone/scion#2851), pkg/conduit (relay/router tests on the
      # SQLite-backed registry store), pkg/artifacts, and pkg/brokerownership,
      # pkg/brokerregistration, pkg/ent/entc, pkg/secret, pkg/store/storetest
      # and pkg/testinfra (ptone/scion#1088); the list is SQLITE_NONHUB_PKGS
      # in the Makefile, and Build & Test's Check SQLite Test Coverage step
      # fails if a package with !no_sqlite tests is missing from it. The
      # pkg/hub package itself runs in the pkg/hub shard jobs below. The 60m
      # go test timeout is kept from when pkg/hub ran here; the 70m job
      # timeout stays above it so a real hang still produces go's goroutine
      # dump.
      - name: Run SQLite-enabled tests (make test-sqlite-nonhub)
        env:
          SCION_TEST_REQUIRE_TMUX: "1"
        run: make test-sqlite-nonhub

      # internal/fixturegen's TestFixtureCoverage carries `//go:build
      # !no_sqlite`, so Build & Test (-tags no_sqlite) never compiles it;
      # before this step it ran only in the non-blocking Full Test Suite,
      # and went red on main twice when a schema change skipped the fixture
      # (ptone/scion#625, ptone/scion#1931).
      - name: Run fixture coverage gate (SQLite)
        if: ${{ !cancelled() }}
        run: make test-fixture-coverage

      # 41 cmd test files carry `//go:build !no_sqlite`; before this step
      # they ran only in the non-blocking Full Test Suite
      # (ptone/scion#1088). This runs the whole cmd package untagged.
      - name: Run cmd tests (SQLite)
        if: ${{ !cancelled() }}
        run: make test-cmd-sqlite

      - name: Save Go cache
        uses: ./.github/actions/save-go-cache
        with:
          key: ${{ steps.go.outputs.cache-key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}

  # The pkg/hub package's tests, split into build-tag shards
  # (hack/hubshard/README.md). A shard's test binary compiles with about
  # half the memory of the whole package's (about 6 GiB instead of 12), and
  # the shards run in parallel. Each job generates the shard tags as a go
  # build overlay (the tree carries none), checks that its binary holds
  # exactly the tests hack/hubshard expects, and runs them; the common
  # files' tests run only in shard 1, so every test runs exactly once (make
  # hubshard-parity checks it in Build & Test). The shard list comes from
  # hack/hubshard (hub-shard-plan), so the shard count lives in one place.
  hub-shard-plan:
    name: pkg/hub shard plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      integration_shards: ${{ steps.integration.outputs.integration_shards }}
      # The single place to change the runner label for every pkg/hub shard
      # job (hub-shard and hub-shard-postgres-integration).
      runner: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: hub-shard-plan

      - name: List the pkg/hub shards
        id: plan
        run: |
          shards=$(./hack/hubshard/hubshard.sh -shards)
          echo "shards=$(echo "$shards" | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$shards" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "pkg/hub shards: $(echo "$shards" | tr '\n' ' ')"

      # The shards that hold a -tags integration pkg/hub Postgres test
      # (HUB_INTEGRATION_POSTGRES_TESTS in the Makefile); fails if a listed
      # test no longer exists.
      - name: List the pkg/hub shards with integration Postgres tests
        id: integration
        run: |
          set -o pipefail
          shards=$(make -s hub-postgres-integration-shards)
          json=$(printf '%s\n' "$shards" | jq -cR 'select(length > 0) | tonumber' | jq -cs .)
          # hubshard -locate fails on a name in no test file, so at least
          # one shard must come back; [] means the listing itself broke.
          if [ -z "$json" ] || [ "$json" = '[]' ]; then
            echo "::error title=pkg/hub shard plan::no pkg/hub shard holds a HUB_INTEGRATION_POSTGRES_TESTS test (got '$json' from '$shards')"
            exit 1
          fi
          echo "integration_shards=$json" >> "$GITHUB_OUTPUT"
          echo "pkg/hub shards with integration Postgres tests: $json"

      - name: Save Go cache
        uses: ./.github/actions/save-go-cache
        with:
          key: ${{ steps.go.outputs.cache-key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}

  hub-shard:
    name: pkg/hub shard ${{ matrix.shard }}/${{ needs.hub-shard-plan.outputs.count }}
    needs: hub-shard-plan
    # The runner label comes from hub-shard-plan (outputs.runner), the
    # single place to change it for every pkg/hub shard job.
    runs-on: ${{ needs.hub-shard-plan.outputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.hub-shard-plan.outputs.shards) }}
    services:
      postgres:
        # Pulled through the Google Docker Hub mirror to avoid the Docker Hub unauthenticated pull limit (ptone/scion#4147).
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # --tmpfs: the data directory in RAM (CI only). The path is PGDATA
        # of the postgres image up to 17; 18+ moved it to
        # /var/lib/postgresql/18/docker, so change it with the image tag.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # One Go cache for every shard (and the shard integration Postgres
      # jobs). The shards share pkg/hub's non-test dependencies (the
      # hubshard tags select only pkg/hub test files), but a test-only
      # import that only one shard's test files use (for example chromedp,
      # imported only by suspended_page_browser_test.go) is downloaded and
      # built only by that shard, and so is not in the shared cache unless
      # that shard is the first. Only the first shard saves the cache (the
      # Save step's if:), so the shards do not race to save one key. Its
      # trim drops the other shards' own pkg/hub test builds (about 30 s
      # each to recompile), which a PR rebuilds anyway whenever it changes
      # pkg/hub or anything pkg/hub imports; one cache instead of six saves
      # about 3.4 GB of the repo's 10 GB cache budget (ptone/scion#4251).
      - name: Setup Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: hub-shards

      # SQLite-enabled (no build tag besides the shard's). The Postgres
      # variables are not set here, so the Postgres tests skip, as they did
      # in the old single pkg/hub job; the last step runs them.
      - name: Run pkg/hub shard tests (SQLite)
        env:
          SHARD: ${{ matrix.shard }}
        run: make test-hub-shard SHARD="$SHARD"

      # The no_sqlite build of the same shard (Build & Test's test-fast-ci
      # leaves pkg/hub out).
      - name: Run pkg/hub shard tests (no_sqlite)
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: make test-hub-shard SHARD="$SHARD" NOSQLITE=1

      # go vet with -tags no_sqlite and -tags 'integration volume_test
      # tzcontract': the shards together cover every pkg/hub file the
      # module-wide make lint and make vet-integration covered.
      - name: Vet pkg/hub shard
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: make vet-hub-shard SHARD="$SHARD"

      # CI-only: no fsync, no synchronous commit, no full-page writes
      # (throwaway database; see the action for why). Here, just before the
      # one step that uses Postgres, so that a failure to tune it does not
      # skip the SQLite and no_sqlite shard tests above.
      - name: Tune CI Postgres
        if: ${{ !cancelled() }}
        uses: ./.github/actions/postgres-ci-tune
        with:
          container: ${{ job.services.postgres.id }}

      # The default-tag pkg/hub Postgres tests that live in this shard: the
      # web chat store tests (own SQL, read SCION_TEST_POSTGRES_DSN) and the
      # conduit stream re-check tests. Every listed test must pass and none
      # may skip. See the Makefile target's comment. The -tags integration
      # ones run in the hub-shard-postgres-integration jobs below.
      - name: Run pkg/hub shard Postgres tests
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
          SCION_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          SCION_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make test-hub-postgres-default SHARD="$SHARD"

      # The first shard only (see Setup Go). No status function in the if:,
      # so the implicit success() still keeps a failed shard from saving.
      - name: Save Go cache
        if: ${{ matrix.shard == fromJSON(needs.hub-shard-plan.outputs.shards)[0] }}
        uses: ./.github/actions/save-go-cache
        with:
          key: ${{ steps.go.outputs.cache-key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}

  # The -tags integration pkg/hub Postgres tests (project delete lock
  # order, two-replica scheduled send, membership loss and test identity
  # concurrency) of each shard that holds one. Their binary is a separate
  # pkg/hub compile (-tags integration has its own TestMain and test
  # files, so the shard job's binary cannot run them), about 1.5-2.5 min;
  # in its own job, in parallel with the shard jobs, it is off their
  # critical path. Every listed test must pass and none may skip
  # (hack/hubshard/shard.sh postgres). The plan fails if no shard holds
  # one, so this job always has at least one shard.
  hub-shard-postgres-integration:
    name: pkg/hub shard ${{ matrix.shard }}/${{ needs.hub-shard-plan.outputs.count }} Postgres (integration)
    needs: hub-shard-plan
    runs-on: ${{ needs.hub-shard-plan.outputs.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.hub-shard-plan.outputs.integration_shards) }}
    services:
      postgres:
        # Pulled through the Google Docker Hub mirror to avoid the Docker Hub unauthenticated pull limit (ptone/scion#4147).
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # --tmpfs: the data directory in RAM (CI only). The path is PGDATA
        # of the postgres image up to 17; 18+ moved it to
        # /var/lib/postgresql/18/docker, so change it with the image tag.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # CI-only: no fsync, no synchronous commit, no full-page writes
      # (throwaway database; see the action for why).
      - name: Tune CI Postgres
        uses: ./.github/actions/postgres-ci-tune
        with:
          container: ${{ job.services.postgres.id }}

      - name: Setup Go
        # Restores the shards' shared cache (pkg/hub's dependencies); saves
        # none, to keep the repo cache budget for the hub-shards cache.
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: hub-shards

      - name: Run pkg/hub shard integration Postgres tests
        env:
          SHARD: ${{ matrix.shard }}
          SCION_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          SCION_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make test-hub-postgres-integration SHARD="$SHARD"

  # The single, stable check name for the pkg/hub tests (the name the old
  # single pkg/hub job had, so a required check keeps working). A matrix
  # job's names include the matrix values, so they are not usable as
  # required checks. It fails unless every shard job and every shard
  # integration Postgres job succeeded.
  hub-sqlite-tests:
    name: pkg/hub SQLite Tests
    needs: [hub-shard-plan, hub-shard, hub-shard-postgres-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check shard results
        env:
          PLAN: ${{ needs.hub-shard-plan.result }}
          RESULT: ${{ needs.hub-shard.result }}
          INTEGRATION: ${{ needs.hub-shard-postgres-integration.result }}
        run: |
          if [ "$PLAN" != success ] || [ "$RESULT" != success ]; then
            echo "::error title=pkg/hub shards::the pkg/hub shard plan (result: $PLAN) or one or more pkg/hub shard jobs (result: $RESULT) did not succeed; see the pkg/hub shard jobs."
            exit 1
          fi
          if [ "$INTEGRATION" != success ]; then
            echo "::error title=pkg/hub shards::one or more pkg/hub shard integration Postgres jobs did not succeed (result: $INTEGRATION); see the pkg/hub shard Postgres (integration) jobs."
            exit 1
          fi

  # T1 Launch Store PostgreSQL Tests runs as several parallel jobs; the
  # job below with the old name only rolls them up. About 70% of the old
  # single job was pkg/store/entadapter on Postgres (~13 of ~20 min), so
  # that package's tests are split by name into strategy.job-total parts
  # (hack/testpart.sh: round-robin over the sorted top-level test names),
  # one job each, and the other Postgres packages run in one more job.
  # Every entadapter job checks that the parts together hold every test of
  # the package exactly once (testpart.sh parity) and that every test of
  # its part printed a PASS or SKIP line.
  #
  # The entadapter jobs. The number of parts is the number of matrix jobs
  # (strategy.job-total); to change it, change the part list, which must
  # be 1..N in order (the run step checks part == job-index + 1).
  launch-store-postgres-entadapter:
    name: T1 Launch Store PostgreSQL Tests (entadapter ${{ matrix.part }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # 90m: the whole entadapter suite took ~29-39m of the old single job on
    # main, but ~57m on a runner 2-3x slower than usual
    # (GoogleCloudPlatform/scion#2855), where it hit its old 40m go test
    # timeout. make test-store-postgres-entadapter gives each part 60m, and
    # 90m keeps the job limit above the go test limit so a real hang still
    # produces go's goroutine dump instead of a bare job kill
    # (ptone/scion#3945).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    services:
      postgres:
        # Pulled through the Google Docker Hub mirror to avoid the Docker Hub unauthenticated pull limit (ptone/scion#4147).
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # --tmpfs: the data directory in RAM (CI only). The path is PGDATA
        # of the postgres image up to 17; 18+ moved it to
        # /var/lib/postgresql/18/docker, so change it with the image tag.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # CI-only: no fsync, no synchronous commit, no full-page writes
      # (throwaway database; see the action for why).
      - name: Tune CI Postgres
        uses: ./.github/actions/postgres-ci-tune
        with:
          container: ${{ job.services.postgres.id }}

      - name: Setup Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: t1-entadapter

      # The splitter's own tests (bash only, a second).
      - name: Test the test splitter (hack/testpart.sh)
        run: make testpart-selftest

      # The full pkg/store/entadapter suite (ptone/scion#2207; see the
      # Makefile's test-store-postgres comment), which runs unchanged
      # against SQLite (the default `go test` build) and Postgres (here, via
      # -tags integration) to prove dialect parity. This job runs part
      # matrix.part of strategy.job-total of its top-level tests, with the
      # same skip checks as the unsplit run. The part must be the job's
      # own position in the matrix, so a part list that is not 1..N (a
      # gap would leave a part unrun) fails here.
      - name: Run entadapter tests (Postgres-enabled, part ${{ matrix.part }}/${{ strategy.job-total }})
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          PART: ${{ matrix.part }}
          PARTS: ${{ strategy.job-total }}
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          if [ "$PART" != "$((JOB_INDEX + 1))" ]; then
            echo "::error title=T1 entadapter matrix::matrix.part is $PART but this is matrix job $((JOB_INDEX + 1)) of $PARTS; the part list must be 1..N in order"
            exit 1
          fi
          make test-store-postgres-entadapter ENTADAPTER_PART="$PART" ENTADAPTER_PARTS="$PARTS"

      - name: Save Go cache
        uses: ./.github/actions/save-go-cache
        with:
          key: ${{ steps.go.outputs.cache-key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}

  # The T1 Postgres packages other than pkg/store/entadapter.
  launch-store-postgres-others:
    name: T1 Launch Store PostgreSQL Tests (other packages)
    runs-on: ubuntu-latest
    # The old single job took ~20m, of which ~7m was this job's part; 45m
    # leaves room for a runner 2-3x slower than usual.
    timeout-minutes: 45
    services:
      postgres:
        # Pulled through the Google Docker Hub mirror to avoid the Docker Hub unauthenticated pull limit (ptone/scion#4147).
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # --tmpfs: the data directory in RAM (CI only). The path is PGDATA
        # of the postgres image up to 17; 18+ moved it to
        # /var/lib/postgresql/18/docker, so change it with the image tag.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # CI-only: no fsync, no synchronous commit, no full-page writes
      # (throwaway database; see the action for why).
      - name: Tune CI Postgres
        uses: ./.github/actions/postgres-ci-tune
        with:
          container: ${{ job.services.postgres.id }}

      - name: Setup Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: t1-others

      # design t1-async-create-v11.md §6, "Postgres in CI": runs
      # pkg/store/integrationtest (the existing Postgres-only harness), the
      # storetest group/MembershipCleanup conformance, the pkg/ent/entc and
      # cmd Postgres tests (see the Makefile's test-store-postgres comment).
      # With the entadapter jobs above, T1 owns every Postgres-specific
      # assertion in P1a: the transaction-scoped advisory lock, SKIP LOCKED,
      # lock_timeout/idle-in-transaction SET LOCAL, and the per-row
      # savepoints. The job also runs the timestamp contract test (last step).
      - name: Run launch store tests (Postgres-enabled, without entadapter)
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make test-store-postgres-others

      # The pkg/artifacts store is likewise not an Ent store (it creates its
      # own artifact_* tables at Init), so it has its own Postgres SQL. Its
      # store tests run once per dialect; this step adds the Postgres pass.
      - name: Run artifact store tests (SQLite and Postgres)
        if: ${{ !cancelled() }}
        env:
          SCION_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make test-artifacts-postgres

      # tz-refactor design §2.2 / AC1: the real-binary timestamp contract
      # test. It runs the SQLite and Postgres cases (about 2-3 minutes,
      # including the binary build) and runs
      # even when the launch store step fails, so its result is never hidden.
      - name: Run timestamp contract test (SQLite and Postgres)
        if: ${{ !cancelled() }}
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make test-tz-contract

      - name: Save Go cache
        uses: ./.github/actions/save-go-cache
        with:
          key: ${{ steps.go.outputs.cache-key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}

  # The single, stable check name for T1 (the name the old single job had,
  # so a required check keeps working; matrix job names include the matrix
  # values). It fails unless every entadapter part and the other-packages
  # job succeeded: a failed, cancelled or skipped part fails it.
  launch-store-postgres-tests:
    name: T1 Launch Store PostgreSQL Tests
    needs: [launch-store-postgres-entadapter, launch-store-postgres-others]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check T1 part results
        env:
          ENTADAPTER: ${{ needs.launch-store-postgres-entadapter.result }}
          OTHERS: ${{ needs.launch-store-postgres-others.result }}
        run: |
          if [ "$ENTADAPTER" != success ] || [ "$OTHERS" != success ]; then
            echo "::error title=T1 Launch Store PostgreSQL Tests::one or more T1 entadapter jobs (result: $ENTADAPTER) or the T1 other-packages job (result: $OTHERS) did not succeed; see the T1 Launch Store PostgreSQL Tests jobs."
            exit 1
          fi

  workstation-smoke:
    name: Workstation smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: workstation-smoke

      # End-to-end check of the workstation hub path with the default build
      # tags (SQLite on; `make test-fast` uses no_sqlite): in a temp HOME and
      # a temp git repo, `scion hub link` with no hub fails with the
      # not-configured error, `scion server start` starts the local hub,
      # `scion hub link` links without a prompt, `scion hub status` shows the
      # link, `scion list` answers through the hub, and `scion server stop`
      # stops it.
      - name: Run workstation smoke test
        run: ./hack/workstation-smoke.sh

      - name: Save Go cache
        uses: ./.github/actions/save-go-cache
        with:
          key: ${{ steps.go.outputs.cache-key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    # Bounds a hang only; the runner shutdowns in ptone/scion#4208 were not
    # timeouts. Passing lint steps took up to ~22 min at the default
    # concurrency (4); --concurrency=2 below can make that up to ~2x slower
    # in the worst case, plus checkout and cache restore, so 60 leaves margin
    # without falling back to the 360-minute default.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # golangci-lint-action caches only golangci-lint's own analysis cache
      # (~/.cache/golangci-lint), not GOCACHE, which golangci-lint's
      # package loading (go list) fills: 4.2 GB on a cold run.
      # With this cache restored, golangci-lint took 584-776 s on main
      # (7 runs) against 818-1063 s without it (5 runs), so it stays.
      - name: Setup Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: lint

      # The action only restores its analysis cache and installs the binary
      # here (its post step still saves the cache); lint runs in the next
      # step so that a memory sampler can log alongside it. The version is
      # pinned so that a new golangci-lint release cannot change memory use
      # unnoticed; bump it deliberately.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          install-only: true

      # Bound memory in the lint step so it cannot exhaust the ~16 GB
      # runner, which shows up as "The runner has received a shutdown
      # signal" with no lint output (ptone/scion#4208). golangci-lint
      # loads packages through go list -export, which compiles each
      # package for its export data in a separate compile process. The
      # memory sampler measured one compile process at ~15 GB, while
      # golangci-lint itself peaked at 5.6-5.7 GB.
      # - GOFLAGS -gcflags=<pkg/hub>=-c=1 runs the compiler backend for
      #   pkg/hub on one worker instead of up to four. This may lower
      #   that compile's peak by the backend state of up to three
      #   functions compiled at once; most of its memory is retained IR
      #   and generated code, which -c does not change, so the effect
      #   is expected to be modest. The package pattern limits the flag
      #   to pkg/hub; without one it would apply to every package
      #   matched by ./..., which golangci-lint loads. golangci-lint
      #   passes its environment through to go list and sets no
      #   -gcflags of its own.
      # - --concurrency=2 (default: CPU count, 4) halves the packages
      #   golangci-lint analyses at once, lowering its own memory; it
      #   does not bound the compile processes.
      # - GOGC=25 sets the heap target to 1.25x the live heap (default
      #   2x; previously 1.5x), trading GC CPU for a lower peak. The
      #   compile processes inherit it.
      # - GOMEMLIMIT=8GiB is a soft limit: the GC runs harder near that
      #   size but does not cap the heap if the live set is larger.
      #   Close to the limit it holds the heap there rather than at
      #   1.25x the live heap.
      # GOLANGCI_LINT_CACHE is exported because the action sets it only
      # in its own process; it must match the path the action restores
      # and saves.
      # The sampler prints memory and the largest process every 30 s to
      # the live log, so the last lines before a runner shutdown show
      # how close memory was to the limit. For a compile process it also
      # prints the package (-p, read from the response file when the
      # arguments are passed as @file) and the response file's line
      # count, which tells a package from its test variant. It prints a
      # peak summary at the end and does not affect the step's result;
      # the step exits with golangci-lint's exit code.
      - name: golangci-lint
        shell: bash
        env:
          GOGC: '25'
          GOMEMLIMIT: 8GiB
          GOFLAGS: '-gcflags=github.com/GoogleCloudPlatform/scion/pkg/hub=-c=1'
        run: |
          export GOLANGCI_LINT_CACHE="$HOME/.cache/golangci-lint"
          samples="$RUNNER_TEMP/lint-mem.log"
          : > "$samples"
          (
            trap 'kill "$nap" 2>/dev/null; exit 0' TERM
            while :; do
              line="$(date -u +%H:%M:%S) $(free -m | awk 'NR==2{printf "used=%s avail=%s total=%s", $3, $7, $2}') top_rss_mb=$(ps -ww -eo rss=,comm=,args= --sort=-rss | awk 'NR==1{p=""; r=""; if ($2=="compile") { for (i=3; i<=NF; i++) { if ($i=="-p" && i<NF) p=$(i+1); else if ($i ~ /^@/ && p=="") { f=substr($i,2); prev=""; n=0; while ((getline l < f) > 0) { n++; if (prev=="-p" && p=="") p=l; prev=l }; close(f); if (n>0) r=",rsp_lines=" n } } } if (p!="" || r!="") p="[" p r "]"; printf "%s%s:%d", $2, p, $1/1024}')"
              echo "mem: $line"
              echo "$line" >> "$samples"
              sleep 30 & nap=$!
              wait "$nap"
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          rc=0
          golangci-lint run --new-from-merge-base=origin/main --concurrency=2 || rc=$?
          kill "$sampler" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true
          awk '{split($2,u,"="); split($3,a,"="); if (u[2]>max) max=u[2]; if (min=="" || a[2]<min) min=a[2]; n++}
            END {if (n==0) print "mem summary: no samples"; else printf "mem summary: %d samples, peak used=%d MB, min avail=%d MB\n", n, max, min}' "$samples" || true
          exit "$rc"

      - name: Save Go cache
        uses: ./.github/actions/save-go-cache
        with:
          key: ${{ steps.go.outputs.cache-key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      # Positive control -- this gate is not a no-op.
      #
      # Before it was added, scripts/hub-env-integration-test.sh:328 and
      # scripts/hub-secret-integration-test.sh:329 both read:
      #
      #     PROJECT_ID=$($SCION config get project_id 2>/dev/null || "")
      #
      # The `|| ""` runs the empty string as a command name -- SC2286, an
      # error-severity finding. (The intended form, `|| echo ""`, appears on
      # that same line in both files today.) Re-introducing that `|| ""` makes
      # this step exit 1, which is how you can confirm the job catches real
      # defects.
      #
      # -x plus --source-path=SCRIPTDIR lets shellcheck follow `source` targets
      # relative to each script's own directory, which honours the existing
      # `# shellcheck source=` directives (e.g. image-build/scripts/lib/targets.sh
      # and scripts/starter-hub/hub-config.sh) instead of reporting SC1091.
      - name: Run shellcheck
        run: |
          checked=0
          failed=0
          while IFS= read -r script; do
            checked=$((checked + 1))
            if ! shellcheck -x --source-path=SCRIPTDIR "$script"; then
              failed=$((failed + 1))
            fi
          done < <(
            {
              find . -type f -name '*.sh' \
                -not -path './.git/*' \
                -not -path './vendor/*' \
                -not -path '*/vendor/*' \
                -not -path '*/node_modules/*'
              # The test stubs have no extension (they stand in for real
              # commands on PATH, which have none either), so the *.sh find
              # above never sees them.
              echo './scripts/single-node-vm/tests/lib/gcloud'
              echo './scripts/starter-hub/tests/lib-tls/caddy'
              echo './scripts/starter-hub/tests/lib-tls/certbot'
              echo './scripts/starter-hub/tests/lib-tls/id'
              echo './scripts/starter-hub/tests/lib-tls/openssl'
              echo './scripts/starter-hub/tests/lib-tls/runuser'
              echo './scripts/starter-hub/tests/lib-tls/systemctl'
              echo './scripts/starter-hub/tests/lib/curl'
              echo './scripts/starter-hub/tests/lib/gcloud'
              echo './scripts/starter-hub/tests/lib/sleep'
            } | sort
          )
          echo "shellcheck: $((checked - failed))/${checked} file(s) passed"
          if [ "$checked" -eq 0 ]; then
            echo "::error::no shell scripts found -- the file discovery is broken"
            exit 1
          fi
          if [ "$failed" -gt 0 ]; then
            echo "::error::shellcheck reported issues in ${failed} file(s)"
            exit 1
          fi

      # The step above lints check-cloud-init.sh as a file but never runs it,
      # so the cloud-init runcmd body (which executes under /bin/sh, not bash)
      # went unchecked (ptone/scion#1769). Running the script extracts runcmd
      # and lints it with `shellcheck -s sh`; a bash-only construct such as
      # `&>` (SC3020) in runcmd fails this step.
      - name: Check cloud-init runcmd is POSIX sh
        if: ${{ !cancelled() }}
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
          ./scripts/single-node-vm/check-cloud-init.sh

      - name: Check for bare MethodNotAllowed calls
        # Blocking (ptone/scion#2421). Formerly the reporting-only "Lint 405
        # Allow header (reporting only)" job, folded in here to save a runner
        # spin-up (ptone/scion#2845); the logic now lives in
        # hack/check-method-not-allowed.sh and covers pkg/hub and
        # pkg/runtimebroker (bare helper calls) plus pkg/sciontool,
        # extras/docs-agent and extras/scion-telegram (direct
        # StatusMethodNotAllowed writes without Allow, ptone/scion#2858).
        # It is a step, not a separate check, so it adds no check name.
        # !cancelled() runs it even when Run shellcheck above failed, so
        # both results show on one run.
        #
        # Invoked directly rather than via `make check-method-not-allowed`,
        # for the same reason as Check Authorization Guards in Build & Test:
        # make would collapse exit 1 (violations) and exit 3/4 (nothing was
        # analysed) into one code.
        if: ${{ !cancelled() }}
        run: |
          # Prove the matcher works on this runner's grep before trusting a
          # clean scan. The `|| st=$?` guard keeps `bash -e` from aborting, so
          # a self-test failure fails the step via the explicit exit 1 below,
          # before the real scan runs. Exit 3 means a required tool (grep) is
          # missing and 126/127 mean the script itself could not be executed;
          # neither means the matcher is broken.
          st=0
          ./hack/check-method-not-allowed.sh --self-test || st=$?
          if [ "$st" -ne 0 ]; then
            if [ "$st" -eq 3 ]; then
              echo "::error title=405 Allow header NOT checked::check-method-not-allowed --self-test could not run (exit 3: required tool missing) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase."
            elif [ "$st" -eq 126 ] || [ "$st" -eq 127 ]; then
              echo "::error title=405 Allow header NOT checked::hack/check-method-not-allowed.sh could not be executed (exit $st: not found or not executable) — NOTHING WAS ANALYSED. This is a checkout or permissions failure, not a statement about the codebase."
            else
              echo "::error title=405 Allow header NOT checked::check-method-not-allowed --self-test failed (exit $st) — the matcher is broken on this runner, so NOTHING WAS ANALYSED."
            fi
            exit 1
          fi
          set +e
          ./hack/check-method-not-allowed.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=405 Allow header::405 responses without an Allow header found (RFC 9110 15.5.6): pass the accepted methods to MethodNotAllowed, e.g. MethodNotAllowed(w, http.MethodGet), or set w.Header().Set(\"Allow\", ...) before writing StatusMethodNotAllowed. The file:line list is in the step log above." ;;
            *) echo "::error title=405 Allow header NOT checked::check-method-not-allowed could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

  ent-generate-check:
    name: ent generated code drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          workload: ent-check

      # Fails when go mod tidy would change go.mod or go.sum (ptone/scion#4799),
      # for example when tidy would drop go.sum lines that the ent generator
      # needs. Runs before the ent check: go tool ent runs read-only, so a
      # missing go.sum entry makes go generate fail (ent-check exit 3), and this
      # step names that problem first. It writes no files. tidy-check exits 3
      # when go mod tidy itself failed and 1 when the module is not tidy; make
      # collapses both to exit 2, so the step tells them apart by the target's
      # "(not drift)" line.
      - name: Check go.mod and go.sum are tidy
        run: |
          set -o pipefail
          if ! make tidy-check 2>&1 | tee "$RUNNER_TEMP/tidy-check.log"; then
            if grep -qF 'go mod tidy -diff failed (not drift)' "$RUNNER_TEMP/tidy-check.log"; then
              echo "::error title=go mod tidy failed (not drift)::go mod tidy -diff failed, so tidiness was NOT checked. The error (module download or resolution) is in the step log above."
            else
              echo "::error title=go.mod/go.sum not tidy::go mod tidy would change go.mod or go.sum. Run 'go mod tidy' and commit the result."
            fi
            exit 1
          fi

      # Regenerates pkg/ent from pkg/ent/schema and fails on any diff or new
      # untracked file under pkg/ent, or any go.mod/go.sum change
      # (ptone/scion#2746). Nothing else checks that a schema edit was
      # committed together with its generated code. Its own job, not a Build &
      # Test step: generation downloads ent's codegen dependencies.
      - name: Check ent generated code is up to date
        #
        # ent-check exits 3 when go generate itself failed (schema compile,
        # module download error, or a missing go.sum entry) and 1 on drift.
        # make collapses both to exit 2, so the step tells them apart by the
        # target's "(not drift)" line.
        run: |
          set -o pipefail
          if ! make ent-check 2>&1 | tee "$RUNNER_TEMP/ent-check.log"; then
            if grep -qF 'go generate ./pkg/ent failed (not drift)' "$RUNNER_TEMP/ent-check.log"; then
              echo "::error title=ent generation failed (not drift)::go generate ./pkg/ent failed, so drift was NOT checked. The generator error (schema compile, module download, or a missing go.sum entry: run 'make tidy-check') is in the step log above."
            else
              echo "::error title=ent generated code drift::pkg/ent does not match pkg/ent/schema. Run 'go generate ./pkg/ent' and commit the result."
            fi
            exit 1
          fi

      - name: Save Go cache
        uses: ./.github/actions/save-go-cache
        with:
          key: ${{ steps.go.outputs.cache-key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}

  single-node-vm-deploy-tests:
    name: single-node-vm deploy.sh test harness
    needs: changes
    # Runs only when scripts/single-node-vm/** or this workflow changed, and
    # always on push to main. Fails open: if the changes job did not succeed,
    # the harness runs anyway.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.single_node_vm == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Never contacts GCP: a stub `gcloud` shadows any real one on PATH.
      # ubuntu-latest already ships bash >= 4 and python3; see
      # scripts/single-node-vm/tests/README.md for what this covers.
      - name: Run scripts/single-node-vm/tests/run.sh
        run: ./scripts/single-node-vm/tests/run.sh

  starter-hub-tests:
    name: starter-hub script tests
    needs: changes
    # Runs only when scripts/starter-hub/** or this workflow changed, and
    # always on push to main. Fails open: if the changes job did not succeed,
    # the tests run anyway.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.starter_hub == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Never contacts GCP or the network: stub gcloud, curl and sleep in
      # scripts/starter-hub/tests/lib, and stub systemctl, certbot, caddy,
      # runuser, id and openssl s_client in tests/lib-tls, shadow any real
      # ones on PATH. Needs
      # only bash and openssl, which ubuntu-latest ships.
      - name: Run scripts/starter-hub/tests/run.sh
        run: ./scripts/starter-hub/tests/run.sh

  # Mobile-emulation Playwright suite for the web chat (web/e2e/chat-mobile).
  # Fully mocked with page.route: no hub, no credentials, no secrets. Runs
  # only when web/** or this workflow changed, and always on push to main.
  # Fails open: if the changes job did not succeed, the suite runs anyway.
  #
  # Sharded in two with Playwright's --shard: the config pins workers: 1
  # (the CDP touch-gesture tests are timing sensitive), and the full
  # four-project pass takes ~20 minutes in one job. --shard=N/2 splits it
  # ~9.5m / ~11m of test time today, and new tests and projects join a
  # shard automatically. Two shards cost less runner time than one job per
  # project (each job pays ~2m of setup; desktop-1440 alone is ~1m of tests).
  chat-mobile-e2e:
    name: Chat mobile E2E (shard ${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    # Above the config's CI globalTimeout (20m) plus setup (~2-4m), so a
    # slow or hung run stops inside Playwright, writes its report, and the
    # upload step still runs (a job-level timeout cancels the job and skips
    # it).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24' # Node.js 24 (LTS)
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      # Playwright's own Chromium (CHROMIUM_EXECUTABLE stays unset in CI).
      # --only-shell: the suite runs headless, which uses only the headless
      # shell, so the full Chromium download is skipped. WebKit is
      # deliberately not installed (the optional WebKit project is off).
      - name: Install Playwright Chromium
        working-directory: ./web
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run chat-mobile suite
        working-directory: ./web
        env:
          SHARD: ${{ matrix.shard }}
        run: npm run test:e2e:chat-mobile -- --shard="${SHARD}/2"

      # Whenever the suite ran, not only on failure: with one CI retry, a
      # flaky test passes the shard, and its retry trace is only in here.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-mobile-e2e-shard-${{ matrix.shard }}
          path: |
            web/playwright-report/chat-mobile/
            web/test-results/chat-mobile/
          retention-days: 7
          if-no-files-found: ignore

  # The single, stable check name to mark as required. A matrix job that is
  # skipped reports one check under its unexpanded name, so the per-shard
  # names above are not usable as required checks. This job is never
  # skipped (always()), so it always reports a real conclusion: success when
  # path detection succeeded and web/ is unchanged; otherwise success only
  # if every shard succeeded, so a failed, timed-out, cancelled or skipped
  # shard fails the check. A skipped required check would read as passing.
  chat-mobile-e2e-result:
    name: Chat mobile E2E
    needs: [changes, chat-mobile-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check shard results
        env:
          CHANGES: ${{ needs.changes.result }}
          WEB: ${{ needs.changes.outputs.web }}
          RESULT: ${{ needs.chat-mobile-e2e.result }}
        run: |
          echo "changes: ${CHANGES}, web: ${WEB}, chat-mobile-e2e shards: ${RESULT}"
          if [ "$CHANGES" = "success" ] && [ "$WEB" != "true" ]; then
            echo "web/ unchanged: nothing to check."
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "::error title=Chat mobile E2E failed::One or more chat-mobile shards did not succeed (result: ${RESULT})."
            exit 1
          fi

  # Browser counter budgets for the project agent page (grid, list and
  # graph): DOM element count and long-task count at 100 seeded agents,
  # against mocked API responses recorded from the hub's own fixture
  # (web/e2e-perf/budgets; baselines and margins are in budgets.pw.ts). The
  # hub-side counter budgets (store calls, decisions, response bytes,
  # TestPerfBudget_AgentEndpoints) run in the pkg/hub shard jobs, which the
  # pkg/hub SQLite Tests check aggregates. Chromium only, one
  # worker, no Go build. Path-gated on web/ like the chat-mobile suite.
  perf-budgets-web:
    name: Web perf budgets
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    # Above the config's CI globalTimeout (15m) plus setup (npm ci and the
    # Chromium install), so a slow run stops inside Playwright with a report.
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24' # Node.js 24 (LTS)
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./web
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run web perf budgets
        working-directory: ./web
        run: npm run test:e2e:perf-budgets
