name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# One run per PR: a new push to the same PR cancels the superseded run
# (ptone/scion#2845). Runs on main are never cancelled. Outside pull_request
# the group is the unique run_id, not github.ref: GitHub keeps at most one
# *pending* run per group and cancels an older pending run even when
# cancel-in-progress is false, so a shared refs/heads/main group would drop
# queued main runs whenever pushes land in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Path detection for jobs that only matter when specific files change
  # (ptone/scion#2845). Gating uses this job plus a job-level `if:`, never
  # `on.paths`: a skipped job still reports its check, whereas a workflow
  # filtered out by on.paths reports nothing at all.
  #
  # On pull_request it diffs the PR head against the PR base (three-dot,
  # i.e. against the merge base). On any other event (push to main) every
  # output is 'true': post-merge runs always exercise everything, and a
  # push's `before` SHA is not always usable (new branch, force push).
  # If the diff itself fails, the outputs fall back to 'true' (fail open).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      single_node_vm: ${{ steps.diff.outputs.single_node_vm }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          # Blobless partial clone: the diff below needs only commits and
          # trees (--no-renames means no blob content comparison).
          filter: blob:none

      - name: Diff against PR base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is ${EVENT_NAME}, not pull_request: running every gated job."
            echo "single_node_vm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: list both sides of a rename, so a file moved out of
          # a gated directory still counts as a change to that directory.
          if ! changed=$(git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}"); then
            echo "::warning title=Path detection failed::git diff ${BASE_SHA}...${HEAD_SHA} failed; running every gated job."
            echo "single_node_vm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$changed"
          # Here-string, not `echo | grep -q`: under pipefail, grep -q exiting
          # on the first match SIGPIPEs echo on large PRs and fails the test.
          if grep -qE '^(scripts/single-node-vm/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "single_node_vm=true" >> "$GITHUB_OUTPUT"
          else
            echo "single_node_vm=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24' # Node.js 24 (LTS)
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web UI
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Verify Web Build
        run: ls -la web/dist

      - name: Verify Web Types
        working-directory: ./web
        run: npm run typecheck

      # The eslint override and lint:e2e-perf script cover the e2e-perf
      # harness sources; wired into CI so they actually run on every change.
      - name: Lint browser perf benchmark (e2e-perf)
        working-directory: ./web
        run: npm run lint:e2e-perf

      # lib.mjs's pure functions (network-outcome classification, stats,
      # burst-target selection) have node:test coverage; wire it in so it
      # actually runs on every change.
      - name: Test browser perf benchmark (e2e-perf)
        working-directory: ./web
        run: npm run test:e2e-perf

      - name: Run Web Tests
        working-directory: ./web
        run: npm test

      - name: Format Check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Go formatting issues found. Run 'gofmt -w .' or 'make fmt' to fix."
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet Code
        run: make lint

      - name: Vet Integration-Tagged Code
        run: make vet-integration

      - name: Vet Integration-Tagged Code (extras)
        run: make vet-integration-extras

      - name: Install ripgrep
        run: |
          if ! command -v rg &> /dev/null; then
            sudo apt-get install -y ripgrep
          fi

      - name: Check Compatibility Literals
        run: make compat-literals

      - name: Check Annotation Prefix
        run: make check-annotation-prefix

      - name: Check Setenv Guard
        run: make check-setenv-guard

      - name: Check Authorization Guards
        run: |
          # Invoked directly rather than via `make check-authz-guards`: GNU make
          # reports its own failure code (always 2), which would collapse the
          # script's exit 1 (violations found) and exit 2 (nothing was analysed)
          # into one indistinguishable result. Those mean opposite things.
          set +e
          ./hack/check-authz-guards.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Authorization guards::Authorization-bypass guard patterns found (see ptone/scion#591). The file:line: function list is in the step log above." ;;
            *) echo "::error title=Authorization guards NOT checked::check-authz-guards could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a guard failure." ;;
          esac
          exit "$rc"

      - name: Check Conversation Upsert Guard
        run: ./hack/check-conversation-upsert-guard.sh

      - name: Check Harness Coverage in Cloud Build Configs
        run: |
          # Invoked directly rather than via a Makefile target, for the same
          # reason as Check Authorization Guards above: make would collapse
          # the script's exit 1 (a harness is out of sync, ptone/scion#2357)
          # and exit 2 (could not run, e.g. no PyYAML) into one code.
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update && sudo apt-get install -y python3-yaml; } || true
          set +e
          ./image-build/scripts/check-harness-coverage.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Harness coverage::A harnesses/<name>/Dockerfile is out of sync with one or more cloudbuild-*.yaml configs (see ptone/scion#2357). Details are in the step log above." ;;
            *) echo "::error title=Harness coverage NOT checked::check-harness-coverage.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a coverage failure." ;;
          esac
          exit "$rc"

      - name: Check Security Marker Gates
        run: |
          # Invoked directly rather than via `make check-security-marker-gates`:
          # GNU make reports its own failure code (always 2), which would collapse
          # exit 1 (guard violation) and exit 2 (nothing was analysed) into one
          # indistinguishable result. Those mean opposite things.
          set +e
          ./hack/check-security-marker-gates.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Security marker gates::Security marker gate violations found — a guarded symbol was removed or moved out of its enclosing function. See the step log above." ;;
            *) echo "::error title=Security marker gates NOT checked::check-security-marker-gates could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a guard failure." ;;
          esac
          exit "$rc"

      - name: Check Route Authorization Manifest
        run: |
          # Invoked directly rather than via `make check-route-authz-manifest`:
          # GNU make reports its own failure code (always 2), which would collapse
          # the script's exit 1 (violations) and exit 4 (nothing was analysed)
          # into one indistinguishable result. Those mean opposite things.
          set +e
          ./hack/check-route-authz-manifest.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Route authorization manifest::Routes found without declared authorization posture (see ptone/scion#598). The route list is in the step log above." ;;
            *) echo "::error title=Route authorization manifest NOT checked::check-route-authz-manifest could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a manifest failure." ;;
          esac
          exit "$rc"

      - name: Check CLI Time Zones
        run: |
          # Invoked directly rather than via `make cli-time-zones`, for the same
          # reason as Check Authorization Guards above: make would collapse the
          # script's exit 1 (violations) and exit 3/4 (nothing was analysed).
          set +e
          ./hack/check-cli-time-zones.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=CLI time zones::A time layout in CLI code has no zone token. Format CLI times with pkg/clitime (clitime.Format); details are in the step log above." ;;
            *) echo "::error title=CLI time zones NOT checked::check-cli-time-zones.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

      - name: Check Time Literals
        run: |
          # Invoked directly rather than via `make time-literals`, for the same
          # reason as Check Authorization Guards above: make would collapse the
          # script's exit 1 (violations) and exit 3/4 (nothing was analysed).
          set +e
          ./hack/check-time-literals.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Time literals::A server-side time is formatted without .UTC() or bound in the wrong form for its column. Fix the site or add a justified entry to hack/time-literals-allowlist.txt; details are in the step log above." ;;
            *) echo "::error title=Time literals NOT checked::check-time-literals.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

      - name: Run Tests
        run: make test-fast

      - name: Build Binary
        run: make build

  hub-sqlite-tests:
    name: pkg/hub SQLite Tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # `make test-fast` (the Build & Test job, above) uses -tags no_sqlite,
      # which excludes ~67% of pkg/hub's test files (ptone/scion#1118) --
      # they carry a `//go:build !no_sqlite` constraint because they need a
      # real SQLite-backed store. This job runs that excluded set, untagged,
      # so it is actually compiled and run somewhere that can fail a PR.
      # perf/bench/seed's own SQLite-backed tests carry the same constraint,
      # for the same reason (ptone/scion#2393), and are included here too --
      # see make test-hub-sqlite.
      #
      # It is scoped to pkg/hub and perf/bench/seed (not the whole module)
      # and runs as its own parallel job so it doesn't add to the
      # wall-clock time of Build & Test. Clean CI runs range from ~770s to
      # ~1480s, close to the old 25m (1500s) go test timeout
      # (ptone/scion#2732; GoogleCloudPlatform/scion#2031 hit the earlier
      # 15m limit). The 40m go test timeout / 50m job timeout give headroom
      # above that, with the job limit kept far enough above the go test
      # timeout (~3m of build and setup overhead) that a real hang still
      # produces go's goroutine dump instead of a bare job kill. The
      # longer-term fix is splitting pkg/hub into smaller suites
      # (ptone/scion#1847).
      #
      # Four tests are skipped: they have known, pre-existing failures
      # unrelated to this job (ptone/scion#1847) that already reproduce on
      # main today under `go test ./pkg/hub/...`. They are not new failures
      # caused by newly-compiled tests. Remove the -skip once #1847 is fixed.
      - name: Run pkg/hub + perf/bench/seed tests (SQLite-enabled)
        run: make test-hub-sqlite

  launch-store-postgres-tests:
    name: T1 Launch Store PostgreSQL Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # design t1-async-create-v11.md §6, "Postgres in CI": runs
      # pkg/store/integrationtest (the existing Postgres-only harness) plus
      # the entadapter tests selected by test-launch-store-postgres's -run
      # regex (see that Makefile target's comment for the current list, the
      # source of truth), which run unchanged against SQLite (the default
      # `go test` build) and Postgres (here, via -tags integration) to prove
      # dialect parity. This job owns every Postgres-specific assertion in
      # P1a: the transaction-scoped advisory lock, SKIP LOCKED,
      # lock_timeout/idle-in-transaction SET LOCAL, and the per-row
      # savepoints.
      - name: Run launch store tests (Postgres-enabled)
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make test-launch-store-postgres

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          args: '--new-from-merge-base=origin/main'

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      # Positive control -- this gate is not a no-op.
      #
      # Before it was added, scripts/hub-env-integration-test.sh:328 and
      # scripts/hub-secret-integration-test.sh:329 both read:
      #
      #     PROJECT_ID=$($SCION config get project_id 2>/dev/null || "")
      #
      # The `|| ""` runs the empty string as a command name -- SC2286, an
      # error-severity finding. (The intended form, `|| echo ""`, appears on
      # that same line in both files today.) Re-introducing that `|| ""` makes
      # this step exit 1, which is how you can confirm the job catches real
      # defects.
      #
      # -x plus --source-path=SCRIPTDIR lets shellcheck follow `source` targets
      # relative to each script's own directory, which honours the existing
      # `# shellcheck source=` directives (e.g. image-build/scripts/lib/targets.sh
      # and scripts/starter-hub/hub-config.sh) instead of reporting SC1091.
      - name: Run shellcheck
        run: |
          checked=0
          failed=0
          while IFS= read -r script; do
            checked=$((checked + 1))
            if ! shellcheck -x --source-path=SCRIPTDIR "$script"; then
              failed=$((failed + 1))
            fi
          done < <(
            {
              find . -type f -name '*.sh' \
                -not -path './.git/*' \
                -not -path './vendor/*' \
                -not -path '*/vendor/*' \
                -not -path '*/node_modules/*'
              # The stub gcloud has no extension (it stands in for a real
              # `gcloud` on PATH, which has none either), so the *.sh find
              # above never sees it.
              echo './scripts/single-node-vm/tests/lib/gcloud'
            } | sort
          )
          echo "shellcheck: $((checked - failed))/${checked} file(s) passed"
          if [ "$checked" -eq 0 ]; then
            echo "::error::no shell scripts found -- the file discovery is broken"
            exit 1
          fi
          if [ "$failed" -gt 0 ]; then
            echo "::error::shellcheck reported issues in ${failed} file(s)"
            exit 1
          fi

      - name: Check for bare MethodNotAllowed calls
        # Reporting only. This was the separate "Lint 405 Allow header
        # (reporting only)" job; it was folded in here to save a runner
        # spin-up (ptone/scion#2845). It must never fail shellcheck:
        # continue-on-error absorbs its non-zero exit, and the result is
        # reported in the step summary. !cancelled() runs it even when
        # Run shellcheck above failed, as the separate job did.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          echo "## 405 Allow Header Lint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checking for MethodNotAllowed(w) calls without allowed methods." >> $GITHUB_STEP_SUMMARY
          echo "Per RFC 9110 section 15.5.6, 405 responses MUST include an Allow header." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find bare MethodNotAllowed(w) calls (no allowed methods argument)
          # Exclude: function definition, test files (test files may legitimately test the bare call)
          VIOLATIONS=$(grep -rn 'MethodNotAllowed(w)$' --include='*.go' pkg/hub/ \
            | grep -v '_test.go' \
            | grep -v 'func MethodNotAllowed' \
            || true)

          COUNT=$(echo "$VIOLATIONS" | grep -c '.' 2>/dev/null || echo 0)

          if [ "$COUNT" -gt 0 ]; then
            echo "**Found ${COUNT} bare MethodNotAllowed(w) calls missing Allow header.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Each of these should specify allowed methods:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "MethodNotAllowed(w, http.MethodGet)           // single method" >> $GITHUB_STEP_SUMMARY
            echo "MethodNotAllowed(w, http.MethodGet, http.MethodPost)  // multiple" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>Violations (click to expand)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$VIOLATIONS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "All MethodNotAllowed calls include allowed methods. RFC 9110 compliant." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_This is a reporting-only check. It does not block CI._" >> $GITHUB_STEP_SUMMARY
          echo "_See PR #1413 for context on the Allow header requirement._" >> $GITHUB_STEP_SUMMARY

          # Exit with count for visibility (continue-on-error means it won't block)
          if [ "$COUNT" -gt 0 ]; then
            echo ""
            echo "Found ${COUNT} bare MethodNotAllowed(w) calls without Allow header."
            echo "See step summary for details."
            exit 1
          fi

  single-node-vm-deploy-tests:
    name: single-node-vm deploy.sh test harness
    needs: changes
    # Runs only when scripts/single-node-vm/** or this workflow changed, and
    # always on push to main. Fails open: if the changes job did not succeed,
    # the harness runs anyway.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.single_node_vm == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Never contacts GCP: a stub `gcloud` shadows any real one on PATH.
      # ubuntu-latest already ships bash >= 4 and python3; see
      # scripts/single-node-vm/tests/README.md for what this covers.
      - name: Run scripts/single-node-vm/tests/run.sh
        run: ./scripts/single-node-vm/tests/run.sh
