name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# One run per PR: a new push to the same PR cancels the superseded run
# (ptone/scion#2845). Runs on main are never cancelled. Outside pull_request
# the group is the unique run_id, not github.ref: GitHub keeps at most one
# *pending* run per group and cancels an older pending run even when
# cancel-in-progress is false, so a shared refs/heads/main group would drop
# queued main runs whenever pushes land in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Path detection for jobs that only matter when specific files change
  # (ptone/scion#2845). Gating uses this job plus a job-level `if:`, never
  # `on.paths`: a skipped job still reports its check, whereas a workflow
  # filtered out by on.paths reports nothing at all.
  #
  # On pull_request it diffs the PR head against the PR base (three-dot,
  # i.e. against the merge base). On any other event (push to main) every
  # output is 'true': post-merge runs always exercise everything, and a
  # push's `before` SHA is not always usable (new branch, force push).
  # If the diff itself fails, the outputs fall back to 'true' (fail open).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      single_node_vm: ${{ steps.diff.outputs.single_node_vm }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          # Blobless partial clone: the diff below needs only commits and
          # trees (--no-renames means no blob content comparison).
          filter: blob:none

      - name: Diff against PR base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is ${EVENT_NAME}, not pull_request: running every gated job."
            echo "single_node_vm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: list both sides of a rename, so a file moved out of
          # a gated directory still counts as a change to that directory.
          if ! changed=$(git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}"); then
            echo "::warning title=Path detection failed::git diff ${BASE_SHA}...${HEAD_SHA} failed; running every gated job."
            echo "single_node_vm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$changed"
          # Here-string, not `echo | grep -q`: under pipefail, grep -q exiting
          # on the first match SIGPIPEs echo on large PRs and fails the test.
          if grep -qE '^(scripts/single-node-vm/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "single_node_vm=true" >> "$GITHUB_OUTPUT"
          else
            echo "single_node_vm=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Sized from data (ptone/scion#3183): over the 267 successful upstream
    # runs of this job on 2026-10-04/05, the job took p50 13.4m / p95 14.4m /
    # max 14.5m (Run Tests: p50 4.7m / max 5.1m). 30m is ~2x the slowest
    # success; worst case under the Run Tests watchdog below is ~26m (9.8m
    # max pre-test steps + 15m deadline + 1m grace + Build Binary). Without a
    # limit the job inherits GitHub's 360m default: two stalled Run Tests on
    # 2026-10-05 ran 41m and 83m (78m silent) until cancelled by hand.
    # Budget: the watchdog's diagnostics end ~16.1m into Run Tests, so this
    # timeout cuts them off if the steps before Run Tests take more than
    # ~13.9m (max 9.8m today). Keep timeout > pre-test max + ~17m: raise it
    # if steps are added before Run Tests or they grow.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24' # Node.js 24 (LTS)
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web UI
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Verify Web Build
        run: ls -la web/dist

      - name: Verify Web Types
        working-directory: ./web
        run: npm run typecheck

      # The eslint override and lint:e2e-perf script cover the e2e-perf
      # harness sources; wired into CI so they actually run on every change.
      - name: Lint browser perf benchmark (e2e-perf)
        working-directory: ./web
        run: npm run lint:e2e-perf

      # lib.mjs's pure functions (network-outcome classification, stats,
      # burst-target selection) have node:test coverage; wire it in so it
      # actually runs on every change.
      - name: Test browser perf benchmark (e2e-perf)
        working-directory: ./web
        run: npm run test:e2e-perf

      - name: Run Web Tests
        working-directory: ./web
        run: npm test

      - name: Format Check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Go formatting issues found. Run 'gofmt -w .' or 'make fmt' to fix."
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet Code
        run: make lint

      - name: Vet Integration-Tagged Code
        run: make vet-integration

      - name: Vet Integration-Tagged Code (extras)
        run: make vet-integration-extras

      - name: Install ripgrep
        run: |
          if ! command -v rg &> /dev/null; then
            sudo apt-get install -y ripgrep
          fi

      - name: Check Compatibility Literals
        run: make compat-literals

      - name: Check Annotation Prefix
        run: make check-annotation-prefix

      - name: Check Setenv Guard
        run: make check-setenv-guard

      - name: Check Authorization Guards
        run: |
          # Invoked directly rather than via `make check-authz-guards`: GNU make
          # reports its own failure code (always 2), which would collapse the
          # script's exit 1 (violations found) and exit 3/4 (nothing was
          # analysed; see hack/LINT-CONVENTIONS.md) into one indistinguishable
          # result. Those mean opposite things.
          set +e
          ./hack/check-authz-guards.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Authorization guards::Authorization-bypass guard patterns found (see ptone/scion#591). The file:line: function list is in the step log above." ;;
            *) echo "::error title=Authorization guards NOT checked::check-authz-guards could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a guard failure." ;;
          esac
          exit "$rc"

      - name: Check Conversation Upsert Guard
        run: ./hack/check-conversation-upsert-guard.sh

      - name: Check Harness Coverage in Cloud Build Configs
        run: |
          # Invoked directly rather than via a Makefile target, for the same
          # reason as Check Authorization Guards above: make would collapse
          # the script's exit 1 (a harness is out of sync, ptone/scion#2357)
          # and exit 2 (could not run, e.g. no PyYAML) into one code.
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update && sudo apt-get install -y python3-yaml; } || true
          set +e
          ./image-build/scripts/check-harness-coverage.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Harness coverage::A harnesses/<name>/Dockerfile is out of sync with one or more cloudbuild-*.yaml configs (see ptone/scion#2357). Details are in the step log above." ;;
            *) echo "::error title=Harness coverage NOT checked::check-harness-coverage.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a coverage failure." ;;
          esac
          exit "$rc"

      - name: Check Security Marker Gates
        run: |
          # Invoked directly rather than via `make check-security-marker-gates`:
          # GNU make reports its own failure code (always 2), which would collapse
          # exit 1 (guard violation) and exit 2 (nothing was analysed) into one
          # indistinguishable result. Those mean opposite things.
          set +e
          ./hack/check-security-marker-gates.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Security marker gates::Security marker gate violations found — a guarded symbol was removed or moved out of its enclosing function. See the step log above." ;;
            *) echo "::error title=Security marker gates NOT checked::check-security-marker-gates could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a guard failure." ;;
          esac
          exit "$rc"

      - name: Check Route Authorization Manifest
        run: |
          # Invoked directly rather than via `make check-route-authz-manifest`:
          # GNU make reports its own failure code (always 2), which would collapse
          # the script's exit 1 (violations) and exit 4 (nothing was analysed)
          # into one indistinguishable result. Those mean opposite things.
          set +e
          ./hack/check-route-authz-manifest.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Route authorization manifest::Routes found without declared authorization posture (see ptone/scion#598). The route list is in the step log above." ;;
            *) echo "::error title=Route authorization manifest NOT checked::check-route-authz-manifest could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure and is NOT a statement about the codebase. Do not read it as a manifest failure." ;;
          esac
          exit "$rc"

      - name: Check CLI Time Zones
        run: |
          # Invoked directly rather than via `make cli-time-zones`, for the same
          # reason as Check Authorization Guards above: make would collapse the
          # script's exit 1 (violations) and exit 3/4 (nothing was analysed).
          set +e
          ./hack/check-cli-time-zones.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=CLI time zones::A time layout in CLI code has no zone token. Format CLI times with pkg/clitime (clitime.Format); details are in the step log above." ;;
            *) echo "::error title=CLI time zones NOT checked::check-cli-time-zones.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

      - name: Check Time Literals
        run: |
          # Invoked directly rather than via `make time-literals`, for the same
          # reason as Check Authorization Guards above: make would collapse the
          # script's exit 1 (violations) and exit 3/4 (nothing was analysed).
          set +e
          ./hack/check-time-literals.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Time literals::A server-side time is formatted without .UTC() or bound in the wrong form for its column. Fix the site or add a justified entry to hack/time-literals-allowlist.txt; details are in the step log above." ;;
            *) echo "::error title=Time literals NOT checked::check-time-literals.sh could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

      # Run Tests with a diagnostic hang watchdog (ptone/scion#3183). It is
      # diagnostic only: no retries, and on a normal pass or fail the step
      # exits with make test-fast's own exit code. If the tests are still
      # running at the deadline (15m, ~3x the slowest successful Run Tests
      # of 5.1m), it logs the test process tree, the full process tree and
      # every pipe fd with its owning PID, sends SIGQUIT to the Go test
      # binaries (goroutine dumps), then to the whole tree, SIGKILLs what is
      # left, and fails with exit 124.
      # The step timeout is only a backstop in case the watchdog itself fails.
      - name: Run Tests
        timeout-minutes: 18
        run: |
          deadline_secs=900   # 15m
          grace_secs=30       # per escalation stage (QUIT binaries, QUIT tree)
          test_cmd=(make test-fast)

          # bash starts background jobs with SIGINT/SIGQUIT ignored, and that
          # survives exec. Go test binaries get goroutine dumps on SIGQUIT
          # regardless (the Go runtime reinstalls its SIGQUIT handler), but
          # make/go keep an ignored SIGINT, so cancellation (INT) would not
          # reach them, and non-Go children would ignore the stage-2 QUIT.
          # env --default-signal (GNU coreutils >= 8.31) restores the defaults
          # a foreground make had. Probe for it so that a coreutils without
          # the flag (e.g. an older uutils) degrades instead of failing.
          sigreset=(env "--default-signal=INT,QUIT")
          if ! "${sigreset[@]}" true >/dev/null 2>&1; then
            echo "hangwatch: note: env --default-signal is unavailable; running make test-fast without it (cancel will forward TERM as well as INT)"
            sigreset=()
          fi

          # PIDs (other than this shell) that hold the write end of this
          # step's output pipe on their stdout or stderr. This catches
          # orphans that left the test session (setsid, daemonised) and would
          # keep the step's output open after make exits. Only write ends
          # count (fdinfo access mode O_WRONLY or O_RDWR), so a process that
          # reads the pipe on fd 1 or 2 is never matched.
          step_out=$(readlink "/proc/$$/fd/1" 2>/dev/null || true)
          step_err=$(readlink "/proc/$$/fd/2" 2>/dev/null || true)
          # No pipeline inside: its own subshells would hold stderr too.
          pipe_holders() {
            local fd pid target key val flags self=$BASHPID
            for fd in /proc/[0-9]*/fd/1 /proc/[0-9]*/fd/2; do
              pid=${fd#/proc/}; pid=${pid%%/*}
              if [ "$pid" = "$$" ] || [ "$pid" = "$self" ]; then continue; fi
              target=$(readlink "$fd" 2>/dev/null) || continue
              case "$target" in pipe:*) ;; *) continue ;; esac
              if [ "$target" != "$step_out" ] && [ "$target" != "$step_err" ]; then continue; fi
              flags=
              while read -r key val; do
                if [ "$key" = "flags:" ]; then flags=$val; break; fi
              done 2>/dev/null <"/proc/$pid/fdinfo/${fd##*/}" || true
              case "$flags" in ''|*[!0-7]*) continue ;; esac
              if [ $(( 8#$flags & 3 )) -ne 0 ]; then echo "$pid"; fi
            done
          }

          # Kill processes outside the test session that still hold this
          # step's output pipe; they would keep the step open after it exits.
          # $1 completes the warning. Run on every exit path.
          kill_escaped() {
            local leftovers holders escaped="" p
            leftovers=$(pgrep -s "$test_pid" 2>/dev/null || true)
            holders=$(pipe_holders || true)
            for p in $holders; do
              case " $escaped " in *" $p "*) continue ;; esac
              grep -qx "$p" <<<"$leftovers" || escaped+="$p "
            done
            if [ -n "$escaped" ]; then
              echo "::warning title=Run Tests left orphans holding the step output::Processes outside the test session still held this step's stdout/stderr $1: $escaped"
              # shellcheck disable=SC2086 # word-splitting the PID list is intended
              ps -o pid,ppid,pgid,sid,etime,args -p "$(echo $escaped | tr ' ' ',')" || true
              # shellcheck disable=SC2086
              kill -KILL $escaped 2>/dev/null || true
            fi
          }

          # Own session, so the whole test tree can be signalled as one unit.
          # A background child of a non-interactive shell is not a process-
          # group leader, so setsid execs in place: the PID is also the SID.
          # As a background job its stdin is /dev/null (bash does this without
          # job control); before the watchdog make inherited the runner's
          # stdin. No test reads stdin, so this is deliberate and harmless.
          setsid "${sigreset[@]}" "${test_cmd[@]}" &
          test_pid=$!
          # The deadline timer must never hold the step's output pipe open,
          # which is the very failure it exists to diagnose, so it gets no
          # stdout/stderr. It is killed as soon as the tests exit.
          sleep "$deadline_secs" >/dev/null 2>&1 &
          timer_pid=$!

          # Signal everything in the test session (pgrep/pkill -s), matching
          # how leftovers are found below.
          forward() { pkill -"$1" -s "$test_pid" 2>/dev/null || true; }
          trap 'forward TERM; kill "$timer_pid" 2>/dev/null || true; kill_escaped "when the step was cancelled (SIGTERM), and were killed"; exit 143' TERM
          # Without env --default-signal, make and go ignore INT: send TERM too.
          trap 'forward INT; [ "${#sigreset[@]}" -gt 0 ] || forward TERM; kill "$timer_pid" 2>/dev/null || true; kill_escaped "when the step was cancelled (SIGINT), and were killed"; exit 130' INT
          trap 'kill "$timer_pid" 2>/dev/null || true' EXIT

          # The tests have exited with rc. Anything still in their session, or
          # anything still holding this step's output pipe, is an orphan;
          # report it, kill it, and exit with rc unchanged.
          finish() {
            local rc=$1 leftovers
            kill "$timer_pid" 2>/dev/null || true
            wait "$timer_pid" 2>/dev/null || true
            leftovers=$(pgrep -s "$test_pid" || true)
            if [ -n "$leftovers" ]; then
              echo "::warning title=Run Tests left orphans::Processes left behind by make test-fast were killed after it exited (exit code $rc is unchanged): $(echo "$leftovers" | tr '\n' ' ')"
              # shellcheck disable=SC2086 # word-splitting the PID list is intended
              ps -o pid,ppid,pgid,sid,etime,args -p "$(echo $leftovers | tr ' ' ',')" || true
              forward KILL
            fi
            kill_escaped "after make test-fast exited, and were killed (exit code $rc is unchanged)"
            exit "$rc"
          }

          # make exited on its own after the deadline, before the watchdog
          # signalled it: not a hang, so its exit code stands.
          finished_late() {
            local trc
            set +e; wait "$test_pid" 2>/dev/null; trc=$?; set -e
            echo "::warning title=Run Tests finished after the deadline::make test-fast ran past ${deadline_secs}s but exited on its own (exit $trc) before the watchdog signalled it; diagnostics are in the step log above (ptone/scion#3183)."
            finish "$trc"
          }

          # Send signal $1 to the test session (extra pkill args follow). A
          # timeout is only recorded if make itself was still alive, so
          # signalling orphans after make exited never turns its exit code
          # into 124.
          signalled=0
          signal_tree() {
            local sig=$1 alive=0; shift
            if kill -0 "$test_pid" 2>/dev/null; then alive=1; fi
            if pkill -"$sig" -s "$test_pid" "$@" && [ "$alive" -eq 1 ]; then signalled=1; fi
          }

          set +e
          wait -n -p done_pid "$test_pid" "$timer_pid"
          rc=$?
          set -e

          if [ "$done_pid" = "$test_pid" ]; then
            finish "$rc"
          fi
          # The timer fired. If make exited at the same instant, it was not
          # a hang: report its own exit code.
          if ! kill -0 "$test_pid" 2>/dev/null; then
            set +e; wait "$test_pid"; rc=$?; set -e
            echo "hangwatch: make test-fast exited at the deadline on its own (exit $rc); not treated as a timeout"
            finish "$rc"
          fi

          echo "===== hangwatch: make test-fast still running after ${deadline_secs}s; collecting diagnostics ====="
          echo "----- hangwatch: test process tree (session $test_pid) -----"
          ps -s "$test_pid" --forest -o pid,ppid,pgid,sid,etime,stat,args || true
          echo "----- hangwatch: full process tree (ps -ef --forest) -----"
          ps -ef --forest || true
          echo "----- hangwatch: pipe fds, grouped by pipe (pipe pid fd comm); this step's stdout is $step_out, stderr is $step_err -----"
          pipes=$(
            self=$BASHPID
            for fd in /proc/[0-9]*/fd/*; do
              pid=${fd#/proc/}; pid=${pid%%/*}
              [ "$pid" = "$self" ] && continue
              target=$(readlink "$fd" 2>/dev/null) || continue
              case "$target" in pipe:*) ;; *) continue ;; esac
              printf '%s pid=%s fd=%s %s\n' "$target" "$pid" "${fd##*/}" "$(cat "/proc/$pid/comm" 2>/dev/null)"
            done
          ) || true
          printf '%s\n' "$pipes" | sort -V || true
          echo "----- hangwatch: SIGQUIT to Go test binaries (goroutine dumps follow) -----"
          pgrep -a -s "$test_pid" -f '\.test( |$)' || echo "(no Go test binaries running)"
          signal_tree QUIT -f '\.test( |$)'
          for _ in $(seq "$grace_secs"); do kill -0 "$test_pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$test_pid" 2>/dev/null; then
            echo "----- hangwatch: SIGQUIT to the whole test process tree -----"
            signal_tree QUIT
            for _ in $(seq "$grace_secs"); do pgrep -s "$test_pid" >/dev/null || break; sleep 1; done
          fi
          # make exited on its own during the grace period without being
          # signalled: report its code, and finish() kills any orphans.
          if [ "$signalled" -eq 0 ] && ! kill -0 "$test_pid" 2>/dev/null; then
            finished_late
          fi
          if pgrep -s "$test_pid" >/dev/null; then
            echo "----- hangwatch: SIGKILL to what is left -----"
            pgrep -a -s "$test_pid" || true
            signal_tree KILL
          fi
          if [ "$signalled" -eq 0 ]; then
            finished_late
          fi
          set +e; wait "$test_pid" 2>/dev/null; set -e
          kill_escaped "after the watchdog killed make test-fast, and were killed"
          echo "::error title=Run Tests timed out::make test-fast was still running after ${deadline_secs}s (the deadline is ~3x the slowest successful Run Tests when it was sized) and was killed by the hang watchdog. Process tree, pipe holders and goroutine dumps are in the step log above. Not retried (ptone/scion#3183)."
          exit 124

      - name: Build Binary
        run: make build

  hub-sqlite-tests:
    name: pkg/hub SQLite Tests
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # `make test-fast` (the Build & Test job, above) uses -tags no_sqlite,
      # which excludes ~67% of pkg/hub's test files (ptone/scion#1118) --
      # they carry a `//go:build !no_sqlite` constraint because they need a
      # real SQLite-backed store. This job runs that excluded set, untagged,
      # so it is actually compiled and run somewhere that can fail a PR.
      # perf/bench/seed's own SQLite-backed tests carry the same constraint,
      # for the same reason (ptone/scion#2393), and are included here too,
      # as are pkg/store/entadapter's (ptone/scion#2851) -- see
      # make test-hub-sqlite. pkg/conduit's relay/router tests run against
      # the SQLite-backed conduit registry store and are included too.
      #
      # It is scoped to pkg/hub, perf/bench/seed, pkg/conduit and
      # pkg/store/entadapter (not the whole module) and runs as its own
      # parallel job so it doesn't add to the wall-clock time of Build &
      # Test. The pkg/hub test binary alone took ~2360-2390s on green main
      # runs in October 2026 and had grown by roughly 200s a day over the
      # previous three days, so it reached the old 40m (2400s) go test
      # timeout and main went intermittently red with "test timed out after
      # 40m0s" in unrelated tests (ptone/scion#2732 raised the limit from 25m
      # to 40m; GoogleCloudPlatform/scion#2031 hit the 15m limit before
      # that). The 60m go test timeout gives ~50% headroom over that. The
      # 70m job timeout stays far enough above it (the step runs ~4-5m
      # longer than the pkg/hub binary, mostly compile and link, and setup
      # plus the fixture coverage step add under a minute) that a real hang
      # still produces go's goroutine dump instead of a bare job kill. The longer-term fix is splitting pkg/hub into
      # smaller suites (ptone/scion#1847).
      #
      # Four tests are skipped: they have known, pre-existing failures
      # unrelated to this job (ptone/scion#1847) that already reproduce on
      # main today under `go test ./pkg/hub/...`. They are not new failures
      # caused by newly-compiled tests. Remove the -skip once #1847 is fixed.
      - name: Run SQLite-enabled tests (make test-hub-sqlite)
        run: make test-hub-sqlite

      # internal/fixturegen's TestFixtureCoverage carries `//go:build
      # !no_sqlite`, so Build & Test (make test-fast, -tags no_sqlite) never
      # compiles it; before this step it ran only in the non-blocking Full
      # Test Suite, and went red on main twice when a schema change skipped
      # the fixture (ptone/scion#625, ptone/scion#1931). This job already
      # builds the SQLite driver, so the gate costs a few seconds. Kept out
      # of make test-hub-sqlite so that target's package list stays as is.
      - name: Run fixture coverage gate (SQLite)
        if: ${{ !cancelled() }}
        run: make test-fixture-coverage

  launch-store-postgres-tests:
    name: T1 Launch Store PostgreSQL Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # design t1-async-create-v11.md §6, "Postgres in CI": runs
      # pkg/store/integrationtest (the existing Postgres-only harness) plus
      # the full pkg/store/entadapter suite (ptone/scion#2207; see that
      # Makefile target's comment), which runs unchanged against SQLite (the
      # default `go test` build) and Postgres (here, via -tags integration)
      # to prove dialect parity. This job owns every Postgres-specific assertion in
      # P1a: the transaction-scoped advisory lock, SKIP LOCKED,
      # lock_timeout/idle-in-transaction SET LOCAL, and the per-row
      # savepoints. The job also runs the timestamp contract test (last step).
      - name: Run launch store tests (Postgres-enabled)
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make test-launch-store-postgres

      # The pkg/hub web chat store has its own Postgres SQL (it is not an
      # Ent store), so its Postgres tests read SCION_TEST_POSTGRES_DSN rather
      # than the enttest URL. This step points them at the same service;
      # they touch only webchat_* tables. See the Makefile target's comment.
      - name: Run web chat store tests (Postgres)
        if: ${{ !cancelled() }}
        env:
          SCION_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make test-webchat-postgres

      # The pkg/artifacts store is likewise not an Ent store (it creates its
      # own artifact_* tables at Init), so it has its own Postgres SQL. Its
      # store tests run once per dialect; this step adds the Postgres pass.
      - name: Run artifact store tests (SQLite and Postgres)
        if: ${{ !cancelled() }}
        env:
          SCION_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make test-artifacts-postgres

      # tz-refactor design §2.2 / AC1: the real-binary timestamp contract
      # test. It runs the SQLite and Postgres cases (about 2-3 minutes,
      # including the binary build) and runs
      # even when the launch store step fails, so its result is never hidden.
      - name: Run timestamp contract test (SQLite and Postgres)
        if: ${{ !cancelled() }}
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: make test-tz-contract

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          args: '--new-from-merge-base=origin/main'

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      # Positive control -- this gate is not a no-op.
      #
      # Before it was added, scripts/hub-env-integration-test.sh:328 and
      # scripts/hub-secret-integration-test.sh:329 both read:
      #
      #     PROJECT_ID=$($SCION config get project_id 2>/dev/null || "")
      #
      # The `|| ""` runs the empty string as a command name -- SC2286, an
      # error-severity finding. (The intended form, `|| echo ""`, appears on
      # that same line in both files today.) Re-introducing that `|| ""` makes
      # this step exit 1, which is how you can confirm the job catches real
      # defects.
      #
      # -x plus --source-path=SCRIPTDIR lets shellcheck follow `source` targets
      # relative to each script's own directory, which honours the existing
      # `# shellcheck source=` directives (e.g. image-build/scripts/lib/targets.sh
      # and scripts/starter-hub/hub-config.sh) instead of reporting SC1091.
      - name: Run shellcheck
        run: |
          checked=0
          failed=0
          while IFS= read -r script; do
            checked=$((checked + 1))
            if ! shellcheck -x --source-path=SCRIPTDIR "$script"; then
              failed=$((failed + 1))
            fi
          done < <(
            {
              find . -type f -name '*.sh' \
                -not -path './.git/*' \
                -not -path './vendor/*' \
                -not -path '*/vendor/*' \
                -not -path '*/node_modules/*'
              # The stub gcloud has no extension (it stands in for a real
              # `gcloud` on PATH, which has none either), so the *.sh find
              # above never sees it.
              echo './scripts/single-node-vm/tests/lib/gcloud'
            } | sort
          )
          echo "shellcheck: $((checked - failed))/${checked} file(s) passed"
          if [ "$checked" -eq 0 ]; then
            echo "::error::no shell scripts found -- the file discovery is broken"
            exit 1
          fi
          if [ "$failed" -gt 0 ]; then
            echo "::error::shellcheck reported issues in ${failed} file(s)"
            exit 1
          fi

      - name: Check for bare MethodNotAllowed calls
        # Blocking (ptone/scion#2421). Formerly the reporting-only "Lint 405
        # Allow header (reporting only)" job, folded in here to save a runner
        # spin-up (ptone/scion#2845); the logic now lives in
        # hack/check-method-not-allowed.sh and covers pkg/hub and
        # pkg/runtimebroker. It is a step, not a separate check, so it adds no
        # check name. !cancelled() runs it even when Run shellcheck above
        # failed, so both results show on one run.
        #
        # Invoked directly rather than via `make check-method-not-allowed`,
        # for the same reason as Check Authorization Guards in Build & Test:
        # make would collapse exit 1 (violations) and exit 3/4 (nothing was
        # analysed) into one code.
        if: ${{ !cancelled() }}
        run: |
          # Prove the matcher works on this runner's grep before trusting a
          # clean scan. The `|| st=$?` guard keeps `bash -e` from aborting, so
          # a self-test failure fails the step via the explicit exit 1 below,
          # before the real scan runs. Exit 3 means a required tool (grep) is
          # missing and 126/127 mean the script itself could not be executed;
          # neither means the matcher is broken.
          st=0
          ./hack/check-method-not-allowed.sh --self-test || st=$?
          if [ "$st" -ne 0 ]; then
            if [ "$st" -eq 3 ]; then
              echo "::error title=405 Allow header NOT checked::check-method-not-allowed --self-test could not run (exit 3: required tool missing) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase."
            elif [ "$st" -eq 126 ] || [ "$st" -eq 127 ]; then
              echo "::error title=405 Allow header NOT checked::hack/check-method-not-allowed.sh could not be executed (exit $st: not found or not executable) — NOTHING WAS ANALYSED. This is a checkout or permissions failure, not a statement about the codebase."
            else
              echo "::error title=405 Allow header NOT checked::check-method-not-allowed --self-test failed (exit $st) — the matcher is broken on this runner, so NOTHING WAS ANALYSED."
            fi
            exit 1
          fi
          set +e
          ./hack/check-method-not-allowed.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=405 Allow header::Bare MethodNotAllowed(w) calls found: a 405 must carry an Allow header (RFC 9110 15.5.6). Pass the accepted methods, e.g. MethodNotAllowed(w, http.MethodGet). The file:line list is in the step log above." ;;
            *) echo "::error title=405 Allow header NOT checked::check-method-not-allowed could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

  ent-generate-check:
    name: ent generated code drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # Regenerates pkg/ent from pkg/ent/schema and fails on any diff or new
      # untracked file under pkg/ent, or any go.mod/go.sum change
      # (ptone/scion#2746). Nothing else checks that a schema edit was
      # committed together with its generated code. Its own job, not a Build &
      # Test step: generation downloads ent's codegen dependencies.
      - name: Check ent generated code is up to date
        #
        # ent-check exits 3 when go generate itself failed (schema compile or
        # module download error) and 1 on drift. make collapses both to exit
        # 2, so the step tells them apart by the target's "(not drift)" line.
        run: |
          set -o pipefail
          if ! make ent-check 2>&1 | tee "$RUNNER_TEMP/ent-check.log"; then
            if grep -qF 'go generate ./pkg/ent failed (not drift)' "$RUNNER_TEMP/ent-check.log"; then
              echo "::error title=ent generation failed (not drift)::go generate ./pkg/ent failed, so drift was NOT checked. The generator error (schema compile or module download) is in the step log above."
            else
              echo "::error title=ent generated code drift::pkg/ent does not match pkg/ent/schema. Run 'go generate ./pkg/ent' and commit the result."
            fi
            exit 1
          fi

  single-node-vm-deploy-tests:
    name: single-node-vm deploy.sh test harness
    needs: changes
    # Runs only when scripts/single-node-vm/** or this workflow changed, and
    # always on push to main. Fails open: if the changes job did not succeed,
    # the harness runs anyway.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.single_node_vm == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Never contacts GCP: a stub `gcloud` shadows any real one on PATH.
      # ubuntu-latest already ships bash >= 4 and python3; see
      # scripts/single-node-vm/tests/README.md for what this covers.
      - name: Run scripts/single-node-vm/tests/run.sh
        run: ./scripts/single-node-vm/tests/run.sh
