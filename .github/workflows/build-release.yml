name: Build Multi-Arch Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'          # Stable: v0.3.0, v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-preview.*' # Preview: v0.3.0-preview.1
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.*'      # RC: v0.3.0-rc.1

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Arch Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux builds
          - goos: linux
            goarch: amd64
            output: scion-linux-amd64
            build_path: ./cmd/scion
            binary_name: scion
          - goos: linux
            goarch: arm64
            output: scion-linux-arm64
            build_path: ./cmd/scion
            binary_name: scion
          # macOS builds
          - goos: darwin
            goarch: amd64
            output: scion-darwin-amd64
            build_path: ./cmd/scion
            binary_name: scion
          - goos: darwin
            goarch: arm64
            output: scion-darwin-arm64
            build_path: ./cmd/scion
            binary_name: scion
          # Chat plugin binaries (linux only — plugins run on the hub VM)
          - goos: linux
            goarch: amd64
            output: scion-plugin-telegram-linux-amd64
            build_path: ./cmd/scion-plugin-telegram
            module_dir: extras/scion-telegram
            binary_name: scion-plugin-telegram
          - goos: linux
            goarch: arm64
            output: scion-plugin-telegram-linux-arm64
            build_path: ./cmd/scion-plugin-telegram
            module_dir: extras/scion-telegram
            binary_name: scion-plugin-telegram
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node
        if: ${{ !matrix.module_dir }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web UI
        if: ${{ !matrix.module_dir }}
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Get version info
        id: version
        run: |
          # Get version from git tag
          if git describe --tags --exact-match >/dev/null 2>&1; then
            VERSION=$(git describe --tags --exact-match)
          else
            VERSION=""
          fi
          
          COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PKG="github.com/GoogleCloudPlatform/scion/pkg/version"
          
          # Build ldflags, only including version if available
          LDFLAGS="-X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildTime=${BUILD_TIME}"
          if [ -n "$VERSION" ]; then
            LDFLAGS="${LDFLAGS} -X ${PKG}.Version=${VERSION}"
          fi
          
          echo "ldflags=${LDFLAGS}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          LDFLAGS: ${{ steps.version.outputs.ldflags }}
          OUTPUT_NAME: ${{ matrix.output }}
          MODULE_DIR: ${{ matrix.module_dir }}
          BUILD_PATH: ${{ matrix.build_path || './cmd/scion' }}
          BINARY_NAME: ${{ matrix.binary_name || 'scion' }}
        run: |
          mkdir -p dist
          if [ -n "${MODULE_DIR}" ]; then
            cd "${MODULE_DIR}"
            go build -o "${GITHUB_WORKSPACE}/dist/${BINARY_NAME}" "${BUILD_PATH}"
          else
            go build -ldflags "${LDFLAGS}" -o dist/${BINARY_NAME} ${BUILD_PATH}
          fi
          tar -czvf "${GITHUB_WORKSPACE}/${OUTPUT_NAME}.tar.gz" -C "${GITHUB_WORKSPACE}/dist" "${BINARY_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Determine release channel
        id: channel
        env:
          REF: ${{ github.ref }}
        run: |
          TAG="${REF#refs/tags/}"
          if [[ "$TAG" == *"-preview."* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "channel=preview" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-rc."* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "channel=rc" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: binaries

      - name: Prepare release assets
        run: |
          mkdir -p release
          find binaries -type f -exec mv {} release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: release/*
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          name: ${{ steps.channel.outputs.tag }}
          generate_release_notes: true

      - name: Update channel branch
        continue-on-error: true
        id: branch-update
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          # For preview and rc tags, update the "preview" branch
          # For stable tags, update the "stable" branch
          if [[ "$CHANNEL" == "stable" ]]; then
            BRANCH="stable"
          else
            BRANCH="preview"
          fi
          # Force-update the channel branch to point at this tag's commit
          git push origin "HEAD:refs/heads/${BRANCH}" --force

      - name: Warn on branch update failure
        if: steps.branch-update.outcome == 'failure'
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          if [[ "$CHANNEL" == "stable" ]]; then
            BRANCH="stable"
          else
            BRANCH="preview"
          fi
          echo "::warning::Failed to update channel branch '${BRANCH}' to ${TAG}. Manual update may be needed."
