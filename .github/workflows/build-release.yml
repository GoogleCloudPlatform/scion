name: Build Multi-Arch Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'          # Stable: v0.3.0, v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-preview.*' # Preview: v0.3.0-preview.1
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.*'      # RC: v0.3.0-rc.1

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Arch Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux builds
          - goos: linux
            goarch: amd64
            output: scion-linux-amd64
          - goos: linux
            goarch: arm64
            output: scion-linux-arm64
          # macOS builds
          - goos: darwin
            goarch: amd64
            output: scion-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: scion-darwin-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web UI
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Get version info
        id: version
        run: |
          # Get version from git tag
          if git describe --tags --exact-match >/dev/null 2>&1; then
            VERSION=$(git describe --tags --exact-match)
          else
            VERSION=""
          fi
          
          COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PKG="github.com/GoogleCloudPlatform/scion/pkg/version"
          
          # Build ldflags, only including version if available
          LDFLAGS="-X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildTime=${BUILD_TIME}"
          if [ -n "$VERSION" ]; then
            LDFLAGS="${LDFLAGS} -X ${PKG}.Version=${VERSION}"
          fi
          
          echo "ldflags=${LDFLAGS}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags "${{ steps.version.outputs.ldflags }}" -o dist/scion ./cmd/scion
          tar -czvf ${{ matrix.output }}.tar.gz -C dist scion

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine release channel
        id: channel
        env:
          REF: ${{ github.ref }}
        run: |
          TAG="${REF#refs/tags/}"
          if [[ "$TAG" == *"-preview."* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "channel=preview" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-rc."* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "channel=rc" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Prepare release assets
        run: |
          mkdir -p release
          find binaries -type f -exec mv {} release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          name: ${{ steps.channel.outputs.tag }}
          generate_release_notes: true

      - name: Update channel branch
        continue-on-error: true
        id: branch-update
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          # For preview and rc tags, update the "preview" branch
          # For stable tags, update the "stable" branch
          if [[ "$CHANNEL" == "stable" ]]; then
            BRANCH="stable"
          else
            BRANCH="preview"
          fi
          # Force-update the channel branch to point at this tag's commit
          git push origin "HEAD:refs/heads/${BRANCH}" --force

      - name: Warn on branch update failure
        if: steps.branch-update.outcome == 'failure'
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          if [[ "$CHANNEL" == "stable" ]]; then
            BRANCH="stable"
          else
            BRANCH="preview"
          fi
          echo "::warning::Failed to update channel branch '${BRANCH}' to ${TAG}. Manual update may be needed."
