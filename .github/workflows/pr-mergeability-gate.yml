# ptone/scion#1294: GitHub does not schedule any `pull_request`-triggered
# workflow run at all while a PR's merge commit can't be computed
# (mergeable_state: dirty, i.e. a real merge conflict with the base branch).
# Verified live on this fork on 2026-09-25 against PR #1207/#1208 (both
# DIRTY/CONFLICTING): zero check-runs and zero commit statuses for the head
# SHA -- every `pull_request` workflow in this repo (ci.yml, extras-ci.yml,
# chart-ci.yml, macos-bash32.yml) was silently skipped, including
# `Build & Test`. The checks list looks incomplete/empty rather than failing,
# so a conflicted, never-built commit is indistinguishable from one nobody
# has looked at yet.
#
# This job uses `pull_request_target` instead of `pull_request` specifically
# because it is dispatched from the base repository's copy of this workflow
# and does not require a computable merge ref, so it still runs when the PR
# is conflicted. That gives conflicted PRs one visible, always-present check
# that goes red instead of missing.
#
# SAFETY: `pull_request_target` runs with base-repo context and read access
# to secrets, so it is only safe to use here because this workflow never
# checks out the PR head or executes any code from the fork/branch -- it
# only reads PR metadata via the GitHub API. Do not add an `actions/checkout`
# step (or anything else that runs PR-controlled code) to this file without
# re-reviewing for secret exposure; see GitHub's pull_request_target
# security guidance.
#
# The job's token also has `actions: write` (job level only; the workflow
# default stays read-only). It is used for one call: the live-head guard's
# request to re-run an existing run of this same workflow. This is safe
# because no PR-controlled code runs that could reach the token, the re-run
# target is picked only from API data (PR number -> live head SHA -> run ID),
# and PR-controlled strings (title, body, branch name) never reach a shell.
#
# Known gap (deferred, see ptone/scion#1294): this only re-evaluates on PR
# events (opened/synchronize/reopened/ready_for_review). A PR that goes
# dirty solely because `main` advanced underneath it -- with no new push to
# the PR branch -- won't get a fresh run until its next update. Making a
# required check for `build-and-test` in branch protection (settings, not
# code) is still the complete fix; this workflow is a code-side mitigation
# for the common case of a PR that is already conflicted when opened or
# updated.
name: PR Mergeability Gate

on: # zizmor: ignore[dangerous-triggers] -- no PR code checked out or run; see SAFETY note above
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Concurrency (ptone/scion#3408, refining ptone/scion#2845): at most one
# in-progress plus one pending gate run per PR. The group is keyed on the PR
# number only, with cancel-in-progress false. Per GitHub's docs, a run that
# joins a group whose slot is held becomes `pending`, and a newer arrival
# cancels and replaces it. A run that is no longer `pending` (including one
# still waiting for a runner) is never cancelled. Replacement follows the
# order in which runs reach the group, which GitHub documents as not
# guaranteed to match event order, and a re-run of an older run joins as a
# new arrival. The live-head guard step makes the invariant independent of
# that order. Relies on the default `queue: single`; do not set `queue: max`.
#
# Trade-off: the slot holder keeps the slot through its runner wait, so the
# latest head's run stays `pending` until it finishes. With a saturated
# runner pool the latest head's result can take up to about 2x the runner
# queue wait (about 1x with a per-head group).
#
# INVARIANT: every PR's latest head ends with a completed (not cancelled)
# gate result. (1) The run that reaches the group last for a PR is never
# cancelled and, with no job-level `if:`, runs to completion. (2) If its
# event head is not the live head, its guard sees every run for the live
# head cancelled and re-runs the newest one. That attempt joins the group
# while this run holds the slot, so it is now the last arrival and (1)
# applies to it. The guard's attempt backstop (below) can stop this repair;
# it then emits a warning instead.
# Do NOT set cancel-in-progress to true: a later arrival could cancel the
# latest head's run mid-run, and the guard cannot repair that because it
# runs inside the cancelled run. Do not add a job-level `if:` or a trigger
# whose run may skip the job.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read # no checkout; kept explicit as the read-only default
  pull-requests: read # read the PR's mergeable_state and head SHA

jobs:
  mergeability:
    name: Mergeability Gate
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow default for this job, so the
    # two read scopes are repeated. `actions: write` is only for the live-head
    # guard's re-run request; see the SAFETY note at the top of the file.
    permissions:
      contents: read # no checkout; kept explicit as the read-only default
      pull-requests: read # read the PR's mergeable_state and head SHA
      actions: write # live-head guard: re-run this workflow's own run
    steps:
      - name: Check PR mergeable state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          state="unknown"
          for i in $(seq 1 15); do
            state=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.mergeable_state')
            echo "attempt ${i}/15: mergeable_state=${state}"
            if [ "$state" != "unknown" ]; then
              break
            fi
            sleep 4
          done

          case "$state" in
            dirty)
              echo "::error title=Merge conflict::This PR conflicts with its base branch. GitHub skips all pull_request-triggered CI (including Build & Test) while a PR is in this state (ptone/scion#1294), so the rest of the checks list will look incomplete or empty instead of failing. Resolve the conflict and push an update to restore full CI."
              exit 1
              ;;
            unknown)
              echo "::warning title=Mergeability not yet determined::GitHub had not finished computing this PR's mergeable state after 60s, so this check passed without confirming the PR is conflict-free. Re-run it (or push a small update) if you want a confirmed result."
              ;;
            *)
              echo "mergeable_state '${state}' does not indicate a merge conflict; not blocking."
              ;;
          esac

      # Live-head guard (see INVARIANT above). Repair only: it never changes
      # the gate verdict, and continue-on-error keeps a guard API error from
      # failing the gate. `!cancelled()` runs it even when the check fails.
      #
      # Termination bound: the guard acts only in a run whose event head is
      # not the live head, while every run for the live head is cancelled.
      # It then makes at most one re-run request, with no retry, and the
      # re-run carries the live head, so it does not trigger the guard again
      # unless the PR gets a new head (which is a new event, not the guard).
      # Runs in one group never overlap, so guards for a PR never race. As a
      # hard backstop it never re-runs a run already at attempt 3 or later,
      # so it cannot re-queue the same run indefinitely.
      - name: Live-head guard
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          MAX_ATTEMPT: "3"
        run: |
          set -euo pipefail

          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '{state, sha: .head.sha}')
          pr_state=$(jq -r '.state' <<<"$pr")
          live=$(jq -r '.sha' <<<"$pr")
          if [ "$pr_state" != "open" ] || [ "$live" = "$EVENT_HEAD" ]; then
            echo "This run is for the live head (or the PR is not open); nothing to do."
            exit 0
          fi
          if ! [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning title=Live-head guard::Unexpected head SHA from the API; skipping."
            exit 0
          fi

          # Gate runs for the live head, newest first.
          runs=$(gh api "repos/${REPO}/actions/workflows/pr-mergeability-gate.yml/runs?event=pull_request_target&head_sha=${live}&per_page=100" \
            --jq '[.workflow_runs[] | {id, run_attempt, conclusion}] | sort_by(.id) | reverse')
          # No run yet: the live head's own event run arrives later and completes.
          # Any run not cancelled (pending, queued, in progress, or completed): fine.
          if jq -e 'length == 0 or any(.[]; .conclusion != "cancelled")' <<<"$runs" >/dev/null; then
            echo "The live head ${live} has no gate run yet, or has one that was not cancelled; nothing to do."
            exit 0
          fi

          target=$(jq -r '.[0].id' <<<"$runs")
          attempt=$(jq -r '.[0].run_attempt' <<<"$runs")
          if ! [[ "$target" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]]; then
            echo "::warning title=Live-head guard::Unexpected run data from the API; skipping."
            exit 0
          fi
          if [ "$attempt" -ge "$MAX_ATTEMPT" ]; then
            echo "::warning title=Live-head guard::Every gate run for the live head ${live} was cancelled and run ${target} is already at attempt ${attempt}; not re-running it again. Push an update or re-run that run by hand."
            exit 0
          fi

          echo "Every gate run for the live head ${live} was cancelled; re-running run ${target} (attempt ${attempt})."
          if ! gh api -X POST "repos/${REPO}/actions/runs/${target}/rerun"; then
            echo "::warning title=Live-head guard::Re-run request for run ${target} failed. Push an update or re-run that run by hand."
          fi
