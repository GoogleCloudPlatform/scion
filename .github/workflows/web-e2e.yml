# Web Playwright e2e suites (ptone/scion#2580). Advisory: not a required
# check. One matrix job per suite config under web/e2e/*/playwright.config.ts,
# all in Chromium. Every suite serves the web sources itself (Vite dev server
# or an esbuild bundle), so there is no shared build step to reuse.
#
# Not covered here: web/playwright.config.ts (e2e/*.spec.ts), which builds
# and starts the Go hub in its global setup.

name: Web E2E (advisory)

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-e2e.yml'
  push:
    branches: [ main ]
  # The odd minute avoids the top-of-hour spike in scheduled GitHub jobs.
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

# Same grouping as ci.yml: a new push to a PR cancels the superseded run;
# main, scheduled and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.suite }}${{ matrix.shard && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - agent-store-count
          - chat
          - chat-file-preview
          - chat-palette
          - project-files-tabs
          - terminal-coordinator
          - terminal-entrypoints
          - terminal-hidden
          - terminal-lifecycle
          - terminal-owner
          - terminal-pane
          - terminal-workspace
        # chat-mobile runs ~900 tests (several viewports), about 35 minutes
        # on one worker, so it is split into Playwright shards.
        include:
          - { suite: chat-mobile, shard: 1, shards: 4 }
          - { suite: chat-mobile, shard: 2, shards: 4 }
          - { suite: chat-mobile, shard: 3, shards: 4 }
          - { suite: chat-mobile, shard: 4, shards: 4 }
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24' # Node.js 24 (LTS)
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Read Playwright version
        id: playwright
        working-directory: ./web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are keyed on the Playwright version; the OS
      # packages Chromium needs are not cacheable and are installed each run.
      - name: Cache Playwright Chromium
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: ./web
        run: npx playwright install --with-deps --no-shell chromium

      - name: Install Chromium system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: ./web
        run: npx playwright install-deps chromium

      # CHROMIUM_EXECUTABLE / TERMINAL_OWNER_CHROMIUM point every suite at
      # the Playwright Chromium; some configs otherwise default to
      # /usr/bin/chromium.
      - name: Run Playwright suite
        working-directory: ./web
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          CHROMIUM_EXECUTABLE="$(node -p "require('playwright-core').chromium.executablePath()")"
          export CHROMIUM_EXECUTABLE
          export TERMINAL_OWNER_CHROMIUM="$CHROMIUM_EXECUTABLE"
          export PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$SUITE${SHARD:+-$SHARD}"
          npx playwright test -c "e2e/$SUITE/playwright.config.ts" \
            ${SHARD:+--shard="$SHARD/$SHARDS"} \
            --trace=retain-on-failure --reporter=list,html

      - name: Upload traces and report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-${{ matrix.suite }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: |
            web/playwright-report/
            web/test-results/
            web/e2e/*/test-results/
          if-no-files-found: ignore
          retention-days: 14
