# Web Playwright e2e suites (ptone/scion#2580). Advisory: not a required
# check. PRs and main pushes run only when web/ (or this file) changes;
# the nightly run covers everything else, such as browser drift.
#
# One matrix job per suite config under web/e2e/*/playwright.config.ts,
# all in Chromium. Every suite serves the web sources itself (Vite dev
# server or an esbuild bundle), so there is no shared build step to reuse.
#
# Not covered here:
# - web/e2e/chat-mobile: the chat-mobile-e2e job in ci.yml owns it (sharded,
#   with a stable required-check name), so it is not run twice.
# - web/playwright.config.ts (e2e/*.spec.ts), which builds and starts the Go
#   hub in its global setup.
#
# CI-only settings (retry, trace on retry, github and HTML reporters,
# webServer start timeout, globalTimeout) live in each suite config, gated
# on CI, so local runs are unchanged.
#
# Runtime and cost: about 23 minutes of test time per full run (most of it
# terminal-workspace, chat-palette, terminal-entrypoints and
# terminal-hidden), plus roughly 2-3 minutes of setup per job, so about
# 50-60 runner-minutes across 12 jobs; retries of failing tests add to that.
# Wall clock is bounded by the slowest job, about 8-10 minutes.

name: Web E2E (advisory)

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-e2e.yml'
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/web-e2e.yml'
  # The odd minute avoids the top-of-hour spike in scheduled GitHub jobs.
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

# Same grouping as ci.yml: a new push to a PR cancels the superseded run;
# main, scheduled and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - agent-store-count
          - chat
          - chat-file-preview
          - chat-palette
          - project-files-tabs
          - terminal-coordinator
          - terminal-entrypoints
          - terminal-hidden
          - terminal-lifecycle
          - terminal-owner
          - terminal-pane
          - terminal-workspace
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24' # Node.js 24 (LTS)
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Read Playwright version
        id: playwright
        working-directory: ./web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are keyed on the Playwright version; the OS
      # packages Chromium needs are not cacheable and are installed each run.
      - name: Cache Playwright Chromium
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: ./web
        run: npx playwright install --with-deps --no-shell chromium

      - name: Install Chromium system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: ./web
        run: npx playwright install-deps chromium

      # CHROMIUM_EXECUTABLE / TERMINAL_OWNER_CHROMIUM point every suite at
      # the Playwright Chromium; some configs otherwise default to
      # /usr/bin/chromium.
      - name: Run Playwright suite
        working-directory: ./web
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          CHROMIUM_EXECUTABLE="$(node -p "require('playwright-core').chromium.executablePath()")"
          export CHROMIUM_EXECUTABLE
          export TERMINAL_OWNER_CHROMIUM="$CHROMIUM_EXECUTABLE"
          npx playwright test -c "e2e/$SUITE/playwright.config.ts"

      # Uploaded whenever the suite ran, so retry traces of flaky tests (which
      # pass the job) are kept too. Paths match each config's HTML report
      # folder (playwright-report/<suite>) and outputDir (test-results/<suite>,
      # or e2e/<suite>/test-results where a config sets none).
      - name: Upload traces and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-${{ matrix.suite }}
          path: |
            web/playwright-report/
            web/test-results/
            web/e2e/*/test-results/
          if-no-files-found: ignore
          retention-days: 14
