name: Build and Deploy Documentation

# SAFETY: `workflow_run` is required here because GoogleCloudPlatform/scion's
# `github-pages` environment enforces branch protection allowing deployments
# ONLY from `refs/heads/main` (tag-triggered release workflows cannot deploy to
# Pages directly, and default `GITHUB_TOKEN` events cannot chain
# `workflow_dispatch`). This trigger is safe here because:
# 1. `check-trigger` rejects `pull_request`-originated runs and cross-repo/fork
#    heads (`workflow_run.event != 'pull_request'` and both `repository` and
#    `head_repository` equal `GoogleCloudPlatform/scion`).
# 2. `build-docs` checks out ONLY the default branch (`refs/heads/main` with
#    `persist-credentials: false`) -- it never checks out
#    `workflow_run.head_sha`, never downloads workflow artifacts, and never
#    interpolates untrusted event metadata into `run:` scripts.
# 3. `assemble-pages.mjs` reads only published GitHub Release tarballs from
#    `GoogleCloudPlatform/scion`, verifying `.sha256` digests and rejecting
#    non-regular files, absolute paths, and `..` traversal before extraction.
on: # zizmor: ignore[dangerous-triggers] -- checks out main only, never workflow_run head or artifacts; see SAFETY note above
  push:
    branches: [ main ]
    paths:
      - 'docs-site/**'
      - 'scripts/docs/**'
      - 'hack/check-docs-links.mjs'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-snapshot.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs-site/**'
      - 'scripts/docs/**'
      - 'hack/check-docs-links.mjs'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-snapshot.yml'
  workflow_run:
    workflows:
      - 'Build Multi-Arch Release'
      - 'Nightly Release'
      - 'Weekly Preview Release'
      - 'Build Docs Snapshot'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

# Fork CI gate (hack/check-fork-ci-gate.sh, cr-ci/workflows/README.md): on push
# and schedule every job runs only in GoogleCloudPlatform/scion; forks stage PRs.
jobs:
  check-trigger:
    if: ${{ ((github.event_name != 'push' && github.event_name != 'schedule') || github.repository == 'GoogleCloudPlatform/scion') && (github.event_name != 'workflow_run' || (github.repository == 'GoogleCloudPlatform/scion' && github.event.workflow_run.repository.full_name == 'GoogleCloudPlatform/scion' && github.event.workflow_run.head_repository.full_name == 'GoogleCloudPlatform/scion' && github.event.workflow_run.event != 'pull_request')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_build: ${{ steps.mode.outputs.should_build }}
      should_deploy: ${{ steps.mode.outputs.should_deploy }}
    steps:
      - name: Determine build and deploy mode
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            # Deploy only when a "Build and Upload Docs Snapshot" job in the upstream
            # workflow run succeeded. Running this check in an un-grouped gate job
            # ensures skipped runs (e.g. Nightly with no new commits) never supersede
            # a pending deploy run in build-docs's concurrency group.
            MATCHING_JOBS=$(gh api "repos/${GH_REPO}/actions/runs/${WORKFLOW_RUN_ID}/jobs?per_page=100" --paginate --slurp \
              | jq '[.[].jobs[] | select((.name | endswith("Build and Upload Docs Snapshot")) and .conclusion == "success")] | length')
            if [[ "${MATCHING_JOBS:-0}" -gt 0 && "$GH_REPO" == "GoogleCloudPlatform/scion" && "$GIT_REF" == "refs/heads/main" ]]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping Pages rebuild: no succeeded 'Build and Upload Docs Snapshot' job in run ${WORKFLOW_RUN_ID}."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          if [[ "$GH_REPO" == "GoogleCloudPlatform/scion" && "$GIT_REF" == "refs/heads/main" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build-docs:
    if: ${{ ((github.event_name != 'push' && github.event_name != 'schedule') || github.repository == 'GoogleCloudPlatform/scion') && (needs.check-trigger.outputs.should_build == 'true') }}
    needs: check-trigger
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.SCION_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    # Per-ref group on active builds only: PR pushes cancel older runs on the same PR,
    # while main pushes and snapshot-assembly runs never cancel mid-run.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site config
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Check docs internal links and anchors
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::error title=Docs links NOT checked::check-docs-links could not run (exit 3: node not found) — NOTHING WAS ANALYSED."
            exit 3
          fi
          set +e
          node ./hack/check-docs-links.mjs --self-test
          rc=$?
          if [ "$rc" -ne 0 ]; then
            set -e
            echo "::error title=Docs links NOT checked::check-docs-links --self-test failed (exit $rc) — the check itself is broken or could not run, so nothing was analysed."
            exit "$rc"
          fi
          node ./hack/check-docs-links.mjs
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Docs links::Broken internal link, #heading anchor, missing /scion/ prefix, legacy redirect target, or bare suppression found in docs-site/. Details are in the step log above." ;;
            *) echo "::error title=Docs links NOT checked::check-docs-links.mjs could not run (exit $rc) — NOTHING WAS ANALYSED. This is an environment failure, not a statement about the codebase." ;;
          esac
          exit "$rc"

      - name: Setup Pages
        if: needs.check-trigger.outputs.should_deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Pinned release tarball with a checksum. d2lang.com/install.sh calls the
      # GitHub API without auth and hits the shared-runner rate limit (403).
      - name: Install D2
        env:
          D2_VERSION: v0.9.0
          D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9
        run: |
          tarball="d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/${tarball}"
          echo "${D2_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/d2-${D2_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: cd docs-site && npm ci

      - name: Run unit tests, type checks, and D2 syntax check
        run: |
          cd docs-site
          npm test
          npm run check
          npm run check-d2

      - name: Build main documentation
        run: cd docs-site && npm run build

      - name: Assemble versioned Pages site
        if: needs.check-trigger.outputs.should_deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd docs-site
          node scripts/assemble-pages.mjs \
            --main-dist dist \
            --out-dir assembled-pages \
            --repo "$GH_REPO"

      - name: Upload Pages artifact
        if: needs.check-trigger.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/assembled-pages

  deploy-docs:
    if: ${{ ((github.event_name != 'push' && github.event_name != 'schedule') || github.repository == 'GoogleCloudPlatform/scion') && (needs.check-trigger.outputs.should_deploy == 'true') }}
    needs: [check-trigger, build-docs]
    runs-on: ubuntu-latest
    # Serialize Pages deployments; never cancel one that is in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
