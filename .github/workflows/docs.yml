name: Build and Deploy Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs-site/**'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-snapshot.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs-site/**'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-snapshot.yml'
  workflow_run:
    workflows:
      - 'Build Multi-Arch Release'
      - 'Nightly Release'
      - 'Weekly Preview Release'
      - 'Build Docs Snapshot'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

# Per-ref group: each PR gets its own group, so PR builds no longer queue
# behind (and cancel) one another. A newer push to the same PR supersedes its
# older run. Pushes to main and release-snapshot assembly runs are not cancelled mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Fork CI gate (hack/check-fork-ci-gate.sh, cr-ci/workflows/README.md): on push
# and schedule every job runs only in GoogleCloudPlatform/scion; forks stage PRs.
jobs:
  build-docs:
    if: ${{ ((github.event_name != 'push' && github.event_name != 'schedule') || github.repository == 'GoogleCloudPlatform/scion') && (github.event_name != 'workflow_run' || (github.repository == 'GoogleCloudPlatform/scion' && github.event.workflow_run.repository.full_name == 'GoogleCloudPlatform/scion')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: read # configure-pages reads the Pages site config
    outputs:
      should_deploy: ${{ steps.mode.outputs.should_deploy }}
    steps:
      - name: Determine build and deploy mode
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            # Deploy only when a "Build and Upload Docs Snapshot" job in the upstream
            # workflow run succeeded. Skips nightly/weekly runs that created no tag,
            # while still deploying when unrelated jobs (e.g. Homebrew) fail.
            MATCHING_JOBS=$(gh api "repos/${GH_REPO}/actions/runs/${WORKFLOW_RUN_ID}/jobs?per_page=100" --paginate \
              --jq '[.jobs[] | select((.name | endswith("Build and Upload Docs Snapshot")) and .conclusion == "success")] | length')
            if [[ "${MATCHING_JOBS:-0}" -gt 0 && "$GH_REPO" == "GoogleCloudPlatform/scion" && "$GIT_REF" == "refs/heads/main" ]]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping Pages rebuild: no succeeded 'Build and Upload Docs Snapshot' job in run ${WORKFLOW_RUN_ID}."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          if [[ "$GH_REPO" == "GoogleCloudPlatform/scion" && "$GIT_REF" == "refs/heads/main" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.mode.outputs.should_build == 'true'
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.mode.outputs.should_build == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Setup Pages
        if: steps.mode.outputs.should_deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Pinned release tarball with a checksum. d2lang.com/install.sh calls the
      # GitHub API without auth and hits the shared-runner rate limit (403).
      - name: Install D2
        if: steps.mode.outputs.should_build == 'true'
        env:
          D2_VERSION: v0.9.0
          D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9
        run: |
          tarball="d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/${tarball}"
          echo "${D2_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/d2-${D2_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.mode.outputs.should_build == 'true'
        run: cd docs-site && npm ci

      - name: Run unit tests, type checks, and D2 syntax check
        if: steps.mode.outputs.should_build == 'true'
        run: |
          cd docs-site
          npm test
          npm run check
          npm run check-d2

      - name: Build main documentation
        if: steps.mode.outputs.should_build == 'true'
        run: cd docs-site && npm run build

      - name: Assemble versioned Pages site
        if: steps.mode.outputs.should_deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd docs-site
          node scripts/assemble-pages.mjs \
            --main-dist dist \
            --out-dir assembled-pages \
            --repo "$GH_REPO"

      - name: Upload Pages artifact
        if: steps.mode.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/assembled-pages

  deploy-docs:
    if: ${{ ((github.event_name != 'push' && github.event_name != 'schedule') || github.repository == 'GoogleCloudPlatform/scion') && (needs.build-docs.outputs.should_deploy == 'true') }}
    needs: build-docs
    runs-on: ubuntu-latest
    # Serialize Pages deployments; never cancel one that is in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
