# Publish the omni image to GHCR when source or image-build files change.
#
# Triggered on pull_request when any Go source, web source, or image-build
# file is modified. The image contains the compiled Go binary and embedded
# web assets, so changes to any of these require a rebuild — otherwise the
# published image silently contains a stale binary.
#
# The image is pushed with two tags:
#   - dev-<head-sha>: the PR head commit SHA (predictable, matches git log)
#   - dev-<merge-sha>: the PR merge commit SHA (github.sha, for backward compat)
#
# Only scion-omni is pushed; intermediate images (thick-prep, scion-base,
# harness chain) are built locally and not published.

name: Publish Omni Image

on:
  pull_request:
    paths:
      - 'image-build/**'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push Omni Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all images locally (no push)
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          # Build with the merge-commit tag (backward compat).
          TAG: dev-${{ github.sha }}
        run: |
          # Build the full chain locally. Nothing is pushed yet —
          # intermediates stay in the local daemon only. This avoids
          # GHCR cross-repo blob mount failures (read_package denied)
          # that killed the previous attempt on scion-base.
          image-build/scripts/build-images.sh \
            --registry "${REGISTRY}" --target thick-prep \
            --tag "${TAG}" --platform linux/amd64

          THICK_BUILD=true image-build/scripts/build-images.sh \
            --registry "${REGISTRY}" --target scion-base \
            --tag "${TAG}" --platform linux/amd64

          image-build/scripts/build-images.sh \
            --registry "${REGISTRY}" --target omni \
            --tag "${TAG}" --platform linux/amd64

          echo ""
          echo "=== All local images ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Push only scion-omni
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          MERGE_TAG: dev-${{ github.sha }}
          HEAD_TAG: dev-${{ github.event.pull_request.head.sha }}
        run: |
          IMAGE="${REGISTRY}/scion-omni"

          # Tag with the head commit SHA (predictable from git log)
          docker tag "${IMAGE}:${MERGE_TAG}" "${IMAGE}:${HEAD_TAG}"

          echo "Pushing scion-omni with two tags..."
          docker push "${IMAGE}:${MERGE_TAG}"
          docker push "${IMAGE}:${HEAD_TAG}"

          echo ""
          echo "=== PUSH RESULT ==="
          echo "Merge-commit tag: ${IMAGE}:${MERGE_TAG}"
          echo "Head-commit tag:  ${IMAGE}:${HEAD_TAG}"
          echo ""
          echo "Use the head-commit tag for predictable references:"
          echo "  ${IMAGE}:${HEAD_TAG}"

      - name: Test anonymous pull (logged-out)
        if: always()
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: dev-${{ github.event.pull_request.head.sha }}
        run: |
          # Remove the local image so the pull is real
          docker rmi "${REGISTRY}/scion-omni:${TAG}" 2>/dev/null || true
          # Log out of GHCR to test anonymous access
          docker logout ghcr.io 2>/dev/null || true
          echo "Attempting anonymous pull of ${REGISTRY}/scion-omni:${TAG}..."
          if docker pull "${REGISTRY}/scion-omni:${TAG}" 2>&1; then
            echo ""
            echo "=== ANONYMOUS PULL: PASS ==="
            echo "scion-omni:${TAG} is publicly accessible without auth"
          else
            echo ""
            echo "=== ANONYMOUS PULL: FAIL ==="
            echo "scion-omni:${TAG} is NOT publicly accessible."
            echo "GHCR packages default to private. The package must be"
            echo "set to public for Cloud Run to pull without a secret."
          fi
