# Sets up Go and restores this workload's Go module download cache and
# build cache (ptone/scion#4251, option F). Pair it with
# ./.github/actions/save-go-cache as the job's last step.
#
# Why not setup-go's own cache: it keys every job on go.sum alone, and saves
# only on a key miss, so whichever job finished first after a go.sum change
# (often a tiny one) saved the cache every job then restored, and no job
# ever saved a useful one. Here:
# - every workload (a fixed string per job, e.g. build-test or
#   hub-shards) has its own key, so it restores what its own builds made;
# - the key ends in the UTC date, so the first main run of each day saves a
#   fresh cache, and later runs that day hit it;
# - restore-keys fall back to the same workload's newest cache (same go.sum
#   first, then any), so the first run of a day starts from yesterday's;
# - only pushes to main save (save-go-cache), so PRs restore main's caches
#   and write none;
# - of the module cache, only $GOMODCACHE/cache/download (the module zips,
#   .mod and .info files) is cached, not the extracted module tree: go
#   extracts a module from its cached zip when a build first needs it
#   (unzipping pkg/hub's 174 module zips, 164 MB, takes about 11 s), while
#   caching the 1.1 GB tree they extract to would add about 140 MB
#   compressed to every workload's cache, on top of the zips.
#
# Several jobs can share one workload (the pkg/hub shards): give them the
# same workload name, and save from only one of them (see save-go-cache).
#
# No workload name may be another's name followed by "-" (for example
# hub-shard and hub-shard-plan): the restore-keys' bare prefix would
# restore the other workload's cache. The first step checks this.
#
#   - name: Setup Go
#     id: go
#     uses: ./.github/actions/setup-go-cache
#     with:
#       workload: build-test
#   ...
#   - name: Save Go cache
#     uses: ./.github/actions/save-go-cache
#     with:
#       key: ${{ steps.go.outputs.cache-key }}
#       cache-hit: ${{ steps.go.outputs.cache-hit }}
name: Setup Go with a per-workload cache
description: actions/setup-go without its cache, plus a restore of this workload's Go module download cache and build cache.
inputs:
  workload:
    description: The cache's workload name, fixed per job (and per matrix value where the builds differ; jobs with the same builds can share one).
    required: true
  go-version-file:
    description: Passed to actions/setup-go.
    required: false
    default: go.mod
outputs:
  go-version:
    description: The installed Go version (from actions/setup-go).
    value: ${{ steps.setup.outputs.go-version }}
  cache-key:
    description: The primary cache key, for save-go-cache.
    value: ${{ steps.key.outputs.key }}
  cache-hit:
    description: '"true" when the primary key was restored exactly.'
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Setup Go
      id: setup
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    # The restore-keys end in a bare prefix (go-...-<workload>-), which
    # also matches every workload whose name is this one plus "-..." (a
    # hub-shard workload restored hub-shard-plan's 11 MB cache that way).
    # So no workload name may be another's name followed by "-". This
    # check fails the job when that happens among the workloads named in
    # .github/workflows (literal names only; one built from an
    # expression is checked as this job's resolved name).
    - name: Check the Go cache workload name
      shell: bash
      env:
        WORKLOAD: ${{ inputs.workload }}
      run: |
        set -euo pipefail
        # grep exits 1 when no workflow names a literal workload, and 2
        # when it cannot read them; either way there is nothing to check
        # against, so fail loudly rather than pass a check that saw nothing.
        rc=0
        literal=$(grep -hE '^[[:space:]]+workload:[[:space:]]*[^[:space:]$]+[[:space:]]*$' "$GITHUB_WORKSPACE"/.github/workflows/*.yml) || rc=$?
        if [ "$rc" -gt 1 ]; then
          echo "::error title=setup-go-cache::could not read the workflows in $GITHUB_WORKSPACE/.github/workflows to check the Go cache workload names (grep exit $rc)"
          exit 1
        fi
        if [ -z "$literal" ]; then
          echo "::error title=setup-go-cache::found no literal 'workload:' in $GITHUB_WORKSPACE/.github/workflows/*.yml, so the Go cache workload names cannot be checked; the check's pattern no longer matches how workflows pass the workload"
          exit 1
        fi
        names=$( { echo "$WORKLOAD"; printf '%s\n' "$literal" | sed -E 's/^[[:space:]]+workload:[[:space:]]*//; s/[[:space:]]+$//; s/^["'"'"']//; s/["'"'"']$//'; } | sed '/^$/d' | sort -u)
        bad=0
        while IFS= read -r a; do
          while IFS= read -r b; do
            if [ "$a" != "$b" ] && [ "${b#"$a"-}" != "$b" ]; then
              echo "::error title=setup-go-cache::Go cache workload '$b' starts with '$a-', so the '$a' workload's restore-keys would also restore '$b' caches; rename one of them."
              bad=1
            fi
          done <<< "$names"
        done <<< "$names"
        exit "$bad"

    - name: Compute the Go cache key
      id: key
      shell: bash
      env:
        GO_VERSION: ${{ steps.setup.outputs.go-version }}
        WORKLOAD: ${{ inputs.workload }}
        GO_SUM_HASH: ${{ hashFiles('go.sum') }}
      run: |
        set -euo pipefail
        prefix="go-${RUNNER_OS}-${RUNNER_ARCH}-${GO_VERSION}-${WORKLOAD}-"
        {
          echo "prefix=${prefix}"
          echo "prefix-sum=${prefix}${GO_SUM_HASH}-"
          echo "key=${prefix}${GO_SUM_HASH}-$(date -u +%Y%m%d)"
          echo "gocache=$(go env GOCACHE)"
          echo "gomoddownload=$(go env GOMODCACHE)/cache/download"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the Go cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # save-go-cache must list the same paths, in the same order.
        path: |
          ${{ steps.key.outputs.gomoddownload }}
          ${{ steps.key.outputs.gocache }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.prefix-sum }}
          ${{ steps.key.outputs.prefix }}

    # Build cache entries this job uses or writes get a newer mtime than this
    # stamp; save-go-cache drops the rest, so a saved cache holds only what
    # its workload used, and does not grow from day to day. Go refreshes an
    # entry's mtime on use only once it is an hour old, so the restored
    # entries are first back-dated by two hours: otherwise a cache saved
    # less than an hour before this run would lose entries this job used.
    # (An entry Go never opens, such as the output of an action whose
    # result it did not need, is still dropped; that only costs a miss.)
    - name: Mark the Go cache restore time
      shell: bash
      env:
        GOCACHE_DIR: ${{ steps.key.outputs.gocache }}
      run: |
        set -euo pipefail
        if [ -d "$GOCACHE_DIR" ]; then
          find "$GOCACHE_DIR" -mindepth 2 -type f -exec touch -d '2 hours ago' {} +
        fi
        touch "$RUNNER_TEMP/go-cache-restored.stamp"

    # cr-ci runner only: it is self-hosted and its runners are named
    # cr-job-<job id> (the mediator registers them so). runner.environment is
    # 'github-hosted' everywhere else, so this step never runs upstream, and
    # other self-hosted runners skip it.
    # actions/cache stores paths relative to GITHUB_WORKSPACE, so entries
    # restore to the same place on ubuntu-latest and on the cr-ci runner
    # only if the work folder and HOME match. The cr-ci runner mounts its
    # ephemeral-disk volume at HOME, and the entrypoint creates the work folder
    # and ~/.cache, ~/go, ~/.npm as real directories on it (no links, so their
    # physical paths are their logical ones). If that ever breaks, the two
    # runner types would silently keep separate caches (twice the Actions
    # cache quota), or the caches would land in RAM, so fail the job instead
    # (cr-ci/workflows/README.md, "Cache sharing").
    - name: Check cr-ci cache parity (cr-ci runner only)
      if: runner.environment == 'self-hosted' && startsWith(runner.name, 'cr-job-')
      shell: bash
      run: |
        set -uo pipefail
        fail=0
        # An empty value (a path that does not exist or cannot be resolved) fails even
        # when the expected side is empty too.
        check() {
          if [ -z "$2" ]; then
            echo "::error title=cr-ci cache parity::$1 is empty (missing or unresolvable), want '$3'"
            fail=1
          elif [ "$2" = "$3" ]; then
            echo "ok   $1: $2"
          else
            echo "::error title=cr-ci cache parity::$1 is '$2', want '$3'"
            fail=1
          fi
        }
        check HOME "$HOME" /home/runner
        if [ -L /home/runner/work ]; then
          # SWITCH ONLY: the layout of cr-ci runner images before the volume moved to HOME
          # (cr-ci FIXUP-5): HOME entries linked into /scratch, mirrored. Remove this branch
          # once every cr-ci deployment runs the new image (cr-ci/docs/operations.md,
          # "Runner layout switch").
          echo "note: old cr-ci runner layout (/home/runner/work links into /scratch)"
          check "work folder /home/runner/work" "$(readlink -f /home/runner/work)" "$(readlink -f /scratch/_work)"
          check "HOME/.cache" "$(readlink -f "$HOME/.cache")" "$(readlink -f /scratch/.cache)"
          check "HOME/go" "$(readlink -f "$HOME/go")" "$(readlink -f /scratch/go)"
        else
          # Real directories: each resolves to itself. ~/.cache may instead be a link to
          # the entrypoint's RAM directory when the job sets RUNNER_BUILD_CACHE_IN_RAM=true
          # (the same branch as cr-ci/workflows/cr-runner-poc.yml; templates_test.go keeps
          # the two in step).
          for d in /home/runner/work "$HOME/go" "$HOME/.npm"; do
            check "real directory $d" "$(readlink -f "$d")" "$d"
          done
          if [ "${RUNNER_BUILD_CACHE_IN_RAM:-false}" = true ] && [ -L "$HOME/.cache" ]; then
            check "HOME/.cache (RAM build cache)" "$(readlink -f "$HOME/.cache")" /tmp/cr-ci-build-cache
          else
            check "real directory ~/.cache" "$(readlink -f "$HOME/.cache")" /home/runner/.cache
          fi
          # On the volume, not on the root filesystem (in memory on Cloud Run).
          home_dev=$(stat -c %d "$HOME" 2>/dev/null)
          root_dev=$(stat -c %d / 2>/dev/null)
          if [ -z "$home_dev" ] || [ "$home_dev" = "$root_dev" ]; then
            echo "::error title=cr-ci cache parity::HOME is on the root filesystem (device '$home_dev'); the runner job must mount its volume at /home/runner"
            fail=1
          else
            echo "ok   HOME is a volume (device $home_dev)"
          fi
          for d in /home/runner/work "$HOME/go" "$HOME/.npm"; do
            check "device of $d" "$(stat -c %d "$d" 2>/dev/null)" "$home_dev"
          done
        fi
        check "go env GOCACHE" "$(go env GOCACHE)" /home/runner/.cache/go-build
        check "go env GOMODCACHE" "$(go env GOMODCACHE)" /home/runner/go/pkg/mod
        check "GITHUB_WORKSPACE parent" "${GITHUB_WORKSPACE%/*/*}" /home/runner/work
        if command -v zstd >/dev/null; then
          echo "ok   zstd: $(zstd --version)"
        else
          echo "::error title=cr-ci cache parity::zstd is not installed"
          fail=1
        fi
        exit "$fail"
