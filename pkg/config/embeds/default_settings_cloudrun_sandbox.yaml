# Scion Agent Configuration (v1) — Cloud Run Sandbox (single-node) tier
#
# This tier runs on a Cloud Run Instance with the sandbox launcher.
# Agents are created as sandboxes inside the Instance. Docker, Podman,
# and Kubernetes are not available; a single "default" profile pointing
# to the cloudrun-sandbox runtime is the only correct choice.
#
# This template mirrors the pattern set by scripts/cloudrun/hub-settings-template.yaml
# for the multi-node Cloud Run tier: one profile, matching the tier's runtime.

schema_version: "1"

# Active profile determines which runtime to use
active_profile: default

# Default harness template for new agents
# Env: SCION_DEFAULT_TEMPLATE
default_template: default

# Default harness-config for new agents
# Env: SCION_DEFAULT_HARNESS_CONFIG
default_harness_config: antigravity

# Container image registry path (REQUIRED)
# Env: SCION_IMAGE_REGISTRY
image_registry: ""

# CLI behavior settings
cli:
  autohelp: true

# Runtime configurations — only cloudrun-sandbox is available on this tier.
runtimes:
  cloudrun-sandbox:
    type: cloudrun-sandbox

# Profiles — single "default" profile matching the tier's runtime.
profiles:
  default:
    runtime: cloudrun-sandbox
