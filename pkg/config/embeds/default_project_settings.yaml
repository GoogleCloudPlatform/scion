# Scion Project Configuration (v1)
#
# Settings merge order: defaults -> global (~/.scion/) -> project (.scion/)
# Project-level settings control per-project preferences like the default
# template and hub connection details, and can override the global active
# profile.
#
# Runtime profiles and runtimes are managed at the global/broker level
# (~/.scion/settings.yaml) and are not defined here.

schema_version: "1"

# active_profile is not set here, so a new project uses the global
# active_profile. To pin one for this project, add (the profile must be
# defined in global settings; env: SCION_ACTIVE_PROFILE):
#   active_profile: <name>

# CLI behavior settings
cli:
  autohelp: true
