schema_version: "1"
server:
  shared_dir_storage:
    nfs:
      mount_root: /mnt/scion-nfs
      shares:
        - id: share-1
runtimes:
  cluster:
    type: kubernetes
    namespace: agents
    kubernetes_service_account_mappings:
      shared@proj.iam.gserviceaccount.com: ksa-shared
profiles:
  a:
    runtime: cluster
    kubernetes_service_account_mappings:
      agent@proj.iam.gserviceaccount.com: ksa-a
  b:
    runtime: cluster
    kubernetes_service_account_mappings:
      agent@proj.iam.gserviceaccount.com: ksa-b
