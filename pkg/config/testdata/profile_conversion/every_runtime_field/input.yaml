schema_version: "1"
server:
  shared_dir_storage:
    nfs:
      mount_root: /mnt/scion-nfs
      shares:
        - id: share-1
runtimes:
  cluster:
    type: kubernetes
    host: unused-host
    context: kind-a
    namespace: agents
    env:
      FOO: bar
    sync: rsync
    gke: true
    list_all_namespaces: false
    priority_class_name: agents-high
    shared_dir_storage_class: standard-rwx
    shared_dir_size: 20Gi
    safe_to_evict: false
    shared_dir_storage_backend: nfs
    shared_dir_storage_backends:
      cache: local
    home_storage_backend: local
    home_storage_leaf: broker
    kubernetes_service_account_mappings:
      agent@proj.iam.gserviceaccount.com: ksa-agent
    kubernetes_block_service_account: zero-priv
  local:
    type: docker
    shared_dir_storage_backend: local
    shared_dir_storage_backends:
      cache: local
profiles:
  k8s:
    runtime: cluster
  dock:
    runtime: local
