schema_version: "1"
runtimes:
  pod:
    type: podman
  apple:
    type: container
  runs:
    type: cloudrun-sandbox
  sub:
    type: substrate
  dock:
    type: docker
    substrate: {}
  dock-sandbox:
    type: docker
    cloudrun_sandbox: {}
profiles:
  p-podman:
    runtime: pod
  p-container:
    runtime: apple
  p-sandbox:
    runtime: runs
  p-substrate:
    runtime: sub
  p-docker-substrate:
    runtime: dock
  p-docker-sandbox:
    runtime: dock-sandbox
  p-implicit:
    runtime: podman
  p-none: {}
