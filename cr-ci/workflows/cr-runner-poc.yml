# cr-ci PoC workflow (TEMPLATE). GitHub ignores this copy: only files under
# .github/workflows/ run. To run it (needs ptone's go-ahead), copy it to
# .github/workflows/ on a throwaway branch named cr-ci-poc-<something> and push
# that branch: the push trigger below runs it from the pushed commit, with no
# change to the default branch (a fork's main must mirror upstream, and
# workflow_dispatch only lists workflows on the default branch). Delete the
# branch and its caches afterwards. See cr-ci/workflows/README.md.
#
# What it measures (design section 7, phase 1): queue-to-start latency, the
# golangci-lint duration on the Cloud Run runner without the pkg/hub -c=1
# compiler throttle, peak memory, and how much of the volume (HOME) the job uses.
#
# runs-on is the runner label ALONE: the mediator only serves jobs whose
# labels are all RUNNER_LABEL (docs/architecture.md, "Labels"); a list such
# as [self-hosted, Linux, X64, <label>] would be logged as labels_unservable
# and never get a runner. The input, and its fallback on push, default to
# RUNNER_LABEL's default in cr-ci/config.example.env (a test keeps them equal).
#
# memory.peak and memory.current are not available under gVisor (Cloud Run), so
# the lint step samples /proc/meminfo and the volume at HOME every 5 s and prints the peaks.
# MemTotal-MemAvailable includes anything held in RAM files (tmpfs), such as the
# RAM build cache.
#
# The tools come from the runner image (runner/Dockerfile): Go and
# golangci-lint are pre-installed, which is part of what the PoC measures. The
# image's golangci-lint is the patched build CI runs (cr-ci/runner/golangci-lint/,
# dominikh/go-tools#1839), which removes most of the single-threaded tail P6b saw.
# Only people with write access can push a branch or dispatch a workflow, so the
# fork guard of the routing expression is not needed here; the mediator applies
# its own fork guard to every run anyway.

name: cr-ci runner PoC

on:
  push:
    branches: ['cr-ci-poc-*']
  workflow_dispatch:
    inputs:
      runner-label:
        description: Runner label to target (must equal the mediator's RUNNER_LABEL)
        required: true
        default: scion-cr-8c32g
      lint-concurrency:
        description: golangci-lint --concurrency (0 = golangci-lint's default, the CPU count)
        required: true
        default: '8'

permissions:
  contents: read

jobs:
  lint-on-cloud-run:
    name: golangci-lint on the cr-ci runner
    runs-on: ${{ inputs.runner-label || 'scion-cr-8c32g' }}
    # Below the Cloud Run task timeout (TASK_TIMEOUT, default 45m), so GitHub
    # cancels a hung job before Cloud Run kills the container.
    timeout-minutes: 40
    steps:
      - name: Check cr-ci cache parity (cr-ci runner only)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Verification only; the runner entrypoint sets all of this up
          # (cr-ci/workflows/README.md, "Cache sharing"). actions/cache stores
          # paths relative to GITHUB_WORKSPACE and extracts them with
          # tar -C "$GITHUB_WORKSPACE", where ".." resolves physically. For
          # entries to land where Go and golangci-lint look, in both directions
          # between ubuntu-latest and cr-ci, HOME must be /home/runner, on the
          # runner's ephemeral-disk volume (mounted at HOME), with the work folder
          # /home/runner/work, ~/.cache and ~/go as real directories on it (no
          # links: physical paths equal logical ones; ~/.cache: see the RAM branch
          # below, a link to the RAM directory with RUNNER_BUILD_CACHE_IN_RAM=true). Plus zstd (the cache
          # version hashes the paths and the compression method). Fails the job
          # if any of it is off.
          set -uo pipefail
          fail=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "ok   $1: $2"
            else
              echo "::error title=cr-ci cache parity::$1 is '$2', want '$3'"
              fail=1
            fi
          }
          check HOME "$HOME" /home/runner
          check "real directory /home/runner/work" "$(readlink -f /home/runner/work)" /home/runner/work
          # RAM build cache (RUNNER_BUILD_CACHE_IN_RAM=true): ~/.cache is then a link to the
          # entrypoint's RAM directory. The same branch as .github/actions/setup-go-cache
          # (templates_test.go keeps the two in step).
          if [ "${RUNNER_BUILD_CACHE_IN_RAM:-false}" = true ] && [ -L "$HOME/.cache" ]; then
            check "HOME/.cache (RAM build cache)" "$(readlink -f "$HOME/.cache")" /tmp/cr-ci-build-cache
          else
            check "real directory ~/.cache" "$(readlink -f "$HOME/.cache")" /home/runner/.cache
          fi
          check "real directory ~/go" "$(readlink -f "$HOME/go")" /home/runner/go
          check "HOME not on the root filesystem" "$([ "$(stat -c %d "$HOME")" != "$(stat -c %d /)" ] && echo volume)" volume
          check "go env GOCACHE" "$(go env GOCACHE)" /home/runner/.cache/go-build
          check "go env GOMODCACHE" "$(go env GOMODCACHE)" /home/runner/go/pkg/mod
          check "GITHUB_WORKSPACE parent" "${GITHUB_WORKSPACE%/*/*}" /home/runner/work
          if command -v zstd >/dev/null; then
            echo "ok   zstd: $(zstd --version)"
          else
            echo "::error title=cr-ci cache parity::zstd is not installed"
            fail=1
          fi
          exit "$fail"

      - name: Runner facts
        shell: bash
        run: |
          echo "runner.environment=${RUNNER_ENVIRONMENT:-unset} runner.name=${RUNNER_NAME:-unset}"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE (physically $(pwd -P))"
          echo "nproc=$(nproc)"
          go version
          golangci-lint version
          for v in GOCACHE GOMODCACHE GOLANGCI_LINT_CACHE TMPDIR RUNNER_TEMP; do echo "$v=${!v:-unset}"; done
          echo "go env GOCACHE=$(go env GOCACHE)"
          cat /sys/fs/cgroup/memory.max 2>/dev/null | sed 's/^/memory.max=/' || echo "memory.max unavailable"
          df -h /home/runner /tmp

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # Restore (never save) the lint workload's Go cache that ci.yml saves on
      # main, with the same key scheme as .github/actions/setup-go-cache, so
      # the PoC lint is as warm as a CI lint. The parity check above makes the
      # cache version and the archive's relative paths match ubuntu-latest's.
      - name: Compute the Go cache key
        id: key
        shell: bash
        env:
          GO_SUM_HASH: ${{ hashFiles('go.sum') }}
        run: |
          set -euo pipefail
          go_version=$(go env GOVERSION)
          prefix="go-${RUNNER_OS}-${RUNNER_ARCH}-${go_version#go}-lint-"
          {
            echo "prefix=${prefix}"
            echo "prefix-sum=${prefix}${GO_SUM_HASH}-"
            echo "key=${prefix}${GO_SUM_HASH}-$(date -u +%Y%m%d)"
            echo "gocache=$(go env GOCACHE)"
            echo "gomoddownload=$(go env GOMODCACHE)/cache/download"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go cache (on the volume)
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.key.outputs.gomoddownload }}
            ${{ steps.key.outputs.gocache }}
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            ${{ steps.key.outputs.prefix-sum }}
            ${{ steps.key.outputs.prefix }}

      # The matched key alone proves nothing: entries can extract next to Go's
      # cache instead of into it (cr-ci/workflows/README.md, "Cache
      # sharing"). Measure what Go will actually read.
      - name: Check that the Go cache is warm
        shell: bash
        env:
          RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          set -uo pipefail
          gocache=$(go env GOCACHE)
          files=$(find "$gocache/" -type f 2>/dev/null | wc -l)
          size=$(du -sh "$gocache/" 2>/dev/null | cut -f1)
          echo "restored key: ${RESTORED_KEY:-NONE}"
          echo "go env GOCACHE=$gocache: ${files} files, ${size:-0}"
          if [ -n "$RESTORED_KEY" ] && [ "$files" -ge 1000 ]; then
            echo "go cache warm: yes"
          else
            echo "::warning title=cold Go cache::go cache warm: NO (key '${RESTORED_KEY:-none}', $files files in $gocache); compare the lint duration with CI's cold run, and check the parity step"
            ls -la /home/runner 2>/dev/null || true
          fi

      # Same lint as ci.yml, but WITHOUT the pkg/hub -c=1 compiler throttle and
      # with the cr-ci settings the P6b tuning runs measured best on 8 vCPU /
      # 32 GiB (cr-ci/workflows/README.md): concurrency 8, GOGC 100, GOMEMLIMIT
      # 24GiB (which bounds the compile peak). The sampler adds CPU use (busy
      # cores, system share, iowait from /proc/stat), the compile process count
      # and the lowest MemAvailable; a guard stops the lint (its whole process
      # group, via setsid) if MemAvailable falls below 2 GiB, before the
      # container is OOM-killed. -v prints the loader and linter timings.
      - name: golangci-lint (no pkg/hub compiler throttle)
        shell: bash
        env:
          GOGC: '100'
          GOMEMLIMIT: '24GiB'
          LINT_CONCURRENCY: ${{ inputs.lint-concurrency || '8' }}
          # Stop the lint if MemAvailable falls below this (KiB): 2 GiB.
          MEMGUARD_KB: '2097152'
        run: |
          set -uo pipefail
          samples="$RUNNER_TEMP/samples.log"
          guard="$RUNNER_TEMP/memguard"
          : >"$samples"
          rm -f "$guard"
          start=$(date +%s)
          # setsid: golangci-lint leads its own process group, so the memory
          # guard can stop it together with its go list and compile children.
          setsid golangci-lint run -v --new-from-merge-base=origin/main --concurrency="$LINT_CONCURRENCY" >"$RUNNER_TEMP/lint.out" 2>&1 &
          lint=$!
          (
            # On TERM, stop the pending sleep too, so no sleep outlives the step.
            trap 'kill "${nap:-}" 2>/dev/null; exit 0' TERM
            read -r _ u n s i w q sq st _ </proc/stat
            pbusy=$((${u:-0} + ${n:-0} + ${s:-0} + ${q:-0} + ${sq:-0} + ${st:-0})); ptot=$((pbusy + ${i:-0} + ${w:-0})); psys=${s:-0}; pio=${w:-0}
            while :; do
              # busy_cores: CPUs busy since the previous sample.
              read -r _ u n s i w q sq st _ </proc/stat
              busy=$((${u:-0} + ${n:-0} + ${s:-0} + ${q:-0} + ${sq:-0} + ${st:-0})); tot=$((busy + ${i:-0} + ${w:-0}))
              dt=$((tot - ptot)); [ "$dt" -gt 0 ] || dt=1
              cores=$(awk -v b=$((busy - pbusy)) -v t=$dt -v c="$(nproc)" 'BEGIN{printf "%.1f", b / t * c}')
              # sys_pct: system share of busy time; iowait_cores: CPUs in iowait.
              sysp=$(awk -v s=$((${s:-0} - psys)) -v b=$((busy - pbusy)) 'BEGIN{printf "%d", (b > 0 ? 100 * s / b : 0)}')
              iow=$(awk -v w=$((${w:-0} - pio)) -v t=$dt -v c="$(nproc)" 'BEGIN{printf "%.1f", w / t * c}')
              pbusy=$busy; ptot=$tot; psys=${s:-0}; pio=${w:-0}
              mt=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)
              ma=$(awk '/^MemAvailable:/{print $2}' /proc/meminfo)
              used_kb=$(df -k --output=used /home/runner | tail -1 | tr -d ' ')
              ncomp=$(pgrep -c -x compile || true)
              echo "$(date -u +%H:%M:%S) mem_used_mb=$(( (mt - ma) / 1024 )) avail_mb=$(( ma / 1024 )) vol_used_mb=$(( used_kb / 1024 )) compiles=$ncomp busy_cores=$cores sys_pct=$sysp iowait_cores=$iow t=$(( $(date +%s) - start ))" | tee -a "$samples"
              if [ "$ma" -lt "$MEMGUARD_KB" ] && [ ! -e "$guard" ]; then
                echo "$(date -u +%H:%M:%S) MemAvailable ${ma} KiB < ${MEMGUARD_KB} KiB at t=$(( $(date +%s) - start ))s" | tee "$guard"
                echo "::error title=memory guard::MemAvailable fell below 2 GiB; stopping golangci-lint"
                kill -TERM -- "-$lint" 2>/dev/null
              fi
              sleep 5 &
              nap=$!
              wait "$nap"
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true; kill -TERM -- "-$lint" 2>/dev/null || true' EXIT
          rc=0
          wait "$lint" || rc=$?
          end=$(date +%s)
          cat "$RUNNER_TEMP/lint.out"
          kill "$sampler" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true
          echo "golangci-lint exit=$rc duration=$(( end - start ))s"
          awk '{for (i = 2; i <= NF; i++) { split($i, kv, "="); v = kv[2] + 0; if (!(kv[1] in max) || v > max[kv[1]]) max[kv[1]] = v; if (!(kv[1] in min) || v < min[kv[1]]) min[kv[1]] = v }}
            {if ($0 ~ /busy_cores=/) {split($0, a, "busy_cores="); split(a[2], b, " "); sum += b[1]; n++}}
            END {printf "sample peaks: mem_used_mb=%d vol_used_mb=%d min avail_mb=%d max compiles=%d (%d samples)\n", max["mem_used_mb"], max["vol_used_mb"], min["avail_mb"], max["compiles"], NR}
            END {printf "sample cpu: mean busy_cores=%.1f max sys_pct=%d max iowait_cores=%.1f\n", (n ? sum / n : 0), max["sys_pct"], max["iowait_cores"]}' "$samples"
          if [ -e "$guard" ]; then
            echo "MEMORY GUARD TRIPPED: $(cat "$guard")"
            exit 99
          fi
          exit "$rc"

      - name: Memory and disk report
        if: always()
        shell: bash
        run: |
          echo "memory.peak (bytes):"
          cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo "unavailable (expected under gVisor; see the lint step's sample peaks)"
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo || true
          df -h /home/runner
          du -sh /home/runner/* /home/runner/.cache /home/runner/.npm 2>/dev/null || true
          ls -ld "$HOME/.cache" "$HOME/go" /home/runner/work 2>/dev/null || true
          du -shx /tmp 2>/dev/null || true                # temp files on the in-memory root filesystem (TMPDIR is unset)
