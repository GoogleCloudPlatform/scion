# cr-ci routing snippet for the `lint` job of .github/workflows/ci.yml
# (TEMPLATE, not a workflow). P7 applies it in a separate PR; see
# cr-ci/workflows/README.md. Only the lines below change (plus one new step); everything else in
# the job (checkout, setup-go-cache, the restore / build / save steps of the
# patched golangci-lint from cr-ci/runner/golangci-lint/, golangci-lint-action's
# analysis-cache restore, the memory sampler, save-go-cache) stays exactly as it
# is. On the cr-ci runner those steps build or restore the same binary as on
# ubuntu-latest (shared cache entry); the runner image's copy is not used.
#
# 1. runs-on: the routing expression. It routes to the Actions variable
#    SCION_LARGE_RUNNER (ROUTING_VARIABLE_NAME; set it to RUNNER_LABEL) only
#    for pushes and same-repo pull requests (the fork guard), and to
#    ubuntu-latest for everything else, including any repo where the variable
#    is unset (vars.* is then the empty string, which is falsy). Events the
#    mediator refuses (pull_request_target, workflow_run, fork PRs) therefore
#    never queue a job on the label; they would otherwise wait up to 24 h.
#    Keep this line byte-identical to docs/architecture.md and
#    docs/github-setup.md (a test checks it).
#
# 2. The golangci-lint step's env: the memory throttles exist for the 16 GB
#    ubuntu-latest runner (ptone/scion#4208). On the 32 GiB cr-ci runner
#    (runner.environment == 'self-hosted') the pkg/hub -c=1 throttle is
#    dropped, the soft memory limit is raised to 24GiB, golangci-lint analyses
#    8 packages at once instead of 2, and GOGC is 100 instead of 25. These are
#    the P6b tuning results on the 8 vCPU / 32 GiB runner (us-west2, warm
#    caches): about 13 min of lint, peak about 25 GiB with 6.6 GB of RAM left;
#    GOMEMLIMIT is what bounds the compile peak (cr-ci/workflows/README.md,
#    "Tuning"). On any GitHub-hosted runner, including a larger one used as
#    the fallback, the current values apply unchanged.
#
# 3. A new FIRST step, on the cr-ci runner only, checks cache parity and
#    fails the job if it is off. It creates nothing: the runner entrypoint
#    sets up the work folder /home/runner/work (a link to /scratch/_work),
#    ~/.cache -> /scratch/.cache, ~/go -> /scratch/go, GOCACHE and
#    GOMODCACHE under $HOME, and the image has zstd and HOME=/home/runner.
#    With all of that, setup-go-cache and golangci-lint-action restore and
#    save the same cache entries as on ubuntu-latest, and the bytes land on
#    /scratch, not on Cloud Run's in-memory root filesystem
#    (workflows/README.md, "Cache sharing").
#
# 4. The golangci-lint command line reads LINT_CONCURRENCY instead of the
#    literal 2:
#      golangci-lint run --new-from-merge-base=origin/main --concurrency="$LINT_CONCURRENCY" || rc=$?

lint:
  name: golangci-lint
  runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.SCION_LARGE_RUNNER || 'ubuntu-latest' }}
  timeout-minutes: 60
  steps:
    - name: Check cr-ci cache parity (cr-ci runner only)
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        # Verification only; the runner entrypoint sets all of this up
        # (cr-ci/workflows/README.md, "Cache sharing"). actions/cache stores
        # paths relative to GITHUB_WORKSPACE and extracts them with
        # tar -C "$GITHUB_WORKSPACE", where ".." resolves physically. For
        # entries to land where Go and golangci-lint look, in both directions
        # between ubuntu-latest and cr-ci, the work folder must be
        # /home/runner/work (a link to /scratch/_work) and /scratch must
        # mirror $HOME: ~/.cache -> /scratch/.cache, ~/go -> /scratch/go.
        # Plus HOME=/home/runner and zstd (the cache version hashes the paths
        # and the compression method). Fails the job if any of it is off.
        set -uo pipefail
        fail=0
        check() {
          if [ "$2" = "$3" ]; then
            echo "ok   $1: $2"
          else
            echo "::error title=cr-ci cache parity::$1 is '$2', want '$3'"
            fail=1
          fi
        }
        check HOME "$HOME" /home/runner
        check "work folder link /home/runner/work" "$(readlink /home/runner/work)" /scratch/_work
        check "~/.cache link" "$(readlink "$HOME/.cache")" /scratch/.cache
        check "~/go link" "$(readlink "$HOME/go")" /scratch/go
        check "go env GOCACHE" "$(go env GOCACHE)" /home/runner/.cache/go-build
        check "go env GOMODCACHE" "$(go env GOMODCACHE)" /home/runner/go/pkg/mod
        check "GITHUB_WORKSPACE parent" "${GITHUB_WORKSPACE%/*/*}" /home/runner/work
        if command -v zstd >/dev/null; then
          echo "ok   zstd: $(zstd --version)"
        else
          echo "::error title=cr-ci cache parity::zstd is not installed"
          fail=1
        fi
        exit "$fail"
    # ... unchanged steps: "Checkout code", "Setup Go", "Restore patched golangci-lint",
    # "Build patched golangci-lint", "Save patched golangci-lint",
    # "Restore golangci-lint analysis cache" ...
    - name: golangci-lint
      shell: bash
      env:
        GOGC: ${{ runner.environment == 'self-hosted' && '100' || '25' }}
        GOMEMLIMIT: ${{ runner.environment == 'self-hosted' && '24GiB' || '8GiB' }}
        GOFLAGS: ${{ runner.environment != 'self-hosted' && '-gcflags=github.com/GoogleCloudPlatform/scion/pkg/hub=-c=1' || '' }}
        LINT_CONCURRENCY: ${{ runner.environment == 'self-hosted' && '8' || '2' }}
      run: |
        # ... unchanged, except the golangci-lint line (see note 4) ...
        golangci-lint run --new-from-merge-base=origin/main --concurrency="$LINT_CONCURRENCY" || rc=$?
    # ... unchanged "Save Go cache" step ...
