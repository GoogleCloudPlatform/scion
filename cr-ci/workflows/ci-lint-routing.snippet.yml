# cr-ci routing snippet for the `lint` job of .github/workflows/ci.yml
# (TEMPLATE, not a workflow). P7 applies it in a separate PR; see
# cr-ci/workflows/README.md. Only the lines below change (plus one new step); everything else in
# the job (checkout, setup-go-cache, the golangci-lint-action install, the
# memory sampler, save-go-cache) stays exactly as it is.
#
# 1. runs-on: the routing expression. It routes to the Actions variable
#    SCION_LARGE_RUNNER (ROUTING_VARIABLE_NAME; set it to RUNNER_LABEL) only
#    for pushes and same-repo pull requests (the fork guard), and to
#    ubuntu-latest for everything else, including any repo where the variable
#    is unset (vars.* is then the empty string, which is falsy). Events the
#    mediator refuses (pull_request_target, workflow_run, fork PRs) therefore
#    never queue a job on the label; they would otherwise wait up to 24 h.
#    Keep this line byte-identical to docs/architecture.md and
#    docs/github-setup.md (a test checks it).
#
# 2. The golangci-lint step's env: the memory throttles exist for the 16 GB
#    ubuntu-latest runner (ptone/scion#4208). On the 32 GiB cr-ci runner
#    (runner.environment == 'self-hosted') the pkg/hub -c=1 throttle is
#    dropped, the soft memory limit is raised, and golangci-lint analyses 4
#    packages at once instead of 2. GOGC stays at 25 on both until the P6
#    PoC has measured the headroom. On any GitHub-hosted runner, including a
#    larger one used as the fallback, the current values apply unchanged.
#
# 3. A new FIRST step, on the cr-ci runner only, links ~/.cache and ~/go to
#    /scratch and sets GOCACHE=$HOME/.cache/go-build and
#    GOMODCACHE=$HOME/go/pkg/mod, the paths Go uses on ubuntu-latest. Two
#    effects: nothing lands on Cloud Run's in-memory root filesystem, and
#    setup-go-cache and golangci-lint-action pass actions/cache the same path
#    strings as on ubuntu-latest. With zstd in the runner image, the cache
#    version (paths + compression) matches too, so routed jobs restore and
#    share CI's existing caches (workflows/README.md, "Cache sharing").
#    The tool cache is under the runner's work folder, already on /scratch.
#
# 4. The golangci-lint command line reads LINT_CONCURRENCY instead of the
#    literal 2:
#      golangci-lint run --new-from-merge-base=origin/main --concurrency="$LINT_CONCURRENCY" || rc=$?

lint:
  name: golangci-lint
  runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.SCION_LARGE_RUNNER || 'ubuntu-latest' }}
  timeout-minutes: 60
  steps:
    - name: Keep caches under HOME on /scratch (cr-ci runner only)
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        # Cloud Run's root filesystem, including $HOME, is in memory. Link the
        # cache directories under $HOME to the ephemeral disk, and give Go the
        # SAME cache paths as ubuntu-latest (HOME is /home/runner on both).
        # actions/cache matches an entry on its key AND a version hashed from
        # the path strings and the compression method, so identical paths
        # (plus zstd in the runner image) let a routed job restore, and share,
        # the caches CI saves on ubuntu-latest:
        #   ~/.cache -> /scratch/cache (the entrypoint's XDG_CACHE_HOME): Go's
        #     build cache, and golangci-lint-action's analysis cache, whose
        #     path the action derives from $HOME;
        #   ~/go -> /scratch/gopath (the entrypoint's GOPATH): the module cache.
        # The PARENT directories are linked: tar would replace a symlink at an
        # archived path itself. Idempotent: a correct link (for example one the
        # runner entrypoint already made) is left untouched.
        set -euo pipefail
        [ "$HOME" = /home/runner ] || echo "::warning::HOME is $HOME, not /home/runner: cache paths will not match ubuntu-latest's"
        link_to_scratch() {
          if [ -L "$1" ] && [ "$(readlink "$1")" = "$2" ]; then
            echo "$1 -> $2 (already linked)"
            return 0
          fi
          mkdir -p "$2"
          if [ -d "$1" ] && [ ! -L "$1" ]; then
            cp -a "$1/." "$2/"
            rm -rf "$1"
          fi
          ln -sfn "$2" "$1"
          echo "$1 -> $(readlink -f "$1")"
        }
        link_to_scratch "$HOME/.cache" /scratch/cache
        link_to_scratch "$HOME/go" /scratch/gopath
        {
          echo "GOCACHE=$HOME/.cache/go-build"
          echo "GOMODCACHE=$HOME/go/pkg/mod"
        } >> "$GITHUB_ENV"
    # ... unchanged steps: "Checkout code", "Setup Go", "Install golangci-lint" ...
    - name: golangci-lint
      shell: bash
      env:
        GOGC: '25'
        GOMEMLIMIT: ${{ runner.environment == 'self-hosted' && '24GiB' || '8GiB' }}
        GOFLAGS: ${{ runner.environment != 'self-hosted' && '-gcflags=github.com/GoogleCloudPlatform/scion/pkg/hub=-c=1' || '' }}
        LINT_CONCURRENCY: ${{ runner.environment == 'self-hosted' && '4' || '2' }}
      run: |
        # ... unchanged, except the golangci-lint line (see note 4) ...
        golangci-lint run --new-from-merge-base=origin/main --concurrency="$LINT_CONCURRENCY" || rc=$?
    # ... unchanged "Save Go cache" step ...
