<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <!-- app-icons:start -- kept identical to pkg/hub/web.go; see TestSPAShellAppIconTags. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1e293b" />
  <!-- app-icons:end -->
  <title>Scion - Agent Orchestration Platform</title>
  <link rel="stylesheet" href="/node_modules/@shoelace-style/shoelace/dist/themes/light.css" />
  <link rel="stylesheet" href="/node_modules/@shoelace-style/shoelace/dist/themes/dark.css" />
  <script>
    // Apply saved theme immediately to prevent flash of wrong theme.
    (function() {
      var saved = localStorage.getItem('scion-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = saved ? saved === 'dark' : prefersDark;
      if (dark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('sl-theme-dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--scion-font-sans, system-ui, sans-serif); }
    body { background: var(--scion-bg, #f8fafc); color: var(--scion-text, #1e293b); }

    /* mobile-frame:start -- kept identical (modulo comments and
       indentation) to pkg/hub/web.go; see TestSPAShellIndexHTMLParity. */
    :root {
      --scion-app-height: 100vh;
    }
    @supports (height: 100dvh) {
      :root {
        --scion-app-height: 100dvh;
      }
    }

    html,
    body {
      overscroll-behavior: none;
    }

    #app {
      height: 100%;
      min-height: 0;
    }

    /* Frame mode: set by any app shell while mounted (see
       web/src/components/shared/app-frame.ts). Document-scrolling pages
       (login, invite, onboarding) never set it. */
    html.scion-app-frame,
    html.scion-app-frame body {
      overflow: hidden;
      height: 100%;
    }
    /* mobile-frame:end */
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
