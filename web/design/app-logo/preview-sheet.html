<!-- Preview sheet for one logo direction. Usage: preview-sheet.html?s=<svg>&t=<title> -->
<html><head><meta charset="utf-8"><style>
body{margin:0;font:14px system-ui,sans-serif}
.row{display:flex;align-items:flex-end;gap:28px;padding:28px 32px}
.light{background:#f8fafc;color:#1e293b}.dark{background:#0f172a;color:#e2e8f0}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
canvas{image-rendering:pixelated}
h1{font-size:18px;margin:0;padding:18px 32px;background:#fff;border-bottom:1px solid #e2e8f0}
</style></head><body>
<h1 id="t"></h1>
<div class="row light" id="r1"></div>
<div class="row dark" id="r2"></div>
<script>
const p=new URLSearchParams(location.search);const src=p.get('s');
document.getElementById('t').textContent=p.get('t');
function build(row){
  for(const s of [16,32,180,512]){
    const c=document.createElement('div');c.className='cell';
    const i=new Image();i.src=src;i.width=s;i.height=s;c.appendChild(i);
    const l=document.createElement('div');l.textContent=s+' px';c.appendChild(l);row.appendChild(c);
    if(s===16){ // 16px raster, zoomed 6x to show pixels
      const z=document.createElement('div');z.className='cell';
      const cv=document.createElement('canvas');cv.width=16;cv.height=16;cv.style.width='96px';cv.style.height='96px';
      const i2=new Image();i2.onload=()=>cv.getContext('2d').drawImage(i2,0,0,16,16);i2.src=src;
      z.appendChild(cv);const l2=document.createElement('div');l2.textContent='16 px (6x zoom)';z.appendChild(l2);row.appendChild(z);
    }
  }
}
build(document.getElementById('r1'));build(document.getElementById('r2'));
</script></body></html>
